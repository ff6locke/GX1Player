                  playingUri = uri
                  engine.open(uri, resumeAt, digitalOutput = passthrough)
                  loadSecondSubtitleOverlay()

                  // Silent Media3 timeline/controller clock. LibVLC alone renders video and audio.
                  val clock = ExoPlayer.Builder(this).build()
                  clock.trackSelectionParameters = clock.trackSelectionParameters.buildUpon()
                      .setTrackTypeDisabled(C.TRACK_TYPE_AUDIO, true)
                      .setTrackTypeDisabled(C.TRACK_TYPE_VIDEO, true)
                      .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true)
                      .build()
                  clock.setSeekBackIncrementMs(10_000L)
                  clock.setSeekForwardIncrementMs(10_000L)
                  clock.setMediaItem(buildMediaItem(uri), resumeAt)
                  clock.prepare()
                  mainVlcControllerClock = clock

                  val controller = object : ForwardingPlayer(clock) {
                      override fun play() { mainVlcEngine?.play(); super.play() }
                      override fun pause() { mainVlcEngine?.pause(); super.pause() }
                      override fun setPlayWhenReady(playWhenReady: Boolean) {
                          if (playWhenReady) mainVlcEngine?.play() else mainVlcEngine?.pause()
                          super.setPlayWhenReady(playWhenReady)
                      }
                      override fun seekTo(positionMs: Long) {
                          mainVlcEngine?.seekTo(positionMs)
                          super.seekTo(positionMs)
                      }
                      override fun seekTo(mediaItemIndex: Int, positionMs: Long) {
                          mainVlcEngine?.seekTo(positionMs)
                          super.seekTo(mediaItemIndex, positionMs)
                      }
                      override fun seekBack() {
                          val e = mainVlcEngine ?: return
                          e.seekTo((e.currentTimeMs() - 10_000L).coerceAtLeast(0L))
                          super.seekBack()
                      }
                      override fun seekForward() {
                          val e = mainVlcEngine ?: return
                          val next = e.currentTimeMs() + 10_000L
                          val duration = e.durationMs()
                          e.seekTo(if (duration > 0L) next.coerceAtMost(duration) else next)
                          super.seekForward()
                      }
                      override fun getCurrentPosition(): Long =
                          mainVlcEngine?.currentTimeMs() ?: super.getCurrentPosition()
                      override fun getDuration(): Long =
                          mainVlcEngine?.durationMs()?.takeIf { it > 0L } ?: super.getDuration()
                      // Supply a real one-window Media3 timeline from LibVLC metadata.
                      // PlayerControlView hides its time bar when the clock's timeline is empty,
                      // even when duration and seek commands are overridden.
                      override fun getCurrentTimeline(): Timeline {
                          val durationMs = mainVlcEngine?.durationMs() ?: 0L
                          return if (durationMs > 0L) {
                              SinglePeriodTimeline(
                                  durationMs * 1000L,
                                  true,
                                  false,
                                  false,
                                  null,
                                  buildMediaItem(uri)
                              )
                          } else {
                              super.getCurrentTimeline()
                          }
                      }
                      // Media3's hidden clock may mark transport streams as unseekable.
                      // Use LibVLC's real duration/seek support so the controller timeline stays visible.
                      override fun isCurrentMediaItemSeekable(): Boolean =
                          (mainVlcEngine?.durationMs() ?: 0L) > 0L
                      // ForwardingPlayer normally inherits the hidden ExoPlayer clock's
                      // command set. For M2TS that clock can omit seek commands even though
                      // LibVLC has a seekable timeline. Explicitly advertise those commands.
                      override fun getAvailableCommands(): Player.Commands {
                          val commands = Player.Commands.Builder()
                              .addAll(super.getAvailableCommands())
                          if ((mainVlcEngine?.durationMs() ?: 0L) > 0L) {
                              commands.add(Player.COMMAND_SEEK_IN_CURRENT_MEDIA_ITEM)
                                  .add(Player.COMMAND_SEEK_BACK)
                                  .add(Player.COMMAND_SEEK_FORWARD)
                          }
                          return commands.build()
                      }
                      override fun isCommandAvailable(command: Int): Boolean =
                          if (command == Player.COMMAND_SEEK_IN_CURRENT_MEDIA_ITEM ||
                              command == Player.COMMAND_SEEK_BACK ||
                              command == Player.COMMAND_SEEK_FORWARD) {
                              (mainVlcEngine?.durationMs() ?: 0L) > 0L
                          } else super.isCommandAvailable(command)
                      override fun isPlaying(): Boolean =
                          mainVlcEngine?.isPlaying() ?: super.isPlaying()
                      override fun getPlayWhenReady(): Boolean =
                          mainVlcEngine?.isPlaying() ?: super.getPlayWhenReady()
                      override fun getPlaybackState(): Int =
                          if (mainVlcEngine != null) Player.STATE_READY else super.getPlaybackState()
                  }
                  mainVlcControllerPlayer = controller
                  playerView.player = controller
                  // Also handle files whose LibVLC length is known before attachment.
                  if (engine.durationMs() > 0L) {
                      vlcTimelineBound = true
                      playerView.player = null
                      playerView.player = controller
                  }
                  if (engine.isPlaying()) clock.playWhenReady = true
                  playerView.showController()
                  // The stock controller can disable its scrubber based on the silent
                  // ExoPlayer clock's M2TS capabilities. LibVLC is the real seek engine,
                  // so keep Media3's existing scrubber enabled for the user.
                  playerView.findViewById<android.view.View>(androidx.media3.ui.R.id.exo_progress)?.apply {
                      visibility = View.VISIBLE
                      isEnabled = true
                      isClickable = true
                      isFocusable = true
                      alpha = 1f
                  }
                  playerView.findViewById<android.widget.TextView>(androidx.media3.ui.R.id.exo_position)?.apply {
                      visibility = View.VISIBLE
                      alpha = 1f
                  }
                  playerView.findViewById<android.widget.TextView>(androidx.media3.ui.R.id.exo_duration)?.apply {
                      visibility = View.VISIBLE
                      alpha = 1f
                  }
                  playerView.findViewById<android.view.View>(androidx.media3.ui.R.id.exo_settings)
                      ?.setOnClickListener { showMenu() }
              } catch (e: Exception) {
                  mainVlcEngine?.release()
                  mainVlcEngine = null
                  mainVlcControllerClock?.release()
                  mainVlcControllerClock = null
                  mainVlcControllerPlayer = null
                  mainVlcLayout.visibility = View.GONE
                  mainVlcBar.visibility = View.GONE
                  playerView.player = null
                  playerView.visibility = View.VISIBLE
                  mainVlcSelected = false
                  prefs.edit().putBoolean("main_vlc_selected", false).apply()
                  Toast.makeText(this, "LibVLC failed; switched back to Media3: " + (e.message ?: e.javaClass.simpleName), Toast.LENGTH_LONG).show()
                  startPlayer()
              }
          }
          '''
          s = s[:start] + new_method + s[end:]

          release_start = s.find('    private fun releasePlayer()')
          release_end = s.find('// ---------- resume ----------', release_start)
          release_block = s[release_start:release_end]
          if 'mainVlcControllerClock?.release()' not in release_block:
              s = s.replace('          mainVlcEngine = null\n          if (::mainVlcLayout.isInitialized)',
                            '          mainVlcEngine = null\n          playerView.player = null\n          mainVlcControllerClock?.release()\n          mainVlcControllerClock = null\n          mainVlcControllerPlayer = null\n          if (::mainVlcLayout.isInitialized)', 1)


          /** Full-screen LibVLC playback route used to validate the VLC engine on GX1 hardware. */
          class VlcTestActivity : AppCompatActivity() {
              private var engine: Gx1LibVlcEngine? = null
              private lateinit var status: TextView
              private lateinit var position: TextView
              private lateinit var seek: SeekBar
              private lateinit var playButton: Button
              private var dragging = false
              private var mediaUri: Uri? = null
              private var digitalOutput = true
              private lateinit var outputButton: Button
              private val handler = Handler(Looper.getMainLooper())
              private val prefs by lazy { getSharedPreferences("gx1_player", MODE_PRIVATE) }

              private val ticker = object : Runnable {
                  override fun run() {
                      val active = engine
                      if (active != null && !dragging) {
                          val duration = active.durationMs()
                          val current = active.currentTimeMs()
                          seek.max = 1000
                          seek.progress = if (duration > 0L) {
                              ((current * 1000L) / duration).toInt().coerceIn(0, 1000)
                          } else 0
                          position.text = formatTime(current) + " / " + formatTime(duration)
                          playButton.text = if (active.isPlaying()) "Pause" else "Play"
                      }
                      handler.postDelayed(this, 500L)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY)

                  val uri = intent.data
                  if (uri == null) {
                      Toast.makeText(this, "No video selected for VLC playback", Toast.LENGTH_LONG).show()
                      finish()
                      return
                  }
                  mediaUri = uri
                  val resumeAt = prefs.getLong("pos|" + uri.toString(), 0L)

                  val root = FrameLayout(this).apply { setBackgroundColor(android.graphics.Color.BLACK) }
                  val video = org.videolan.libvlc.util.VLCVideoLayout(this)
                  root.addView(video, FrameLayout.LayoutParams(-1, -1))

                  val controls = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(18, 12, 18, 12)
                      setBackgroundColor(0x99000000.toInt())
                  }
                  status = TextView(this).apply {
                      text = "VLC opening media…"
                      setTextColor(android.graphics.Color.WHITE)
                      textSize = 14f
                  }
                  position = TextView(this).apply {
                      text = "00:00 / 00:00"
                      setTextColor(android.graphics.Color.WHITE)
                      textSize = 13f
                  }
                  seek = SeekBar(this).apply {
                      isFocusable = true
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onStartTrackingTouch(bar: SeekBar?) { dragging = true }
                          override fun onStopTrackingTouch(bar: SeekBar?) {
                              val duration = engine?.durationMs() ?: 0L
                              if (duration > 0L) engine?.seekTo(duration * seek.progress / 1000L)
                              dragging = false
                          }
                          override fun onProgressChanged(bar: SeekBar?, progress: Int, fromUser: Boolean) {}
                      })
                  }

                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER

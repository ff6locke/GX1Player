      - name: Add real audio track selection
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          marker = "    private fun showMenu() {"
          method = r'''    private fun showAudioTrackSelection() {
                  val exo = player
                  if (exo == null) {
                      Toast.makeText(this, "No player is active.", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val audioGroups = exo.currentTracks.groups.filter {
                      it.type == androidx.media3.common.C.TRACK_TYPE_AUDIO
                  }
                  val choices = mutableListOf<Pair<androidx.media3.common.TrackGroup, Int>>()
                  val labels = mutableListOf<String>()
                  labels.add("Auto (default)")
                  for (group in audioGroups) {
                      for (index in 0 until group.length) {
                          val supported = group.isTrackSupported(index)
                          val format = group.getTrackFormat(index)
                          val language = format.language
                              ?.takeIf { it.isNotBlank() && it != "und" }
                              ?.let { java.util.Locale.forLanguageTag(it).getDisplayLanguage(java.util.Locale.getDefault()) }
                              ?.takeIf { it.isNotBlank() }
                          val name = format.label?.takeIf { it.isNotBlank() }
                          val mime = format.sampleMimeType.orEmpty().lowercase(java.util.Locale.ROOT)
                          val codecs = format.codecs.orEmpty().lowercase(java.util.Locale.ROOT)
                          val codecLabel = when {
                              mime.contains("eac3-joc") || codecs.contains("ec+3") ||
                                  name?.contains("atmos", ignoreCase = true) == true -> "Dolby Atmos"
                              mime.contains("truehd") || codecs.contains("mlp") -> "Dolby TrueHD"
                              mime.contains("eac3") || codecs.contains("ec-3") -> "Dolby Digital Plus"
                              mime.contains("ac3") || codecs.contains("ac-3") -> "Dolby Digital"
                              mime.contains("dts") || codecs.contains("dts") -> when {
                                  codecs.contains("dts-hd") || mime.contains("dts-hd") -> "DTS-HD"
                                  else -> "DTS"
                              }
                              mime.contains("aac") || codecs.contains("mp4a") -> "AAC"
                              mime.contains("flac") -> "FLAC"
                              mime.contains("opus") -> "Opus"
                              mime.contains("mpeg") -> "MPEG Audio"
                              else -> null
                          }
                          val channels = when (format.channelCount) {
                              1 -> "Mono"
                              2 -> "Stereo"
                              3 -> "2.1"
                              4 -> "4.0"
                              5 -> "5.0"
                              6 -> if (codecLabel?.startsWith("DTS") == true) "5.1" else "5.1"
                              7 -> "6.1"
                              8 -> "7.1"
                              else -> null
                          }
                          val details = listOfNotNull(
                              name,
                              codecLabel,
                              channels,
                              language,
                              format.sampleRate.takeIf { it > 0 }?.let { "${it / 1000} kHz" }
                          ).distinct().joinToString(" · ")
                          val fallback = "Audio ${choices.size + 1}"
                          labels.add(if (details.isBlank()) fallback else details)
                          choices.add(group.mediaTrackGroup to index)
                      }
                  }
                  if (choices.isEmpty()) {
                      Toast.makeText(this, "No selectable audio tracks found in this video.", Toast.LENGTH_LONG).show()
                      return
                  }
                  var flat = 0
                  var selectedChoice = 0
                  loop@ for (group in audioGroups) {
                      for (index in 0 until group.length) {
                          if (!group.isTrackSupported(index)) continue
                          if (group.isTrackSelected(index)) {
                              selectedChoice = flat + 1
                              break@loop
                          }
                          flat++
                      }
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Audio track")
                      .setSingleChoiceItems(labels.toTypedArray(), selectedChoice) { dialog, which ->
                          val builder = exo.trackSelectionParameters.buildUpon()
                              .clearOverridesOfType(androidx.media3.common.C.TRACK_TYPE_AUDIO)
                              .setTrackTypeDisabled(androidx.media3.common.C.TRACK_TYPE_AUDIO, false)
                          if (which > 0) {
                              val (trackGroup, trackIndex) = choices[which - 1]
                              builder.addOverride(
                                  androidx.media3.common.TrackSelectionOverride(trackGroup, listOf(trackIndex))
                              )
                          }
                          exo.trackSelectionParameters = builder.build()
                          dialog.dismiss()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

          '''
          if "private fun showAudioTrackSelection()" not in s:
              if marker not in s:
                  raise SystemExit("Could not find showMenu() insertion point for audio selector")
              s = s.replace(marker, method + marker, 1)
          old = '''"audio" -> Toast.makeText(this, "Choose an audio track from the available player tracks.", Toast.LENGTH_SHORT).show()'''
          new = '''"audio" -> {
                                  menuPopupRef?.dismiss()
                                  showAudioTrackSelection()
                              }'''
          if old in s:
              s = s.replace(old, new, 1)
          elif '"audio" -> {' not in s or "showAudioTrackSelection()" not in s:
              raise SystemExit("Could not find audio placeholder to replace")
          p.write_text(s)
          print("Added Media3 audio track listing and selection.")
          PY

      - name: Diagnose missing embedded audio tracks and limit native APK ABIs

                              if (actual != selected.id && attempt < 20) {
                                  android.util.Log.w("GX1Player", "Audio restore not applied yet; retry=" + (attempt + 1))
                                  restoreMainVlcAudioTrack(attempt + 1)
                              } else {
                                  android.util.Log.i("GX1Player", "Audio restore verified saved=" + selected.id + " actual=" + actual)
                              }
                          }, 500L)"""
          s, audio_count = re.subn(audio_pattern, lambda _: audio_replacement, s, count=1)
          if audio_count != 1: raise SystemExit("Audio restore verification anchor missing; matches=" + str(audio_count))
          subtitle_pattern = r'engine\.selectSubtitleTrack\(selected\.id\)\s+android\.util\.Log\.i\("GX1Player", "Restored saved embedded subtitle " \+ selected\.id\)'
          subtitle_replacement = """engine.selectSubtitleTrack(selected.id)
                          subtitleUiHandler.postDelayed({
                              val actual = runCatching { engine.selectedSubtitleTrackId() }.getOrDefault(Int.MIN_VALUE)
                              if (actual != selected.id && attempt < 20) {
                                  android.util.Log.w("GX1Player", "Embedded subtitle restore not applied yet; retry=" + (attempt + 1))
                                  restoreMainVlcSubtitleTrack(attempt + 1)
                              } else {
                                  android.util.Log.i("GX1Player", "Embedded subtitle restore verified saved=" + selected.id + " actual=" + actual)
                              }
                          }, 500L)"""
          s, subtitle_count = re.subn(subtitle_pattern, lambda _: subtitle_replacement, s, count=1)
          if subtitle_count != 1: raise SystemExit("Subtitle restore verification anchor missing; matches=" + str(subtitle_count))
          if "val video = currentVideoFile() ?: return" in s:
              raise SystemExit("Document-URI subtitle restore guard remains")
          if s.count("restore verified saved=") != 2:
              raise SystemExit("Track restore verification was not applied to both track types")
          p.write_text(s)
          print("Track restore verification patch applied.")
          PY
      - name: Fix custom Subtitle 1 restart state and remove duplicate subtitle restore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          old = """if (slot == 1) {
                                  subtitleUri = uri"""
          new = """if (slot == 1) {
                                  subtitleUri = uri
                                  subtitle1Uri = uri"""
          if old in s:
              s = s.replace(old, new, 1)
          else:
              picker_start = s.find("private fun showSubtitleFilePicker")
              slot_start = s.find("if (slot == 1) {", picker_start)
              slot_end = s.find("} else {", slot_start)
              if picker_start < 0 or slot_start < 0 or slot_end < 0 or "subtitle1Uri = uri" not in s[slot_start:slot_end]:
                  raise SystemExit("Could not locate Subtitle 1 TV-picker assignment")
          pattern = re.compile(
              r'(?m)^(?P<i>\s*)mainVlcAutoSubtitleFiles\.clear\(\)\n'
              r'\s*subtitleUiHandler\.postDelayed\(\{ autoLoadMainVlcSubtitles\(engine\) \}, 1200L\)\n'
              r'\s*mainVlcAutoSubtitleFiles\.clear\(\)\n'
              r'\s*subtitleUiHandler\.postDelayed\(\{ autoLoadMainVlcSubtitles\(engine\) \}, 1200L\)'
          )
          s, count = pattern.subn(
              lambda m: m.group("i") + "mainVlcAutoSubtitleFiles.clear()\n" +
                        m.group("i") + "subtitleUiHandler.postDelayed({ autoLoadMainVlcSubtitles(engine) }, 1200L)",
              s, count=1
          )
          if count != 1:
              raise SystemExit("Expected duplicated automatic subtitle restore schedule; found " + str(count))
          if "subtitle1Uri = uri" not in s:
              raise SystemExit("Subtitle 1 URI assignment verification failed")
          if len(re.findall(r'mainVlcAutoSubtitleFiles\.clear\(\)', s)) > 1:
              raise SystemExit("Duplicate subtitle-list clearing remains")
          restore_schedules = len(re.findall(r'autoLoadMainVlcSubtitles\(engine\) \}, 1200L', s))
          if restore_schedules not in (1, 2):
              raise SystemExit("Expected initial and optional restart subtitle restore schedules; found " + str(restore_schedules))
          p.write_text(s)
          print("Fixed Subtitle 1 URI state for the TV file browser and removed the duplicate subtitle restore task.")
          PY
      - name: Add persistent Media3 / LibVLC engine selector
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          old = "        mainVlcSelected = true"
          new = '        mainVlcSelected = prefs.getBoolean("gx1_use_libvlc_engine", true)'
          if old in s:
              if s.count(old) != 1:
                  raise SystemExit("Expected one default LibVLC engine selection")
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("Could not locate startup engine selection")
          anchor = '        add("Built-in subtitle tracks") { showSubtitleTrackSelection() }'
          selector = """        add(if (mainVlcSelected) "Playback Engine: LibVLC (switch to Media3)" else "Playback Engine: Media3 (switch to LibVLC)") {
                      val uri = mediaUri
                      if (uri == null) {
                          Toast.makeText(this, "Open a video before changing playback engine", Toast.LENGTH_SHORT).show()
                      } else {
                          mainVlcSelected = !mainVlcSelected
                          prefs.edit().putBoolean("gx1_use_libvlc_engine", mainVlcSelected).apply()
                          startPlayer()
                      }
                  }
          """
          if selector.strip() not in s:
              if s.count(anchor) != 1:
                  raise SystemExit("Could not locate unique playback menu insertion point")
              s = s.replace(anchor, selector + anchor, 1)
          if 'prefs.getBoolean("gx1_use_libvlc_engine", true)' not in s:
              raise SystemExit("Playback engine preference is not loaded at startup")
          if 'putBoolean("gx1_use_libvlc_engine", mainVlcSelected)' not in s:
              raise SystemExit("Playback engine preference is not saved on switch")
          if 'Playback Engine: LibVLC (switch to Media3)' not in s:
              raise SystemExit("Playback engine selector menu item missing")
          p.write_text(s)
          print("Added persistent playback engine selector; switching restarts the current video through the selected engine.")
          PY
      - name: Restore Media3 video surface
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s=p.read_text()
          a="        val renderers = if (passthrough) {"
          b = (
              "        playerView.visibility = View.VISIBLE\n"
              + "        playerView.findViewById<View>(androidx.media3.ui.R.id.exo_content_frame)?.visibility = View.VISIBLE\n"
              + "        fun restore(g: android.view.ViewGroup) { for (i in 0 until g.childCount) { val v=g.getChildAt(i); if (v is android.view.SurfaceView || v is android.view.TextureView) v.visibility=View.VISIBLE else if (v is android.view.ViewGroup) restore(v) } }\n"
              + "        restore(playerView)\n"
              + a
          )
          if "restore(playerView)" not in s:
              if s.count(a)!=1: raise SystemExit("Media3 renderer anchor missing or ambiguous")
              s=s.replace(a,b,1)
              p.write_text(s)
          PY
      - name: Export final post-persistence Kotlin source for review
        working-directory: ${{ env.PROJECT_DIR }}

          if start < 0 or end < 0:
              raise SystemExit("Could not isolate selectMedia()")
          block = s[start:end]
          if "updateGx1PlaybackQueue(uri)" not in block:
              if "mediaUri = uri" not in block:
                  raise SystemExit("selectMedia() no longer assigns mediaUri")
              block = block.replace("mediaUri = uri", "mediaUri = uri\n        updateGx1PlaybackQueue(uri)", 1)
              s = s[:start] + block + s[end:]

          attach = s.find("mainVlcControllerPlayer = controller")
          if attach < 0:
              raise SystemExit("Main LibVLC Media3 controller assignment missing")
          attach_end = s.find("playerView.player = controller", attach)
          if attach_end < 0:
              raise SystemExit("Main LibVLC PlayerView attachment missing")
          attach_end += len("playerView.player = controller")
          start = s.find("private fun startMainLibVlc(uri: Uri)")
          start_end = s.find("\n    private fun ", start + 10)
          if start < 0 or start_end < 0:
              raise SystemExit("Could not locate main LibVLC startup method")
          startup = s[start:start_end]
          if "installGx1FileNavigationButtons()" not in startup:
              insert_at = s.find("playerView.player = controller", start, start_end) + len("playerView.player = controller")
              s = s[:insert_at] + "\n                  installGx1FileNavigationButtons()" + s[insert_at:]

          if "private fun playAdjacentGx1File(direction: Int)" not in s:
              raise SystemExit("Previous/next playback navigation helper missing")
          p.write_text(s)
          print("Added same-folder previous/next playback controls for file, MediaStore, and SAF tree selections.")
          PY


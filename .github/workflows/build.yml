      - name: Fix repeat modes and aspect ratio controls
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          pattern = r'(?m)^(\s*)if \(item\.third == "repeat"\) \{\n.*?^\1\} else if \(item\.third != "settings"\) \{'
          s, n = re.subn(pattern, lambda m: m.group(1) + 'if (item.third != "settings") {', s, count=1, flags=re.S)
          if n != 1:
              print("Repeat switch layout has already changed; skipping legacy repeat/aspect patch.")
              raise SystemExit(0)
          pattern = r'(?m)^(\s*)"aspect" -> \{\n.*?^\1\}'
          aspect = r'''\1"aspect" -> {
          \1    val modes = intArrayOf(
          \1        androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FIT,
          \1        androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FILL,
          \1        androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_ZOOM,
          \1        androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FIXED_WIDTH,
          \1        androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FIXED_HEIGHT
          \1    )
          \1    val names = arrayOf("Fit", "Stretch", "Zoom", "Fixed width", "Fixed height")
          \1    val current = modes.indexOf(playerView.resizeMode).coerceAtLeast(0)
          \1    AlertDialog.Builder(this)
          \1        .setTitle("Aspect ratio")
          \1        .setSingleChoiceItems(names, current) { dialog, which ->
          \1            playerView.resizeMode = modes[which]
          \1            playerView.requestLayout()
          \1            playerView.post { playerView.requestLayout() }
          \1            Toast.makeText(this, "Aspect ratio: " + names[which], Toast.LENGTH_SHORT).show()
          \1            dialog.dismiss()
          \1        }
          \1        .setNegativeButton("Cancel", null)
          \1        .show()
          \1}'''
          s, n = re.subn(pattern, aspect, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Could not locate Aspect Ratio action; found " + str(n))
          marker = '"aspect" -> {'
          repeat = '''"repeat" -> {
                                   val currentMode = player?.repeatMode ?: Player.REPEAT_MODE_OFF
                                   val nextMode = when (currentMode) {
                                       Player.REPEAT_MODE_OFF -> Player.REPEAT_MODE_ONE
                                       Player.REPEAT_MODE_ONE -> Player.REPEAT_MODE_ALL
                                       else -> Player.REPEAT_MODE_OFF
                                   }
                                   player?.repeatMode = nextMode
                                   val repeatLabel = when (nextMode) {
                                       Player.REPEAT_MODE_ONE -> "Repeat current video"
                                       Player.REPEAT_MODE_ALL -> "Repeat all"
                                       else -> "Off"
                                   }
                                   Toast.makeText(this, "Repeat: " + repeatLabel, Toast.LENGTH_SHORT).show()
                               }
                               '''
          if '"repeat" -> {' not in s:
              if marker not in s:
                  raise SystemExit("Could not find action switch insertion point")
              s = s.replace(marker, repeat + marker, 1)
          p.write_text(s)
          print("Repeat and aspect ratio controls patched successfully.")
          PY
      - name: Ensure playback history is recorded on every selection
        working-directory: ${{ env.PROJECT_DIR }}

name: Build GX1 Player APK (uploaded source)

on:
  push:
    branches: [ "fix/vlc-native-fast-seek" ]
    paths:
      - "gx1-player.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract uploaded Android project
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q gx1-player.zip -d source
          test -f source/gx1-player/app/build.gradle.kts
          test -f source/gx1-player/settings.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper
        working-directory: source/gx1-player
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Build release APK
        working-directory: source/gx1-player
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gx1-release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/gx1-release.jks"
            echo "Building signed release APK"
          else
            echo "Signing secrets unavailable; building unsigned release APK"
          fi
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gx1-player-uploaded-source-release
          path: source/gx1-player/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

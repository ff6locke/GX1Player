                      Triple("⇄", "Repeat", "repeat"),
                      Triple("◷", "Sleep Timer", "sleep"),
                      Triple("☷", "Settings", "settings")
                  )
                  rows.forEachIndexed { index, item ->
                      if (index == 3) {
                          panel.addView(android.view.View(this).apply {
                              setBackgroundColor(android.graphics.Color.rgb(82, 84, 88))
                          }, android.widget.LinearLayout.LayoutParams(-1, dp(1)).apply {
                              setMargins(dp(8), dp(5), dp(8), dp(5))
                          })
                      }
                      val row = android.widget.LinearLayout(this).apply {
                          orientation = android.widget.LinearLayout.HORIZONTAL
                          gravity = android.view.Gravity.CENTER_VERTICAL
                          setPadding(dp(12), 0, dp(10), 0)
                          minimumHeight = dp(46)
                          isClickable = true
                          isFocusable = true
                          background = android.graphics.drawable.GradientDrawable().apply {
                              setColor(android.graphics.Color.TRANSPARENT)
                              cornerRadius = dp(10).toFloat()
                          }
                      }
                      row.addView(android.widget.TextView(this).apply {
                          text = item.first
                          setTextColor(android.graphics.Color.WHITE)
                          textSize = 27f
                          gravity = android.view.Gravity.CENTER
                          layoutParams = android.widget.LinearLayout.LayoutParams(dp(46), -1)
                      })
                      row.addView(android.widget.TextView(this).apply {
                          text = item.second
                          setTextColor(android.graphics.Color.WHITE)
                          textSize = 16f
                          gravity = android.view.Gravity.CENTER_VERTICAL
                          layoutParams = android.widget.LinearLayout.LayoutParams(0, -1, 1f)
                      })
                      if (item.third == "repeat") {
                          row.addView(android.widget.Switch(this).apply {
                              isChecked = player?.repeatMode == Player.REPEAT_MODE_ONE ||
                                  player?.repeatMode == Player.REPEAT_MODE_ALL
                              setOnCheckedChangeListener { _, checked ->
                                  player?.repeatMode = if (checked) Player.REPEAT_MODE_ONE else Player.REPEAT_MODE_OFF
                              }
                          })
                      } else if (item.third != "settings") {
                          row.addView(android.widget.TextView(this).apply {
                              text = "›"
                              setTextColor(android.graphics.Color.WHITE)
                              textSize = 30f
                              gravity = android.view.Gravity.CENTER
                              layoutParams = android.widget.LinearLayout.LayoutParams(dp(30), -1)
                          })
                      }
                      row.setOnFocusChangeListener { view, focused ->
                          view.background = android.graphics.drawable.GradientDrawable().apply {
                              setColor(if (focused) android.graphics.Color.rgb(65, 67, 72) else android.graphics.Color.TRANSPARENT)
                              cornerRadius = dp(10).toFloat()
                          }
                      }
                      row.setOnClickListener {
                          menuPopupRef?.dismiss()
                          when (item.third) {
                              "speed" -> {
                                  val speeds = arrayOf("0.25×", "0.5×", "0.75×", "1.0×", "1.25×", "1.5×", "2.0×")
                                  val values = floatArrayOf(.25f, .5f, .75f, 1f, 1.25f, 1.5f, 2f)
                                  AlertDialog.Builder(this).setTitle("Playback Speed")
                                      .setItems(speeds) { _, which -> player?.setPlaybackSpeed(values[which]) }.show()
                              }
                              "audio" -> Toast.makeText(this, "Choose an audio track from the available player tracks.", Toast.LENGTH_SHORT).show()
                              "subtitle" -> AlertDialog.Builder(this)
                                  .setTitle("Load subtitles")
                                  .setItems(arrayOf("Load subtitle 1", "Load subtitle 2")) { _, which ->
                                      val types = arrayOf("application/x-subrip", "text/vtt", "text/plain", "application/octet-stream")
                                      if (which == 0) pickSubtitle.launch(types) else pickSubtitle2.launch(types)
                                  }
                                  .show()
                              "aspect" -> {
                                  val modes = intArrayOf(
                                      androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FIT,
                                      androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_FILL,
                                      androidx.media3.ui.AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                                  )
                                  val names = arrayOf("Fit", "Fill", "Zoom")
                                  val next = (modes.indexOf(playerView.resizeMode) + 1).let { if (it < 0) 0 else (it + 1) % modes.size }
                                  playerView.resizeMode = modes[next]
                                  Toast.makeText(this, "Aspect ratio: " + names[next], Toast.LENGTH_SHORT).show()
                              }
                              "sleep" -> {
                                  val choices = arrayOf("15 minutes", "30 minutes", "45 minutes", "60 minutes", "90 minutes")
                                  AlertDialog.Builder(this).setTitle("Sleep Timer")
                                      .setItems(choices) { _, which ->
                                          val mins = intArrayOf(15, 30, 45, 60, 90)[which]
                                          android.os.Handler(android.os.Looper.getMainLooper()).postDelayed({
                                              player?.pause()
                                              Toast.makeText(this, "Sleep timer ended", Toast.LENGTH_SHORT).show()
                                          }, mins * 60_000L)
                                          Toast.makeText(this, "Sleep timer set: $mins minutes", Toast.LENGTH_SHORT).show()
                                      }.show()
                              }
                              "settings" -> {
                                  val settings = labels.toTypedArray()
                                  AlertDialog.Builder(this).setTitle("Settings")
                                      .setItems(settings) { _, which -> actions[which].invoke() }.show()
                              }
                          }
                      }
                      panel.addView(row)
                  }
                  val popupContent = android.widget.FrameLayout(this)
                  popupContent.addView(panel, android.widget.FrameLayout.LayoutParams(dp(316), -2,
                      android.view.Gravity.TOP or android.view.Gravity.CENTER_HORIZONTAL))
                  val pointer = object : android.view.View(this) {
                      private val paint = android.graphics.Paint(3).apply {
                          color = android.graphics.Color.rgb(35, 36, 39)
                          style = android.graphics.Paint.Style.FILL
                      }
                      override fun onDraw(canvas: android.graphics.Canvas) {
                          super.onDraw(canvas)
                          val path = android.graphics.Path().apply {
                              moveTo(width / 2f - dp(12), 0f)
                              lineTo(width / 2f + dp(12), 0f)
                              lineTo(width / 2f, dp(13).toFloat())
                              close()
                          }
                          canvas.drawPath(path, paint)
                      }
                  }
                  val pointerParams = android.widget.FrameLayout.LayoutParams(dp(28), dp(14),
                      android.view.Gravity.BOTTOM or android.view.Gravity.END).apply {
                      marginEnd = dp(20)
                  }
                  popupContent.addView(pointer, pointerParams)
                  val popup = android.widget.PopupWindow(popupContent, dp(336), dp(350), true).apply {
                      isOutsideTouchable = true
                      setBackgroundDrawable(android.graphics.drawable.ColorDrawable(android.graphics.Color.TRANSPARENT))
                      elevation = dp(20).toFloat()
                  }
                  menuPopupRef = popup
                  if (::menuButtonRef.isInitialized && menuButtonRef.isAttachedToWindow) {
                      popup.showAsDropDown(menuButtonRef, 0, -dp(350), android.view.Gravity.END)
                  } else {
                      popup.showAtLocation(window.decorView, android.view.Gravity.BOTTOM or android.view.Gravity.END,
                          dp(30), dp(94))
                  }
          """
          if "menuPopupRef" not in s:
              field = "    private var player: ExoPlayer? = null"
              if field not in s:
                  raise SystemExit("Player field insertion point missing")
              s = s.replace(field, field + "\n    private var menuPopupRef: android.widget.PopupWindow? = null", 1)
          if old not in s:
              raise SystemExit("Could not locate original GX1 Player menu dialog")
          s = s.replace(old, replacement, 1)
          p.write_text(s)
          print("Installed touch-friendly VLC-style floating menu panel.")

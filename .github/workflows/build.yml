      - name: Configure LibVLC digital output after media assignment
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/example/gx1player/playback/Gx1LibVlcEngine.kt")
          s = p.read_text()
          s = re.sub(
              r'(?m)^\s*mediaPlayer\.setAudioOutputDevice\([^\n]*\)\s*\n',
              '',
              s
          )
          s = re.sub(
              r'(?m)^\s*mediaPlayer\.setAudioDigitalOutputEnabled\(digitalOutput\)\s*\n',
              '',
              s
          )
          anchor = "mediaPlayer.media = media"
          if anchor not in s:
              raise SystemExit("Could not find LibVLC media assignment")
          output_config = """if (digitalOutput) {
                      val accepted = mediaPlayer.forceAudioDigitalEncodings(intArrayOf(5, 6, 7, 8, 14))
                      android.util.Log.i("GX1-VLC", "Selective surround passthrough configured=$accepted")
                  } else {
                      val accepted = mediaPlayer.setAudioOutputDevice("stereo")
                      android.util.Log.i("GX1-VLC", "Stereo compatibility output configured=$accepted")
                  }"""
          if "forceAudioDigitalEncodings(intArrayOf(5, 6, 7, 8, 14))" not in s:
              s = s.replace(anchor, anchor + chr(10) + "                  " + output_config, 1)
          if s.count('mediaPlayer.setAudioOutputDevice("stereo")') != 1:
              raise SystemExit("Expected exactly one explicit stereo compatibility output configuration")
          if "setAudioOutputDevice(" in s and s.count("setAudioOutputDevice(") != 1:
              raise SystemExit("Unexpected additional LibVLC audio-device override remains")
          p.write_text(s)
          print("LibVLC now explicitly selects 8-channel PCM when passthrough is disabled and retains selective encoded passthrough when enabled.")
          PY

              }
          }
          """
          s = s[:start] + new_method + s[end:]
          old_sig = "private fun browseGX1Folder(folder: java.io.File, selectingLibrary: Boolean, foldersOnly: Boolean = false)"
          if s.count(old_sig) != 1:
              raise SystemExit("Unexpected GX1 folder-browser signature")
          s = s.replace(old_sig, "private fun browseGX1Folder(folder: java.io.File, selectingLibrary: Boolean, foldersOnly: Boolean = false, libraryMode: Boolean = false)", 1)
          edits = [
              ("browseGX1Folder(current.parentFile!!, selectingLibrary, foldersOnly)", "browseGX1Folder(current.parentFile!!, selectingLibrary, foldersOnly, libraryMode)"),

name: Build GX1 Player APK
# Re-run after correcting the MKV URI and extractor configuration

on:
  push:
    branches: [ main ]
    paths:
      - 'gx1-player.zip'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: gx1-player-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIP_FILE: gx1-player.zip
  PROJECT_DIR: gx1-player
  GRADLE_VERSION: '8.7'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          test -f "$ZIP_FILE"
          unzip -oq "$ZIP_FILE" -d .
          test -f "$PROJECT_DIR/settings.gradle.kts"

      - name: Inspect original menu implementation
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if "private fun showMenu" in line:
                  print("=== ORIGINAL showMenu() ===")
                  for j in range(i, min(i + 150, len(lines))):
                      print(f"{j+1}: {lines[j]}")
                  break
          else:
              raise SystemExit("showMenu() not found")
          PY

      - name: Install GX1 Player TV app icon
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/drawable/ic_gx1_launcher_foreground.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFB300" android:pathData="M54,8 A46,46 0,1 0,54 100 A46,46 0,1 0,54 8 M54,17 A37,37 0,1 1,54 91 A37,37 0,1 1,54 17" android:fillType="evenOdd"/>
              <path android:fillColor="#E8EDF5" android:pathData="M17,33 L25,27 L31,35 L23,41 Z M29,20 L39,16 L43,25 L33,29 Z M46,15 L57,14 L58,24 L47,25 Z M65,17 L75,21 L71,30 L61,26 Z M81,28 L89,36 L81,43 L74,35 Z M89,48 L94,58 L84,62 L80,52 Z M87,69 L83,79 L73,74 L77,64 Z"/>
              <path android:fillColor="#FF6D00" android:pathData="M43,29 C39,27 35,30 35,35 L35,73 C35,78 40,81 44,78 L77,58 C82,55 82,49 77,46 Z"/>
              <path android:fillColor="#FFD54F" android:pathData="M47,39 L68,52 L47,66 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M25,83 L31,83 L31,88 L36,88 L36,82 L42,82 L42,94 L30,94 C24,94 20,90 20,85 C20,80 24,76 30,76 L42,76 L42,81 L30,81 Z M47,76 L54,76 L60,83 L66,76 L73,76 L64,86 L74,94 L66,94 L60,89 L54,94 L46,94 L56,85 Z"/>
              <path android:fillColor="#FF9100" android:pathData="M78,81 L88,76 L88,94 L81,94 L81,84 L77,86 Z"/>
          </vector>
          XML
          cat > app/src/main/res/drawable/ic_gx1_launcher_background.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#080B12" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#171D2A" android:pathData="M0,0h108v12h-108z"/>
          </vector>
          XML
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_gx1_launcher_background"/>
              <foreground android:drawable="@drawable/ic_gx1_launcher_foreground"/>
          </adaptive-icon>
          XML
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android:icon="@mipmap/ic_launcher"' not in s:
              s = s.replace('<application\n', '<application\n        android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"\n', 1)
          p.write_text(s)
          if 'android:icon="@mipmap/ic_launcher"' not in s:
              raise SystemExit("Could not set launcher icon in manifest")
          PY

      - name: Upgrade Media3 audio engine
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = list(Path('.').rglob('*.gradle')) + list(Path('.').rglob('*.gradle.kts'))
          changed = []
          for p in files:
              old = p.read_text()
              new = re.sub(r'(?<![0-9])1[.]4[.]1(?![0-9])', '1.8.0', old)
              if new != old:
                  p.write_text(new)
                  changed.append(str(p))
          if not changed:
              raise SystemExit('Media3 1.4.1 dependency declaration not found; refusing an unverified upgrade')
          print('Upgraded Media3 1.4.1 to 1.8.0 in:', ', '.join(changed))
          PY

      - name: Inspect extracted Media3 player construction
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Player construction and media source lines ==="
          grep -n -E 'ExoPlayer|MediaSourceFactory|setMediaItem|setMediaSourceFactory|\.prepare\(' app/src/main/java/com/example/gx1player/MainActivity.kt || true
          echo "=== Media3 dependency versions ==="
          grep -R -n 'media3-exoplayer\|media3-extractor' --include='*.gradle*' .

      - name: Use Media3 default Matroska extractor and URI data source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          old = "val exo = ExoPlayer.Builder(this, renderers, gx1MediaSourceFactory)"
          if old in s:
              s = s.replace(old, "val exo = ExoPlayer.Builder(this, renderers)", 1)
          s = s.replace('''val gx1Extractors = androidx.media3.extractor.DefaultExtractorsFactory()
                      .setMatroskaExtractorFlags(
                          androidx.media3.extractor.mkv.MatroskaExtractor.FLAG_DISABLE_SEEK_FOR_CUES
                      )
                  val gx1MediaSourceFactory =
                      androidx.media3.exoplayer.source.DefaultMediaSourceFactory(this, gx1Extractors)
                  ''', "", 1)
          p.write_text(s)
          print("Using Media3 default extractors and normal content-URI data source.")
          PY

      - name: Increase buffering headroom for high-bitrate 4K files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          if "import androidx.media3.exoplayer.DefaultLoadControl" not in s:
              marker = "import androidx.media3.exoplayer.ExoPlayer"
              if marker not in s:
                  raise SystemExit("Could not locate ExoPlayer import")
              s = s.replace(marker, "import androidx.media3.exoplayer.DefaultLoadControl\n" + marker, 1)
          old = "val exo = ExoPlayer.Builder(this, renderers)"
          if old not in s:
              raise SystemExit("Could not find expected ExoPlayer builder after URI/extractor fix")
          replacement = """val gx1LoadControl = DefaultLoadControl.Builder()
                      .setBufferDurationsMs(
                          15_000, // Avoid excessive queued media on memory-limited TV hardware.
                          60_000, // Keep enough headroom without a very large reserve.
                          1_000,
                          3_000
                      )
                      .setTargetBufferBytes(32 * 1024 * 1024)
                      .setPrioritizeTimeOverSizeThresholds(true)
                      .build()
                  val exo = ExoPlayer.Builder(this, renderers)
                      .setLoadControl(gx1LoadControl)"""
          s = s.replace(old, replacement, 1)
          p.write_text(s)
          print("Configured larger time- and memory-bounded buffers for high-bitrate 4K playback.")
          PY

      - name: Patch Media3 1.4.1 audio sink API
        run: |
          # Float output is already disabled on the renderers factory.
          # Remove any source line that calls the unsupported Media3 1.4.1 builder method.
          TARGET="$PROJECT_DIR/app/src/main/java/com/example/gx1player/PassthroughRenderersFactory.kt"
          test -f "$TARGET"
          grep -n 'setEnableFloatOutput' "$TARGET" || true
          sed -i '/setEnableFloatOutput/d' "$TARGET"
          if grep -n 'setEnableFloatOutput' "$TARGET"; then
            echo "::error::Unsupported float-output builder call remains"
            exit 1
          fi

      - name: Use updated Media3 native HDMI audio sink
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/gx1player/PassthroughRenderersFactory.kt')
          old = p.read_text()
          package = next((line for line in old.splitlines() if line.startswith('package ')), None)
          if not package:
              raise SystemExit('Could not determine passthrough renderer package')
          # Let the updated Media3 implementation choose the correct E-AC-3 JOC
          # AudioTrack encoding, channel mask, and native buffer strategy.
          p.write_text(package + '''\n\nimport android.content.Context\nimport androidx.media3.exoplayer.DefaultRenderersFactory\n\nclass PassthroughRenderersFactory(context: Context) : DefaultRenderersFactory(context) {\n    init {\n        setExtensionRendererMode(EXTENSION_RENDERER_MODE_OFF)\n    }\n}\n''')
          print('Using updated Media3 native E-AC-3 JOC HDMI passthrough implementation.')
          PY

      - name: Inspect passthrough renderer and audio configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== PassthroughRenderersFactory.kt ==="
          nl -ba app/src/main/java/com/example/gx1player/PassthroughRenderersFactory.kt | sed -n '1,260p'
          echo "=== Audio-related MainActivity configuration ==="
          grep -n -i -E 'audio|passthrough|tunnel|offload|buffer|renderer' app/src/main/java/com/example/gx1player/MainActivity.kt | head -160

      - name: Add requested menu and reliable resume behavior
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()

          # Add Matroska MIME recognition and report decoder failures clearly.
          for imp in ["import androidx.activity.OnBackPressedCallback", "import androidx.media3.common.PlaybackException"]:
              if imp not in s:
                  s = s.replace("import androidx.activity.result.contract.ActivityResultContracts", imp + "\n" + "import androidx.activity.result.contract.ActivityResultContracts", 1)
          s = s.replace('arrayOf("video/*", "audio/*")', 'arrayOf("video/*", "audio/*", "application/octet-stream", "application/x-matroska")')
          s = s.replace(
              'val builder = MediaItem.Builder().setUri(uri)',
              '''val builder = MediaItem.Builder().setUri(uri)
                  if (displayName(uri).endsWith(".mkv", ignoreCase = true)) {
                      builder.setMimeType(MimeTypes.APPLICATION_MATROSKA)
                  }''', 1)
          s = s.replace(
              '                if (!isPlaying) savePosition(exo)\n            }',
              '''                if (!isPlaying) savePosition(exo)
              }
              override fun onPlayerError(error: PlaybackException) {
                  val causes = generateSequence<Throwable>(error) { it.cause }
                      .take(6)
                      .map { cause -> "${cause.javaClass.simpleName}: ${cause.message ?: "no message"}" }
                      .joinToString(" <- ")
                  val detail = "${error.errorCodeName} | $causes"
                  android.util.Log.e("GX1Player", "Media3 playback failed: $detail", error)
                  runOnUiThread {
                      AlertDialog.Builder(this@MainActivity)
                          .setTitle("Playback error")
                          .setMessage(detail + "\\n\\nSelected: " + (mediaUri?.toString() ?: "unknown"))
                          .setPositiveButton("OK", null)
                          .show()
                  }
              }''', 1)
          # Launch to the home dashboard by default. Only a URI explicitly
          # delivered by another app should bypass Home; saved playback remains
          # available through the Resume tile.
          startup_line = '        val initial = intent?.data ?: prefs.getString(KEY_LAST_URI, null)?.let { Uri.parse(it) }'
          if startup_line not in s:
              raise SystemExit("Could not find startup media restore line")
          s = s.replace(startup_line, '        val initial: Uri? = null', 1)

          back_marker = '        val initial: Uri? = null'
          back_callback = '''        onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
              override fun handleOnBackPressed() {
                  showMenu()
              }
          })

          '''
          if 'onBackPressedDispatcher.addCallback(this' not in s:
              if back_marker not in s:
                  raise SystemExit("Could not find onCreate insertion point for Back handling")
              s = s.replace(back_marker, back_callback + back_marker, 1)

          # Make the menu discoverable on phones and touchscreens, not only via
          # the Android TV remote MENU/INFO/Y keys.
          for imp in ["import android.view.Gravity", "import android.widget.Button", "import android.widget.FrameLayout"]:
              if imp not in s:
                  s = s.replace("import android.view.KeyEvent", "import android.view.KeyEvent\n" + imp, 1)

          if "setContentView(playerView)" in s and 'text = "Menu"' not in s:
              s = s.replace(
                  "        setContentView(playerView)",
                  """        val root = FrameLayout(this)
                  rootLayout = root
                  // Use clean white captions with fully transparent background/window and no edge.
                  playerView.subtitleView?.setStyle(
                      androidx.media3.ui.CaptionStyleCompat(
                          Color.WHITE, Color.TRANSPARENT, Color.TRANSPARENT,
                          androidx.media3.ui.CaptionStyleCompat.EDGE_TYPE_NONE,
                          Color.TRANSPARENT, null
                      )
                  )
                  root.addView(playerView, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))
                  homePanel = buildHomePanel()
                  root.addView(homePanel, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))
                  playerView.visibility = android.view.View.GONE
                  // Keep Media3's own settings gear, but route its click into
                  // GX1's complete playback menu instead of Media3's limited Speed/Audio popup.
                  val media3SettingsGear = playerView.findViewById<android.view.View>(
                      androidx.media3.ui.R.id.exo_settings
                  )
                  media3SettingsGear?.apply {
                      visibility = android.view.View.VISIBLE
                      setOnClickListener { showMenu() }
                      contentDescription = "Playback settings"
                  }
                  // Add a folder with a blue video-file symbol immediately left of Media3's gear.
                  media3SettingsGear?.let { gear ->
                      val gearParent = gear.parent as? android.view.ViewGroup
                      if (gearParent != null && gearParent.findViewWithTag<android.view.View>("gx1_open_video") == null) {
                          val gearIndex = gearParent.indexOfChild(gear)
                          val openVideoButton = android.widget.ImageButton(this).apply {
                              tag = "gx1_open_video"
                              setImageDrawable(object : android.graphics.drawable.Drawable() {
                                  private val folderPaint = android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG).apply {
                                      color = Color.WHITE
                                      style = android.graphics.Paint.Style.FILL
                                  }
                                  private val videoPaint = android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG).apply {
                                      color = Color.rgb(20, 91, 245)
                                      style = android.graphics.Paint.Style.FILL
                                  }
                                  private val detailPaint = android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG).apply {
                                      color = Color.WHITE
                                      style = android.graphics.Paint.Style.FILL
                                  }
                                  override fun draw(canvas: android.graphics.Canvas) {
                                      val b = bounds
                                      canvas.save()
                                      canvas.translate(b.left.toFloat(), b.top.toFloat())
                                      canvas.scale(b.width() / 24f, b.height() / 24f)
                                      val folder = android.graphics.Path().apply {
                                          moveTo(2f, 6f); quadTo(2f, 4f, 4f, 4f)
                                          lineTo(9f, 4f); lineTo(11f, 6.5f); lineTo(20f, 6.5f)
                                          quadTo(22f, 6.5f, 22f, 8.5f); lineTo(22f, 18.5f)
                                          quadTo(22f, 21f, 19.5f, 21f); lineTo(4.5f, 21f)
                                          quadTo(2f, 21f, 2f, 18.5f); close()
                                      }
                                      canvas.drawPath(folder, folderPaint)
                                      val film = android.graphics.RectF(6f, 8f, 18.5f, 18.5f)
                                      canvas.drawRoundRect(film, 1.5f, 1.5f, videoPaint)
                                      for (y in listOf(9.5f, 12f, 14.5f, 17f)) {
                                          canvas.drawRoundRect(7f, y, 8.2f, y + 1.1f, 0.3f, 0.3f, detailPaint)
                                          canvas.drawRoundRect(16.3f, y, 17.5f, y + 1.1f, 0.3f, 0.3f, detailPaint)
                                      }
                                      val play = android.graphics.Path().apply {
                                          moveTo(10f, 10.5f); lineTo(15f, 13.25f); lineTo(10f, 16f); close()
                                      }
                                      canvas.drawPath(play, detailPaint)
                                      canvas.restore()
                                  }
                                  override fun setAlpha(alpha: Int) {
                                      folderPaint.alpha = alpha; videoPaint.alpha = alpha; detailPaint.alpha = alpha
                                  }
                                  override fun setColorFilter(filter: android.graphics.ColorFilter?) {
                                      folderPaint.colorFilter = filter; videoPaint.colorFilter = filter; detailPaint.colorFilter = filter
                                  }
                                  @Deprecated("Deprecated in Java")
                                  override fun getOpacity(): Int = android.graphics.PixelFormat.TRANSLUCENT
                                  override fun getIntrinsicWidth(): Int = 24
                                  override fun getIntrinsicHeight(): Int = 24
                              })
                              background = android.graphics.drawable.ColorDrawable(Color.TRANSPARENT)
                              contentDescription = "Open video"
                              isFocusable = true
                              isClickable = true
                              // Match Media3 gear's full icon footprint; remove ImageButton inset padding.
                              setPadding(0, 0, 0, 0)
                              scaleType = android.widget.ImageView.ScaleType.FIT_CENTER
                              setOnClickListener {
                                  chooseLibraryLocation()
                              }
                          }
                          val oldParams = gear.layoutParams
                          val buttonParams: android.view.ViewGroup.LayoutParams = when (oldParams) {
                              is android.widget.LinearLayout.LayoutParams -> android.widget.LinearLayout.LayoutParams(oldParams)
                              is android.widget.FrameLayout.LayoutParams -> android.widget.FrameLayout.LayoutParams(oldParams)
                              else -> android.view.ViewGroup.LayoutParams(oldParams)
                          }
                          gearParent.addView(openVideoButton, gearIndex, buttonParams)
                      }
                  }
                  val menuButton = Button(this).apply {
                      // Force text presentation so Android draws a crisp white gear glyph,
                      // not a gray emoji-style icon.
                      text = "\u2699\uFE0E"
                      textSize = 36f
                      typeface = android.graphics.Typeface.create("sans-serif", android.graphics.Typeface.NORMAL)
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      alpha = 1f
                      contentDescription = "Open playback menu"
                      minWidth = 0
                      minHeight = 0
                      setPadding(0, 0, 0, 3)
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.rgb(28, 34, 46))
                          setStroke(2, Color.rgb(150, 177, 210))
                      }
                      elevation = 12f
                      setOnFocusChangeListener { v, focused ->
                          v.background = GradientDrawable().apply {
                              shape = GradientDrawable.OVAL
                              setColor(if (focused) Color.rgb(73, 48, 25) else Color.rgb(28, 34, 46))
                              setStroke(if (focused) 4 else 2,
                                  if (focused) Color.rgb(255, 152, 0) else Color.rgb(150, 177, 210))
                          }
                      }
                      setOnClickListener { showMenu() }
                      // Use Media3's built-in gear as the sole visible entry point.
                      visibility = android.view.View.GONE
                  }
                  val menuParams = FrameLayout.LayoutParams(
                      72,
                      72,
                      Gravity.BOTTOM or Gravity.END
                  ).apply { setMargins(0, 0, 30, 30) }
                  menuButtonRef = menuButton
                  // Do not attach the custom GX1 gear at all; Media3's gear is the only control.
                  menuButton.visibility = android.view.View.GONE
                  setContentView(root)""",
                  1
              )

          if 'add("Resume last video")' not in s:
              s, n = re.subn(
                  r'    private fun selectMedia\(uri: Uri\) \{.*?\n    \}',
                  '''    private fun selectMedia(uri: Uri) {
                  mediaUri = uri
                  prefs.edit().putString(KEY_LAST_URI, uri.toString()).apply()
                  subtitleUri = prefs.getString(subKey(uri), null)?.let { Uri.parse(it) }
              }''',
                  s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit("Could not patch selectMedia()")

          if "override fun onPositionDiscontinuity(" not in s:
              marker = "        exo.addAnalyticsListener(object : AnalyticsListener {"
              listener = """        // Persist resume position immediately on pause, seek, and playback-state changes.
                  exo.addListener(object : Player.Listener {
                      override fun onIsPlayingChanged(isPlaying: Boolean) {
                          if (!isPlaying) savePosition(exo)
                      }
                      override fun onPlaybackStateChanged(playbackState: Int) {
                          if (playbackState == Player.STATE_ENDED || playbackState == Player.STATE_READY) {
                              savePosition(exo)
                          }
                      }
                      override fun onPositionDiscontinuity(
                          oldPosition: Player.PositionInfo,
                          newPosition: Player.PositionInfo,
                          reason: Int
                      ) {
                          savePosition(exo)
                      }
                  })

          """
              if marker not in s:
                  raise SystemExit("Could not find player listener insertion point")
              s = s.replace(marker, listener + marker, 1)

          if 'add("Resume last video")' not in s:
              marker = '        add("Open video file") { pickVideo.launch(arrayOf("video/*", "audio/*")) }'
              resume = """        add("Resume last video") {
                      val last = prefs.getString(KEY_LAST_URI, null)?.let { Uri.parse(it) }
                      if (last != null) {
                          selectMedia(last)
                          startPlayer()
                      } else {
                          Toast.makeText(this, "No previous video", Toast.LENGTH_SHORT).show()
                      }
                  }
          """
              if marker not in s:
                  raise SystemExit("Could not find Open video menu item")
              s = s.replace(marker, marker + "\n" + resume, 1)

          if 'add("Restart current video")' not in s:
              marker = '        add(if (passthrough) "Audio pass-through: On (select to turn off)" else "Audio pass-through: Off (select to turn on)") {'
              restart = """        add("Restart current video") {
                      mediaUri?.let { uri ->
                          prefs.edit().remove(posKey(uri)).apply()
                          startPlayer()
                      }
                  }
          """
              if marker not in s:
                  raise SystemExit("Could not find audio menu item")
              s = s.replace(marker, restart + marker, 1)

          # Support two external subtitle tracks per video and persist both choices.
          s = s.replace('        private const val KEY_SUBS_ON = "subs_on"',
                        '        private const val KEY_SUBS_ON = "subs_on"\n        private const val KEY_HISTORY_PREFIX = "history|"')
          s = s.replace('    private var subtitleUri: Uri? = null     // external subtitle file for mediaUri',
                        '    private var subtitleUri: Uri? = null     // first external subtitle\n    private var subtitleUri2: Uri? = null    // second external subtitle\n    private fun subKey(uri: Uri) = KEY_SUBTITLE_1 + uri.toString()')
          second_picker = """
          private val pickSubtitle2 = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
              if (uri == null) return@registerForActivityResult
              takePermission(uri)
              subtitleUri2 = uri
              mediaUri?.let { prefs.edit().putString(subKey(it) + "|2", uri.toString()).apply() }
              loadSecondSubtitleOverlay(uri)
          }
          """
          if "private val pickSubtitle2" not in s:
              s = s.replace('    override fun onCreate(savedInstanceState: Bundle?) {', second_picker + '\n    override fun onCreate(savedInstanceState: Bundle?) {', 1)
          s = s.replace('        subtitleUri = prefs.getString(subKey(uri), null)?.let { Uri.parse(it) }',
                        '        subtitleUri = prefs.getString(subKey(uri), null)?.let { Uri.parse(it) }\n        subtitleUri2 = prefs.getString(subKey(uri) + "|2", null)?.let { Uri.parse(it) }')
          old_subs = """        subtitleUri?.let { sub ->
              val name = displayName(sub)
              builder.setSubtitleConfigurations(
                  listOf(

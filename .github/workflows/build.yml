name: Build GX1 Player APK

on:
  push:
    branches: [ main ]
    paths:
      - 'gx1-player.zip'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: gx1-player-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIP_FILE: gx1-player.zip
  PROJECT_DIR: gx1-player
  GRADLE_VERSION: '8.7'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify zip exists
        run: |
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::$ZIP_FILE not found at repository root"
            exit 1
          fi

      - name: Extract project
        run: |
          unzip -q "$ZIP_FILE" -d .
          test -f "$PROJECT_DIR/settings.gradle.kts" || { echo "::error::settings.gradle.kts missing after unzip"; exit 1; }

      - name: Patch Media3 renderer API compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          FILE="app/src/main/java/com/example/gx1player/PassthroughRenderersFactory.kt"
          if grep -q 'setEnableFloatOutput(false)' "$FILE"; then
            # Float-output control belongs to DefaultAudioSink.Builder in Media3 1.4.1,
            # not DefaultRenderersFactory. Keep the valid sink-builder setting below.
            sed -i '/^[[:space:]]*setEnableFloatOutput(false)[[:space:]]*$/d' "$FILE"
          fi
          if grep -q 'setEnableFloatOutput(false)' "$FILE" && sed -n '/init {/,/}/p' "$FILE" | grep -q 'setEnableFloatOutput(false)'; then
            echo "::error::Unsupported DefaultRenderersFactory float-output call remains"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version "$GRADLE_VERSION" --no-daemon

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No debug APK produced"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gx1-player-debug
          path: ${{ env.PROJECT_DIR }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

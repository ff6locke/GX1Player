      - name: Implement GX1 native Library and Open Video browser
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          methods = r"""
          private fun ensureGX1FileAccess(onGranted: () -> Unit) {
              if (android.os.Build.VERSION.SDK_INT >= 30 && !Environment.isExternalStorageManager()) {
                  try {
                      startActivity(Intent(android.provider.Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                          Uri.parse("package:" + packageName)))
                  } catch (_: Exception) {
                      startActivity(Intent(android.provider.Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
                  }
                  Toast.makeText(this, "Allow GX1 Player file access, then open Library again.", Toast.LENGTH_LONG).show()
                  return
              }
              if (android.os.Build.VERSION.SDK_INT < 30 &&
                  checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                  libraryPermissionRequest.launch(arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE))
                  return
              }
              onGranted()
          }
          private fun gx1StorageRoots(): List<java.io.File> {
              val internal = Environment.getExternalStorageDirectory()
              val external = getExternalFilesDirs(null).filterNotNull().mapNotNull { dir ->
                  val marker = "/Android/data/"
                  val cut = dir.absolutePath.indexOf(marker)
                  if (cut > 0) java.io.File(dir.absolutePath.substring(0, cut)) else null
              }
              val mountedVolumes = if (Build.VERSION.SDK_INT >= 24) {
                  try {
                      val manager = getSystemService(android.content.Context.STORAGE_SERVICE) as? android.os.storage.StorageManager
                      manager?.storageVolumes.orEmpty().mapNotNull { volume ->
                          try {
                              val state = volume.state
                              val isPrimary = volume.isPrimary
                              val root = volume.javaClass.getMethod("getDirectory").invoke(volume) as? java.io.File
                              if (!isPrimary && state == Environment.MEDIA_MOUNTED && root?.isDirectory == true) root else null
                          } catch (_: Exception) { null }
                      }
                  } catch (_: Exception) { emptyList() }
              } else emptyList()
              return (listOf(internal) + external + mountedVolumes)
                  .distinctBy { it.canonicalPath }
                  .filter { it.exists() && it.isDirectory }
          }
          private fun chooseGX1LibraryFolder() {
              ensureGX1FileAccess {
                  val roots = gx1StorageRoots()
                  if (roots.isEmpty()) {
                      Toast.makeText(this, "No accessible storage found.", Toast.LENGTH_LONG).show()
                      return@ensureGX1FileAccess
                  }
                  val labels = roots.mapIndexed { i, f -> if (i == 0) "Internal storage" else "External storage / SD card" }
                  AlertDialog.Builder(this).setTitle("Choose Library storage")
                      .setItems(labels.toTypedArray()) { _, which -> browseGX1Folder(roots[which], true) }
                      .setNegativeButton("Cancel", null).show()
              }
          }
          private fun openVideoWithGX1Browser() {
              ensureGX1FileAccess {
                  val roots = gx1StorageRoots()
                  if (roots.isEmpty()) {
                      Toast.makeText(this, "No accessible storage found.", Toast.LENGTH_LONG).show()
                  } else {
                      val labels = roots.mapIndexed { i, _ -> if (i == 0) "Internal storage" else "External SD card" }
                      AlertDialog.Builder(this).setTitle("Open video from")
                          .setItems(labels.toTypedArray()) { _, which -> browseGX1Folder(roots[which], false, false) }
                          .setNegativeButton("Cancel", null).show()
                  }
              }
          }
          private fun showGX1Library() {
              ensureGX1FileAccess {
                  val internal = Environment.getExternalStorageDirectory()
                  if (internal.isDirectory) browseGX1Folder(internal, false, true)
                  else Toast.makeText(this, "Internal storage is not accessible.", Toast.LENGTH_LONG).show()
              }
          }
          private fun browseGX1Folder(folder: java.io.File, selectingLibrary: Boolean, foldersOnly: Boolean = false) {
              val current = folder.canonicalFile
              val videoExt = setOf(
                  "mkv", "mp4", "m4v", "avi", "mov", "webm", "mpg", "mpeg",
                  "ts", "m2ts", "mts", "vob", "ogv", "flv", "wmv", "asf",
                  "3gp", "3g2", "m2v"
              )
              val libraryMediaExt = videoExt + setOf("mp3", "flac", "m4a", "aac", "wav", "ogg", "opus")
              val mediaExt = if (selectingLibrary) libraryMediaExt else videoExt
              val loading = AlertDialog.Builder(this)
                  .setTitle(if (selectingLibrary) "Loading Library…" else "Loading videos…")
                  .setMessage(current.absolutePath)
                  .setNegativeButton("Cancel", null)
                  .create()
              loading.show()
              Thread {
                  fun containsPlayableVideo(dir: java.io.File, depth: Int = 0): Boolean {
                      if (depth >= 4) return false
                      val children = dir.listFiles() ?: return false
                      for (child in children) {
                          if (child.isFile && child.extension.lowercase() in videoExt) return true
                          if (child.isDirectory && !child.name.startsWith(".") &&
                              !child.name.equals("Android", true) &&
                              containsPlayableVideo(child, depth + 1)) return true
                      }
                      return false
                  }
                  val entries = current.listFiles()?.filter { f ->
                      (f.isDirectory && (selectingLibrary || foldersOnly || containsPlayableVideo(f))) ||
                          (!foldersOnly && f.isFile && f.extension.lowercase() in mediaExt)
                  }?.sortedWith(compareBy<java.io.File>({ !it.isDirectory }, { it.name.lowercase() })) ?: emptyList()
                  runOnUiThread {
                      if (isFinishing || isDestroyed || !loading.isShowing) return@runOnUiThread
                      loading.dismiss()
                      val labels = mutableListOf<String>()
                      if (current.parentFile != null) labels.add("..  Parent folder")
                      entries.forEach { labels.add((if (it.isDirectory) "📁  " else "▶  ") + it.name) }
                      if (labels.isEmpty()) labels.add("(No folders or media files)")
                      val title = (if (selectingLibrary) "Choose Library folder" else "GX1 Library") +
                          "\\n" + current.absolutePath
                      val builder = AlertDialog.Builder(this).setTitle(title)
                          .setItems(labels.toTypedArray()) { _, which ->
                              val parentOffset = if (current.parentFile != null) 1 else 0
                              if (parentOffset == 1 && which == 0) {
                                  browseGX1Folder(current.parentFile!!, selectingLibrary, foldersOnly)
                              } else {
                                  val index = which - parentOffset
                                  if (index in entries.indices) {
                                      val selected = entries[index]
                                      if (selected.isDirectory) browseGX1Folder(selected, selectingLibrary, foldersOnly)
                                      else if (!selectingLibrary) {
                                          selectMedia(Uri.fromFile(selected))
                                          startPlayer()
                                      }
                                  }
                              }
                          }
                      if (selectingLibrary) {
                          builder.setPositiveButton("Use this folder") { _, _ ->
                              prefs.edit().putString("gx1_library_path", current.absolutePath).apply()
                              Toast.makeText(this, "Library folder saved.", Toast.LENGTH_SHORT).show()
                              browseGX1Folder(current, false)
                          }
                      } else {
                          builder.setPositiveButton("Choose folder") { _, _ -> browseGX1Folder(current, true) }
                      }
                      builder.setNegativeButton("Close", null)
                      builder.setNeutralButton("Refresh") { _, _ -> browseGX1Folder(current, selectingLibrary) }
                      builder.show()
                  }
              }.start()
          }
          """
          if "private fun showGX1Library()" not in s:
              marker = "    private fun showMenu() {"
              if marker not in s:
                  raise SystemExit("Could not find MainActivity method insertion point")
              s = s.replace(marker, methods + marker, 1)
          s = re.sub(r'addTile\("Library"[^\n]*\)\s*\{[^}]*\}',
                     'addTile("Library", "Browse saved folders") { showGX1Library() }', s, count=0)
          s = re.sub(r'addTile\("Open video"[^\n]*\)\s*\{[^}]*\}',
                     'addTile("Open video", "Choose one file") { openVideoWithGX1Browser() }', s, count=0)
          s = re.sub(r'add\("Open video file"\)\s*\{[^}]*\}',
                     'add("Open video file") { openVideoWithGX1Browser() }', s, count=0)
          s = re.sub(r'addTab\("Change folder", false\)\s*\{[^}]*\}',
                     'addTab("Change folder", false) { chooseGX1LibraryFolder() }', s)
          s, home_count = re.subn(
              r'addTile\("Open video",\s*"Browse files"\)\s*\{\s*pickVideo\.launch\([^\n]*\)\s*\}',
              'addTile("Open video", "Browse internal or external SD card") { openVideoWithGX1Browser() }',
              s, count=1, flags=re.S)
          print("Early home tile match count:", home_count, "(dashboard may be generated later)")
          s, menu_count = re.subn(
              r'add\("Open video file"\)\s*\{\s*pickVideo\.launch\([^\n]*\)\s*\}',
              'add("Open video file") { openVideoWithGX1Browser() }',
              s, count=1, flags=re.S)
          print("Early playback-menu match count:", menu_count)
          s = s.replace('chooseLibraryLocation() }', 'openVideoWithGX1Browser() }')
          pending_property = "    private var pendingGX1FileAccessAction: (() -> Unit)? = null\n"
          if "private var pendingGX1FileAccessAction" not in s:
              s = s.replace("private fun ensureGX1FileAccess(", pending_property + "private fun ensureGX1FileAccess(", 1)
          old_permission_callback = """private val libraryPermissionRequest = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { result ->
              if (result.values.any { it }) showLibrary("")
              else Toast.makeText(this, "Media access is needed to browse internal storage.", Toast.LENGTH_LONG).show()
          }"""
          new_permission_callback = """private val libraryPermissionRequest = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { result ->
              val action = pendingGX1FileAccessAction
              pendingGX1FileAccessAction = null
              if (result.values.any { it }) action?.invoke()
              else Toast.makeText(this, "Storage access is needed to browse files.", Toast.LENGTH_LONG).show()
          }"""
          callback_pattern = r"private val libraryPermissionRequest = registerForActivityResult\\(ActivityResultContracts\\.RequestMultiplePermissions\\(\\)\\) \\{ result ->.*?\\n\\s*\\}"
          s, callback_count = re.subn(callback_pattern, new_permission_callback, s, count=1, flags=re.S)
          if callback_count == 0:
              print("Permission callback pattern not found; leaving existing callback.")
          s = s.replace(
              "if (android.os.Build.VERSION.SDK_INT >= 30 && !Environment.isExternalStorageManager()) {",
              "if (android.os.Build.VERSION.SDK_INT >= 30 && !Environment.isExternalStorageManager()) {\n                pendingGX1FileAccessAction = onGranted",
              1)
          s = s.replace(
              "libraryPermissionRequest.launch(arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE))",
              "pendingGX1FileAccessAction = onGranted\n                libraryPermissionRequest.launch(arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE))",
              1)
          if "override fun onResume()" not in s:
              resume_method = """    override fun onResume() {
                  super.onResume()
                  if (android.os.Build.VERSION.SDK_INT >= 30 && Environment.isExternalStorageManager()) {
                      val action = pendingGX1FileAccessAction
                      pendingGX1FileAccessAction = null
                      if (action != null) window.decorView.post { action.invoke() }
                  }
              }
          """
              marker = "    private fun showMenu() {"
              if marker not in s:
                  raise SystemExit("Could not find onResume insertion point")
              s = s.replace(marker, resume_method + marker, 1)
          missing = [name for name, present in [
              ("GX1 folder browser method", "private fun browseGX1Folder(" in s),
              ("Library home tile", 'addTile("Library"' in s),
              ("Open Video home tile", 'addTile("Open video"' in s),
              ("pending permission action", "pendingGX1FileAccessAction" in s),
          ] if not present]
          if missing:
              print("Some legacy GX1 browser anchors differ in this source variant: " + ", ".join(missing))
              print("Keeping existing in-app browser implementation and continuing to compile.")
          p.write_text(s)
          print("Library lists folders; Open Video asks for internal or external storage; permission continuation is saved.")
          PY
      - name: Add HDMI audio capability diagnostics
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          method = r"""    private fun showAudioDiagnostics() {
                  val caps = androidx.media3.exoplayer.audio.AudioCapabilities.getCapabilities(this)
                  val candidateEncodings = intArrayOf(
                      android.media.AudioFormat.ENCODING_AC3,
                      android.media.AudioFormat.ENCODING_E_AC3,
                      android.media.AudioFormat.ENCODING_E_AC3_JOC,
                      android.media.AudioFormat.ENCODING_DTS,
                      android.media.AudioFormat.ENCODING_DTS_HD,
                      android.media.AudioFormat.ENCODING_DOLBY_TRUEHD,
                      android.media.AudioFormat.ENCODING_PCM_16BIT,
                      android.media.AudioFormat.ENCODING_PCM_8BIT,
                      android.media.AudioFormat.ENCODING_PCM_FLOAT
                  )
                  val encodings = candidateEncodings.filter { encoding ->
                      caps.supportsEncoding(encoding)
                  }
                  fun encodingName(value: Int): String = when (value) {
                      android.media.AudioFormat.ENCODING_AC3 -> "Dolby Digital (AC3)"
                      android.media.AudioFormat.ENCODING_E_AC3 -> "Dolby Digital Plus (E-AC3)"
                      android.media.AudioFormat.ENCODING_E_AC3_JOC -> "Dolby Atmos (E-AC3 JOC)"
                      android.media.AudioFormat.ENCODING_DTS -> "DTS"
                      android.media.AudioFormat.ENCODING_DTS_HD -> "DTS-HD"
                      android.media.AudioFormat.ENCODING_DOLBY_TRUEHD -> "Dolby TrueHD"
                      android.media.AudioFormat.ENCODING_PCM_16BIT -> "PCM 16-bit"
                      android.media.AudioFormat.ENCODING_PCM_8BIT -> "PCM 8-bit"
                      android.media.AudioFormat.ENCODING_PCM_FLOAT -> "PCM float"
                      else -> "Encoding $value"
                  }
                  val lines = mutableListOf<String>()
                  lines.add("HDMI / Android audio capabilities")
                  lines.add("Maximum reported channels: ${caps.maxChannelCount}")
                  lines.add("Reported encodings:")
                  lines.addAll(encodings.map { encoding -> "  • " + encodingName(encoding) })
                  lines.add("")
                  lines.add("Android direct HDMI playback test (48 kHz, 5.1):")
                  if (android.os.Build.VERSION.SDK_INT >= 29) {
                      val attrs = android.media.AudioAttributes.Builder()
                          .setUsage(android.media.AudioAttributes.USAGE_MEDIA)
                          .setContentType(android.media.AudioAttributes.CONTENT_TYPE_MOVIE)
                          .build()
                      for (encoding in intArrayOf(
                          android.media.AudioFormat.ENCODING_DTS,
                          android.media.AudioFormat.ENCODING_DTS_HD,
                          android.media.AudioFormat.ENCODING_AC3,
                          android.media.AudioFormat.ENCODING_E_AC3
                      )) {
                          val format = android.media.AudioFormat.Builder()
                              .setEncoding(encoding)
                              .setSampleRate(48000)
                              .setChannelMask(android.media.AudioFormat.CHANNEL_OUT_5POINT1)
                              .build()
                          val direct = runCatching {
                              android.media.AudioTrack.isDirectPlaybackSupported(format, attrs)
                          }.getOrDefault(false)
                          lines.add("  ${encodingName(encoding)}: ${if (direct) "YES" else "NO"}")
                      }
                  } else {
                      lines.add("  Not available below Android 10 (API 29)")
                  }
                  lines.add("")
                  lines.add("Current Media3 audio tracks:")
                  val audioGroups = player?.currentTracks?.groups?.filter {
                      it.type == androidx.media3.common.C.TRACK_TYPE_AUDIO
                  }.orEmpty()
                  if (audioGroups.isEmpty()) lines.add("  No audio tracks discovered yet")
                  for (group in audioGroups) {
                      for (index in 0 until group.length) {
                          val f = group.getTrackFormat(index)
                          val state = when {
                              group.isTrackSelected(index) -> "SELECTED"
                              group.isTrackSupported(index) -> "supported"
                              else -> "NOT supported"
                          }
                          lines.add("  [$state] ${f.sampleMimeType ?: "unknown"} / ${f.codecs ?: "no codec tag"}")
                          val passthrough = runCatching { caps.isPassthroughPlaybackSupported(f) }.getOrDefault(false)
                          lines.add("    channels=${f.channelCount}, sampleRate=${f.sampleRate}, language=${f.language ?: "und"}")
                          lines.add("    Media3 passthrough support: ${if (passthrough) "YES" else "NO"}")
                      }
                  }
                  lines.add("")
                  lines.add("If TrueHD or E-AC3 JOC is missing above, Android is not reporting that HDMI format to GX1Player.")
                  AlertDialog.Builder(this)
                      .setTitle("Audio diagnostics")
                      .setMessage(lines.joinToString("\n"))
                      .setPositiveButton("OK", null)
                      .show()
              }
          """
          if "private fun showAudioDiagnostics()" not in s:
              marker = "    private fun showMenu() {"
              if marker not in s:
                  raise SystemExit("Could not find showMenu() insertion point for audio diagnostics")
              s = s.replace(marker, method + marker, 1)
          if '"audio_diagnostics"' not in s:
              s = s.replace(
                  'Triple("♫", "Audio Track", "audio"),',
                  'Triple("♫", "Audio Track", "audio"),\n                      Triple("ⓘ", "Audio diagnostics", "audio_diagnostics"),',
                  1
              )
          if '"audio_diagnostics" -> showAudioDiagnostics()' not in s:
              s = s.replace(
                  '"audio" -> {',
                  '"audio_diagnostics" -> showAudioDiagnostics()\n                              "audio" -> {',
                  1
              )
          p.write_text(s)
          if "private fun showAudioDiagnostics()" not in s or '"audio_diagnostics"' not in s:
              raise SystemExit("Audio diagnostics UI insertion failed")
          print("Added HDMI capability and Media3 track diagnostics.")
          PY
      - name: Capture actual HDMI audio output events
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          marker = "        exo.addAnalyticsListener(object : AnalyticsListener {"
          if marker not in s:
              raise SystemExit("Could not find Media3 analytics listener insertion point")
          listener = """        exo.addAnalyticsListener(object : AnalyticsListener {
                      override fun onAudioSinkError(
                          eventTime: AnalyticsListener.EventTime,
                          audioSinkError: Exception
                      ) {
                          val detail = audioSinkError.javaClass.simpleName + ": " +
                              (audioSinkError.message ?: "no message")
                          android.util.Log.e("GX1PlayerAudio", "Audio sink error: " + detail, audioSinkError)
                          prefs.edit().putString("gx1_last_audio_sink_error", detail).apply()
                      }
                      override fun onAudioTrackInitialized(
                          eventTime: AnalyticsListener.EventTime,
                          audioTrackConfig: androidx.media3.exoplayer.audio.AudioSink.AudioTrackConfig
                      ) {
                          val encodingName = when (audioTrackConfig.encoding) {
                              android.media.AudioFormat.ENCODING_AC3 -> "AC3"
                              android.media.AudioFormat.ENCODING_E_AC3 -> "E-AC3"
                              android.media.AudioFormat.ENCODING_E_AC3_JOC -> "E-AC3 JOC / Atmos"
                              android.media.AudioFormat.ENCODING_DTS -> "DTS"
                              android.media.AudioFormat.ENCODING_DTS_HD -> "DTS-HD"
                              android.media.AudioFormat.ENCODING_DOLBY_TRUEHD -> "TrueHD"
                              android.media.AudioFormat.ENCODING_PCM_16BIT -> "PCM 16-bit"
                              else -> "encoding " + audioTrackConfig.encoding
                          }
                          val detail = "AudioTrack created: " + encodingName +
                              ", sampleRate=" + audioTrackConfig.sampleRate +
                              ", channelConfig=0x" + Integer.toHexString(audioTrackConfig.channelConfig) +
                              ", tunneling=" + audioTrackConfig.tunneling +
                              ", offload=" + audioTrackConfig.offload +
                              ", bufferSize=" + audioTrackConfig.bufferSize
                          android.util.Log.i("GX1PlayerAudio", detail)
                          prefs.edit().putString("gx1_last_audio_track_event", detail).apply()
                      }
                      override fun onAudioInputFormatChanged(
                          eventTime: AnalyticsListener.EventTime,
                          format: androidx.media3.common.Format,
                          decoderReuseEvaluation: androidx.media3.exoplayer.DecoderReuseEvaluation?
                      ) {
                          val detail = "Audio input: " + (format.sampleMimeType ?: "unknown") +
                              ", codecs=" + (format.codecs ?: "none") +
                              ", channels=" + format.channelCount +
                              ", rate=" + format.sampleRate
                          prefs.edit().putString("gx1_audio_input_format", detail).apply()
                          android.util.Log.i("GX1PlayerAudio", detail)
                      }
                      override fun onAudioDecoderInitialized(
                          eventTime: AnalyticsListener.EventTime,
                          decoderName: String,
                          initializedTimestampMs: Long,
                          initializationDurationMs: Long
                      ) {
                          val detail = "Audio decoder: " + decoderName +
                              ", initMs=" + initializationDurationMs
                          prefs.edit().putString("gx1_audio_decoder", detail).apply()
                          android.util.Log.i("GX1PlayerAudio", detail)
                      }
                      override fun onAudioUnderrun(
                          eventTime: AnalyticsListener.EventTime,
                          bufferSize: Int,
                          bufferSizeMs: Long,
                          elapsedSinceLastFeedMs: Long
                      ) {
                          val detail = "Audio underrun: buffer=" + bufferSize +
                              ", bufferMs=" + bufferSizeMs +
                              ", sinceFeedMs=" + elapsedSinceLastFeedMs
                          prefs.edit().putString("gx1_audio_underrun", detail).apply()
                          android.util.Log.e("GX1PlayerAudio", detail)
                      }
                      override fun onDroppedVideoFrames(
                          eventTime: AnalyticsListener.EventTime,
                          droppedFrames: Int,
                          elapsedMs: Long
                      ) {
                          val detail = "Dropped video frames: " + droppedFrames +
                              " over " + elapsedMs + "ms"
                          prefs.edit().putString("gx1_dropped_video_frames", detail).apply()
                          android.util.Log.w("GX1PlayerAudio", detail)
                      }
                      override fun onAudioTrackReleased(
                          eventTime: AnalyticsListener.EventTime,
                          audioTrackConfig: androidx.media3.exoplayer.audio.AudioSink.AudioTrackConfig
                      ) {
                          val detail = "AudioTrack released: " + audioTrackConfig.toString()
                          android.util.Log.w("GX1PlayerAudio", detail)
                          prefs.edit().putString("gx1_last_audio_track_event", detail).apply()
                      }
                  })
          """
          s = s.replace(marker, listener + marker, 1)
          old = 'lines.add("Current Media3 audio tracks:")'
          new = '''                  lines.add("Player state: " + when (player?.playbackState) {
                      Player.STATE_IDLE -> "IDLE"
                      Player.STATE_BUFFERING -> "BUFFERING"
                      Player.STATE_READY -> "READY"
                      Player.STATE_ENDED -> "ENDED"
                      else -> "UNKNOWN"
                  } + ", isPlaying=" + (player?.isPlaying ?: false) +
                      ", positionMs=" + (player?.currentPosition ?: -1L))
                  lines.add("Last audio sink error: " +
                      (prefs.getString("gx1_last_audio_sink_error", null) ?: "none recorded"))
                  lines.add("Last audio track event: " +
                      (prefs.getString("gx1_last_audio_track_event", null) ?: "none recorded"))
                  lines.add("Audio input: " +
                      (prefs.getString("gx1_audio_input_format", null) ?: "not recorded"))
                  lines.add(prefs.getString("gx1_audio_decoder", "Audio decoder: not recorded") ?: "Audio decoder: not recorded")
                  lines.add(prefs.getString("gx1_audio_underrun", "Audio underrun: none recorded") ?: "Audio underrun: none recorded")
                  lines.add(prefs.getString("gx1_dropped_video_frames", "Dropped video frames: none recorded") ?: "Dropped video frames: none recorded")
                  lines.add("")
                  lines.add("Current Media3 audio tracks:")'''
          if old not in s:
              raise SystemExit("Could not find audio diagnostics insertion point")
          s = s.replace(old, new, 1)
          p.write_text(s)
          print("Added native AudioTrack lifecycle and audio-sink error diagnostics.")

          replacements = [
              ("private var activeDigitalOutput = true",
               "private var activeDigitalOutput = true\n              @Volatile private var openStartedAtMs = 0L"),
              ("fun open(uri: Uri, startPositionMs: Long = 0L, digitalOutput: Boolean = true) {",
               "fun open(uri: Uri, startPositionMs: Long = 0L, digitalOutput: Boolean = true) {\n                  openStartedAtMs = android.os.SystemClock.elapsedRealtime()\n                  android.util.Log.i(\"GX1_FIRST_PLAY_TIMING\", \"open entered\")"),
              ("mediaPlayer.media = media",
               "android.util.Log.i(\"GX1_FIRST_PLAY_TIMING\", \"media created after ms=\" + (android.os.SystemClock.elapsedRealtime() - openStartedAtMs))\n                      mediaPlayer.media = media\n                      android.util.Log.i(\"GX1_FIRST_PLAY_TIMING\", \"media assigned after ms=\" + (android.os.SystemClock.elapsedRealtime() - openStartedAtMs))"),
              ("mediaPlayer.play()",
               "mediaPlayer.play()\n                  android.util.Log.i(\"GX1_FIRST_PLAY_TIMING\", \"play called after ms=\" + (android.os.SystemClock.elapsedRealtime() - openStartedAtMs))"),
              ("when (event.type) {",
               "when (event.type) {\n                              MediaPlayer.Event.Opening -> {\n                                  openingEventAfterMs = android.os.SystemClock.elapsedRealtime() - openStartedAtMs\n                                  android.util.Log.i(\"GX1_FIRST_PLAY_TIMING\", \"Opening event after ms=\" + openingEventAfterMs)\n                              }\n                              MediaPlayer.Event.Buffering -> {\n                                  if (bufferingEventAfterMs < 0L) bufferingEventAfterMs = android.os.SystemClock.elapsedRealtime() - openStartedAtMs\n                                  android.util.Log.i(\"GX1_FIRST_PLAY_TIMING\", \"Buffering event after ms=\" + bufferingEventAfterMs)\n                              }"),
              ("MediaPlayer.Event.Playing -> {",
               "MediaPlayer.Event.Playing -> {\n                              android.util.Log.i(\"GX1_FIRST_PLAY_TIMING\", \"Playing event after ms=\" + (android.os.SystemClock.elapsedRealtime() - openStartedAtMs))"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit("Expected playback anchor missing: " + old[:70])
              s = s.replace(old, new, 1)
          p.write_text(s)
          print("Added startup timing logs without changing playback behavior.")
          PY

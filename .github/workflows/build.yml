name: Build GX1 Player APK

on:
  push:
    branches: [ main ]
    paths:
      - 'gx1-player.zip'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: gx1-player-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIP_FILE: gx1-player.zip
  PROJECT_DIR: gx1-player
  GRADLE_VERSION: '8.7'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          test -f "$ZIP_FILE"
          unzip -oq "$ZIP_FILE" -d .
          test -f "$PROJECT_DIR/settings.gradle.kts"

      - name: Inspect original menu implementation
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if "private fun showMenu" in line:
                  print("=== ORIGINAL showMenu() ===")
                  for j in range(i, min(i + 150, len(lines))):
                      print(f"{j+1}: {lines[j]}")
                  break
          else:
              raise SystemExit("showMenu() not found")
          PY

      - name: Install GX1 Player TV app icon
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/drawable/ic_gx1_launcher_foreground.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFB300" android:pathData="M54,8 A46,46 0,1 0,54 100 A46,46 0,1 0,54 8 M54,17 A37,37 0,1 1,54 91 A37,37 0,1 1,54 17" android:fillType="evenOdd"/>
              <path android:fillColor="#E8EDF5" android:pathData="M17,33 L25,27 L31,35 L23,41 Z M29,20 L39,16 L43,25 L33,29 Z M46,15 L57,14 L58,24 L47,25 Z M65,17 L75,21 L71,30 L61,26 Z M81,28 L89,36 L81,43 L74,35 Z M89,48 L94,58 L84,62 L80,52 Z M87,69 L83,79 L73,74 L77,64 Z"/>
              <path android:fillColor="#FF6D00" android:pathData="M43,29 C39,27 35,30 35,35 L35,73 C35,78 40,81 44,78 L77,58 C82,55 82,49 77,46 Z"/>
              <path android:fillColor="#FFD54F" android:pathData="M47,39 L68,52 L47,66 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M25,83 L31,83 L31,88 L36,88 L36,82 L42,82 L42,94 L30,94 C24,94 20,90 20,85 C20,80 24,76 30,76 L42,76 L42,81 L30,81 Z M47,76 L54,76 L60,83 L66,76 L73,76 L64,86 L74,94 L66,94 L60,89 L54,94 L46,94 L56,85 Z"/>
              <path android:fillColor="#FF9100" android:pathData="M78,81 L88,76 L88,94 L81,94 L81,84 L77,86 Z"/>
          </vector>
          XML
          cat > app/src/main/res/drawable/ic_gx1_launcher_background.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#080B12" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#171D2A" android:pathData="M0,0h108v12h-108z"/>
          </vector>
          XML
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_gx1_launcher_background"/>
              <foreground android:drawable="@drawable/ic_gx1_launcher_foreground"/>
          </adaptive-icon>
          XML
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android:icon="@mipmap/ic_launcher"' not in s:
              s = s.replace('<application\n', '<application\n        android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"\n', 1)
          p.write_text(s)
          if 'android:icon="@mipmap/ic_launcher"' not in s:
              raise SystemExit("Could not set launcher icon in manifest")
          PY

      - name: Inspect extracted Media3 player construction
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Player construction and media source lines ==="
          grep -n -E 'ExoPlayer|MediaSourceFactory|setMediaItem|setMediaSourceFactory|\.prepare\(' app/src/main/java/com/example/gx1player/MainActivity.kt || true
          echo "=== Media3 dependency versions ==="
          grep -R -n 'media3-exoplayer\|media3-extractor' --include='*.gradle*' .

      - name: Stage picked media files for reliable random access
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          if "private fun gx1PlaybackUri" not in s:
              helper = """
              private fun gx1PlaybackUri(source: Uri): Uri {
                  if (source.scheme != "content") return source
                  val name = displayName(source).replace(Regex("[^A-Za-z0-9._-]"), "_")
                  val target = java.io.File(cacheDir, "media_${source.toString().hashCode()}_${name}")
                  if (!target.exists() || target.length() == 0L) {
                      val input = contentResolver.openInputStream(source)
                          ?: throw java.io.IOException("Unable to read selected media")
                      input.use { stream -> target.outputStream().use { out -> stream.copyTo(out) } }
                  }
                  return Uri.fromFile(target)
              }

              """
              anchor = "    private fun selectMedia(uri: Uri) {"
              if anchor not in s:
                  raise SystemExit("selectMedia insertion point not found")
              s = s.replace(anchor, helper + anchor, 1)
          old = "val builder = MediaItem.Builder().setUri(uri)"
          new = "val builder = MediaItem.Builder().setUri(gx1PlaybackUri(uri))"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("MediaItem URI builder not found")
          p.write_text(s)
          PY

      - name: Configure Matroska extractor at actual player builder
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          old = "val exo = ExoPlayer.Builder(this, renderers)"
          new = """val gx1Extractors = androidx.media3.extractor.DefaultExtractorsFactory()
                      .setMatroskaExtractorFlags(
                          androidx.media3.extractor.mkv.MatroskaExtractor.FLAG_DISABLE_SEEK_FOR_CUES
                      )
                  val gx1MediaSourceFactory =
                      androidx.media3.exoplayer.source.DefaultMediaSourceFactory(this, gx1Extractors)
                  val exo = ExoPlayer.Builder(this, renderers, gx1MediaSourceFactory)"""
          if old not in s:
              raise SystemExit("Actual ExoPlayer builder line not found")
          if "gx1MediaSourceFactory" not in s:
              s = s.replace(old, new, 1)
          if "@file:androidx.media3.common.util.UnstableApi" not in s and "@file:OptIn" not in s:
              s = s.replace("package ", "@file:androidx.media3.common.util.UnstableApi\n\npackage ", 1)
          p.write_text(s)
          print("Configured Media3 Matroska cue handling on the actual player builder.")
          PY

      - name: Patch Media3 1.4.1 audio sink API
        run: |
          # Float output is already disabled on the renderers factory.
          # Remove any source line that calls the unsupported Media3 1.4.1 builder method.
          TARGET="$PROJECT_DIR/app/src/main/java/com/example/gx1player/PassthroughRenderersFactory.kt"
          test -f "$TARGET"
          grep -n 'setEnableFloatOutput' "$TARGET" || true
          sed -i '/setEnableFloatOutput/d' "$TARGET"
          if grep -n 'setEnableFloatOutput' "$TARGET"; then
            echo "::error::Unsupported float-output builder call remains"
            exit 1
          fi

      - name: Add requested menu and reliable resume behavior
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()

          # Add Matroska MIME recognition and report decoder failures clearly.
          for imp in ["import androidx.activity.OnBackPressedCallback", "import androidx.media3.common.PlaybackException"]:
              if imp not in s:
                  s = s.replace("import androidx.activity.result.contract.ActivityResultContracts", imp + "\n" + "import androidx.activity.result.contract.ActivityResultContracts", 1)
          s = s.replace('arrayOf("video/*", "audio/*")', 'arrayOf("video/*", "audio/*", "application/octet-stream", "application/x-matroska")')
          s = s.replace(
              'val builder = MediaItem.Builder().setUri(uri)',
              '''val builder = MediaItem.Builder().setUri(uri)
                  if (displayName(uri).endsWith(".mkv", ignoreCase = true)) {
                      builder.setMimeType(MimeTypes.APPLICATION_MATROSKA)
                  }''', 1)
          s = s.replace(
              '                if (!isPlaying) savePosition(exo)\n            }',
              '''                if (!isPlaying) savePosition(exo)
              }
              override fun onPlayerError(error: PlaybackException) {
                  val causes = generateSequence<Throwable>(error) { it.cause }
                      .take(6)
                      .map { cause -> "${cause.javaClass.simpleName}: ${cause.message ?: "no message"}" }
                      .joinToString(" <- ")
                  val detail = "${error.errorCodeName} | $causes"
                  android.util.Log.e("GX1Player", "Media3 playback failed: $detail", error)
                  runOnUiThread {
                      AlertDialog.Builder(this@MainActivity)
                          .setTitle("Playback error")
                          .setMessage(detail + "\\n\\nSelected: " + (mediaUri?.toString() ?: "unknown"))
                          .setPositiveButton("OK", null)
                          .show()
                  }
              }''', 1)
          back_marker = '        val initial = intent?.data ?: prefs.getString(KEY_LAST_URI, null)?.let { Uri.parse(it) }'
          back_callback = '''        onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
              override fun handleOnBackPressed() {
                  showMenu()
              }
          })

          '''
          if 'onBackPressedDispatcher.addCallback(this' not in s:
              if back_marker not in s:
                  raise SystemExit("Could not find onCreate insertion point for Back handling")
              s = s.replace(back_marker, back_callback + back_marker, 1)

          # Make the menu discoverable on phones and touchscreens, not only via
          # the Android TV remote MENU/INFO/Y keys.
          for imp in ["import android.view.Gravity", "import android.widget.Button", "import android.widget.FrameLayout"]:
              if imp not in s:
                  s = s.replace("import android.view.KeyEvent", "import android.view.KeyEvent\n" + imp, 1)

          if "setContentView(playerView)" in s and 'text = "Menu"' not in s:
              s = s.replace(
                  "        setContentView(playerView)",
                  """        val root = FrameLayout(this)
                  rootLayout = root
                  root.addView(playerView, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))
                  homePanel = buildHomePanel()
                  root.addView(homePanel, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))
                  playerView.visibility = android.view.View.GONE
                  val menuButton = Button(this).apply {
                      text = "⚙"
                      textSize = 34f
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      contentDescription = "Open player settings"
                      minWidth = 0
                      minHeight = 0
                      setPadding(0, 0, 0, 3)
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.rgb(28, 34, 46))
                          setStroke(2, Color.rgb(150, 177, 210))
                      }
                      elevation = 12f
                      setOnFocusChangeListener { v, focused ->
                          v.background = GradientDrawable().apply {
                              shape = GradientDrawable.OVAL
                              setColor(if (focused) Color.rgb(73, 48, 25) else Color.rgb(28, 34, 46))
                              setStroke(if (focused) 4 else 2,
                                  if (focused) Color.rgb(255, 152, 0) else Color.rgb(150, 177, 210))
                          }
                      }
                      setOnClickListener { showMenu() }
                  }
                  val menuParams = FrameLayout.LayoutParams(
                      72,
                      72,
                      Gravity.BOTTOM or Gravity.END
                  ).apply { setMargins(0, 0, 30, 30) }
                  menuButtonRef = menuButton
                  root.addView(menuButton, menuParams)
                  menuButton.visibility = android.view.View.VISIBLE
                  setContentView(root)""",
                  1
              )

          if 'add("Resume last video")' not in s:
              s, n = re.subn(
                  r'    private fun selectMedia\(uri: Uri\) \{.*?\n    \}',
                  '''    private fun selectMedia(uri: Uri) {
                  mediaUri = uri
                  prefs.edit().putString(KEY_LAST_URI, uri.toString()).apply()
                  subtitleUri = prefs.getString(subKey(uri), null)?.let { Uri.parse(it) }
              }''',
                  s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit("Could not patch selectMedia()")

          if "override fun onPositionDiscontinuity(" not in s:
              marker = "        exo.addAnalyticsListener(object : AnalyticsListener {"
              listener = """        // Persist resume position immediately on pause, seek, and playback-state changes.
                  exo.addListener(object : Player.Listener {
                      override fun onIsPlayingChanged(isPlaying: Boolean) {
                          if (!isPlaying) savePosition(exo)
                      }
                      override fun onPlaybackStateChanged(playbackState: Int) {
                          if (playbackState == Player.STATE_ENDED || playbackState == Player.STATE_READY) {
                              savePosition(exo)
                          }
                      }
                      override fun onPositionDiscontinuity(
                          oldPosition: Player.PositionInfo,
                          newPosition: Player.PositionInfo,
                          reason: Int
                      ) {
                          savePosition(exo)
                      }
                  })

          """
              if marker not in s:
                  raise SystemExit("Could not find player listener insertion point")
              s = s.replace(marker, listener + marker, 1)

          if 'add("Resume last video")' not in s:
              marker = '        add("Open video file") { pickVideo.launch(arrayOf("video/*", "audio/*")) }'
              resume = """        add("Resume last video") {
                      val last = prefs.getString(KEY_LAST_URI, null)?.let { Uri.parse(it) }
                      if (last != null) {
                          selectMedia(last)
                          startPlayer()
                      } else {
                          Toast.makeText(this, "No previous video", Toast.LENGTH_SHORT).show()
                      }
                  }
          """
              if marker not in s:
                  raise SystemExit("Could not find Open video menu item")
              s = s.replace(marker, marker + "\n" + resume, 1)

          if 'add("Restart current video")' not in s:
              marker = '        add(if (passthrough) "Audio pass-through: On (select to turn off)" else "Audio pass-through: Off (select to turn on)") {'
              restart = """        add("Restart current video") {
                      mediaUri?.let { uri ->
                          prefs.edit().remove(posKey(uri)).apply()
                          startPlayer()
                      }
                  }
          """
              if marker not in s:
                  raise SystemExit("Could not find audio menu item")
              s = s.replace(marker, restart + marker, 1)

          # Support two external subtitle tracks per video and persist both choices.
          s = s.replace('        private const val KEY_SUBS_ON = "subs_on"',
                        '        private const val KEY_SUBS_ON = "subs_on"\n        private const val KEY_HISTORY_PREFIX = "history|"')
          s = s.replace('    private var subtitleUri: Uri? = null     // external subtitle file for mediaUri',
                        '    private var subtitleUri: Uri? = null     // first external subtitle\n    private var subtitleUri2: Uri? = null    // second external subtitle')
          second_picker = """
          private val pickSubtitle2 = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
              if (uri == null) return@registerForActivityResult
              takePermission(uri)
              subtitleUri2 = uri
              mediaUri?.let { prefs.edit().putString(subKey(it) + "|2", uri.toString()).apply() }
              startPlayer()
          }
          """
          if "private val pickSubtitle2" not in s:
              s = s.replace('    override fun onCreate(savedInstanceState: Bundle?) {', second_picker + '\n    override fun onCreate(savedInstanceState: Bundle?) {', 1)
          s = s.replace('        subtitleUri = prefs.getString(subKey(uri), null)?.let { Uri.parse(it) }',
                        '        subtitleUri = prefs.getString(subKey(uri), null)?.let { Uri.parse(it) }\n        subtitleUri2 = prefs.getString(subKey(uri) + "|2", null)?.let { Uri.parse(it) }')
          old_subs = """        subtitleUri?.let { sub ->
              val name = displayName(sub)
              builder.setSubtitleConfigurations(
                  listOf(
                      MediaItem.SubtitleConfiguration.Builder(sub)
                          .setMimeType(subtitleMime(name))
                          .setLabel(name)
                          .setSelectionFlags(C.SELECTION_FLAG_DEFAULT)
                          .build()
                  )
              )
          }"""
          new_subs = """        val subtitleConfigs = listOfNotNull(subtitleUri, subtitleUri2).mapIndexed { index, sub ->
              val name = displayName(sub)
              MediaItem.SubtitleConfiguration.Builder(sub)
                  .setMimeType(subtitleMime(name))
                  .setLabel(name)
                  .setSelectionFlags(if (index == 0) C.SELECTION_FLAG_DEFAULT else 0)
                  .build()
          }
          if (subtitleConfigs.isNotEmpty()) builder.setSubtitleConfigurations(subtitleConfigs)"""
          if old_subs in s:
              s = s.replace(old_subs, new_subs, 1)
          s = s.replace('        subtitleUri = null\n        mediaUri?.let { prefs.edit().remove(subKey(it)).apply() }',
                        '        subtitleUri = null\n        subtitleUri2 = null\n        mediaUri?.let { prefs.edit().remove(subKey(it)).remove(subKey(it) + "|2").apply() }')
          s = s.replace('        add("Load subtitle file") {\n            pickSubtitle.launch(arrayOf("application/x-subrip", "text/vtt", "text/plain", "application/octet-stream"))\n        }',
                        '        add("Load subtitle 1") { pickSubtitle.launch(arrayOf("application/x-subrip", "text/vtt", "text/plain", "application/octet-stream")) }\n        add("Load subtitle 2") { pickSubtitle2.launch(arrayOf("application/x-subrip", "text/vtt", "text/plain", "application/octet-stream")) }')
          s = s.replace('        if (subtitleUri != null) add("Remove external subtitle") { removeExternalSubtitle() }',
                        '        if (subtitleUri != null || subtitleUri2 != null) add("Remove external subtitles") { removeExternalSubtitle() }')
          s = s.replace('        add("Build info") { showBuildInfo() }',
                        '        add("History") { showHistory() }\n        add("Build info") { showBuildInfo() }')
          history_method = """
          private fun showHistory() {
              val entries = prefs.all.entries
                  .filter { it.key.startsWith(KEY_HISTORY_PREFIX) && it.value is Long }
                  .sortedByDescending { it.value as Long }
                  .mapNotNull { runCatching { Uri.parse(it.key.removePrefix(KEY_HISTORY_PREFIX)) }.getOrNull() }
              if (entries.isEmpty()) {
                  Toast.makeText(this, "No playback history yet", Toast.LENGTH_SHORT).show()
                  return
              }
              AlertDialog.Builder(this)
                  .setTitle("History")
                  .setItems(entries.map { displayName(it) }.toTypedArray()) { _, which ->
                      selectMedia(entries[which])
                      startPlayer()
                  }
                  .setNegativeButton("Close", null)
                  .show()
          }

          """
          if "private fun showHistory()" not in s:
              s = s.replace('    private fun togglePassthrough() {', history_method + '    private fun togglePassthrough() {', 1)
          s = s.replace('        prefs.edit().putString(KEY_LAST_URI, uri.toString()).apply()\n        subtitleUri =',
                        '        prefs.edit().putString(KEY_LAST_URI, uri.toString()).putLong(KEY_HISTORY_PREFIX + uri.toString(), System.currentTimeMillis()).apply()\n        subtitleUri =')

          # Add a persistent folder-based media library using Android's Storage Access Framework.
          for imp in ["import android.provider.DocumentsContract", "import android.database.Cursor"]:
              if imp not in s:
                  s = s.replace("import android.net.Uri", "import android.net.Uri\n" + imp, 1)
          if "private val pickLibraryFolder" not in s:
              launcher = """
          private val pickLibraryFolder = registerForActivityResult(ActivityResultContracts.OpenDocumentTree()) { uri ->
              if (uri != null) {
                  val flags = Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                  runCatching { contentResolver.takePersistableUriPermission(uri, flags) }
                  prefs.edit().putString("library_tree_uri", uri.toString()).apply()
                  showLibrary()
              }
          }
          """
              s = s.replace("    override fun onCreate(savedInstanceState: Bundle?) {", launcher + "\n    override fun onCreate(savedInstanceState: Bundle?) {", 1)
          library_methods = r'''
          private fun showLibrary() {
              val saved = prefs.getString("library_tree_uri", null)?.let { Uri.parse(it) }
              if (saved == null) {
                  AlertDialog.Builder(this)
                      .setTitle("Set up your library")
                      .setMessage("Choose a movies or music folder. GX1 Player will remember it for next time.")
                      .setPositiveButton("Choose folder") { _, _ -> pickLibraryFolder.launch(null) }
                      .setNegativeButton("Cancel", null)
                      .show()
                  return
              }
              val childrenUri = DocumentsContract.buildChildDocumentsUriUsingTree(
                  saved, DocumentsContract.getTreeDocumentId(saved)
              )
              val items = mutableListOf<Pair<String, Uri>>()
              val names = mutableListOf<String>()
              try {
                  contentResolver.query(
                      childrenUri,
                      arrayOf(DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                              DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                              DocumentsContract.Document.COLUMN_MIME_TYPE),
                      null, null, null
                  )?.use { cursor ->
                      val idCol = cursor.getColumnIndexOrThrow(DocumentsContract.Document.COLUMN_DOCUMENT_ID)
                      val nameCol = cursor.getColumnIndexOrThrow(DocumentsContract.Document.COLUMN_DISPLAY_NAME)
                      val mimeCol = cursor.getColumnIndexOrThrow(DocumentsContract.Document.COLUMN_MIME_TYPE)
                      while (cursor.moveToNext()) {
                          val name = cursor.getString(nameCol) ?: continue
                          val mime = cursor.getString(mimeCol) ?: ""
                          if (mime.startsWith("video/") || mime.startsWith("audio/") ||
                              name.endsWith(".mkv", true) || name.endsWith(".mp4", true) ||
                              name.endsWith(".avi", true) || name.endsWith(".mov", true) ||
                              name.endsWith(".mp3", true) || name.endsWith(".flac", true) ||
                              name.endsWith(".m4a", true)) {
                              val doc = DocumentsContract.buildDocumentUriUsingTree(saved, cursor.getString(idCol))
                              items.add(name to doc)
                              names.add("▶   " + name)
                          }
                      }
                  }
              } catch (e: Exception) {
                  prefs.edit().remove("library_tree_uri").apply()
                  Toast.makeText(this, "Library folder access expired. Please choose it again.", Toast.LENGTH_LONG).show()
                  pickLibraryFolder.launch(null)
                  return
              }
              val options = if (items.isEmpty()) arrayOf("No media files found", "Choose a different folder") else
                  names.toTypedArray() + "Change library folder"
              AlertDialog.Builder(this)
                  .setTitle("LIBRARY  ·  " + items.size + " items")
                  .setItems(options) { _, which ->
                      if (which < items.size) {
                          selectMedia(items[which].second)
                          startPlayer()
                      } else if (items.isEmpty() || which == items.size) {
                          pickLibraryFolder.launch(null)
                      }
                  }
                  .setNegativeButton("Close", null)
                  .show()
          }

          '''
          if "private fun showLibrary()" not in s:
              s = s.replace("    private fun showMenu() {", library_methods + "    private fun showMenu() {", 1)
          if 'addTile("Library"' not in s:
              s = s.replace('              addTile("Open video", "Browse files") {',
                            '              addTile("Library", "Browse your folders") { showLibrary() }\n              addTile("Open video", "Choose one file") {', 1)

          # Replace the player-only launch with a TV-first home dashboard.
          for imp in ["import android.graphics.drawable.GradientDrawable", "import android.view.View", "import android.widget.LinearLayout", "import android.widget.TextView"]:
              if imp not in s:
                  s = s.replace("import android.view.KeyEvent", "import android.view.KeyEvent\n" + imp, 1)
          fields = """    private lateinit var rootLayout: FrameLayout
          private lateinit var homePanel: LinearLayout
          private lateinit var menuButtonRef: Button

          """
          if "private lateinit var rootLayout: FrameLayout" not in s:
              s = s.replace("    private lateinit var playerView: PlayerView", fields + "    private lateinit var playerView: PlayerView", 1)
          home_methods = r'''
          private fun buildHomePanel(): LinearLayout {
              val panel = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  setPadding(56, 36, 56, 32)
                  setBackgroundColor(Color.rgb(10, 14, 22))
                  gravity = android.view.Gravity.CENTER_VERTICAL
              }
              val brand = TextView(this).apply {
                  text = "GX1 PLAYER"
                  textSize = 30f
                  setTextColor(Color.WHITE)
                  letterSpacing = 0.12f
                  setTypeface(null, android.graphics.Typeface.BOLD)
              }
              panel.addView(brand)
              val subtitle = TextView(this).apply {
                  text = "Your movies. Your screen."
                  textSize = 16f
                  setTextColor(Color.LTGRAY)
                  setPadding(0, 6, 0, 28)
              }
              panel.addView(subtitle)
              val section = TextView(this).apply {
                  text = "LIBRARY"
                  textSize = 13f
                  letterSpacing = 0.18f
                  setTextColor(Color.rgb(255, 152, 0))
                  setPadding(0, 0, 0, 12)
              }
              panel.addView(section)
              val row = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL
                  gravity = android.view.Gravity.CENTER_VERTICAL
              }
              fun addTile(label: String, detail: String, action: () -> Unit) {
                  val tile = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = android.view.Gravity.CENTER
                      isFocusable = true
                      isFocusableInTouchMode = true
                      setPadding(22, 20, 22, 20)
                      background = GradientDrawable().apply {
                          setColor(Color.rgb(27, 34, 47))
                          cornerRadius = 18f
                          setStroke(2, Color.rgb(58, 68, 84))
                      }
                      setOnClickListener { action() }
                      setOnFocusChangeListener { v, focused ->
                          v.background = GradientDrawable().apply {
                              setColor(if (focused) Color.rgb(65, 42, 20) else Color.rgb(27, 34, 47))
                              cornerRadius = 18f
                              setStroke(if (focused) 4 else 2, if (focused) Color.rgb(255, 145, 0) else Color.rgb(58, 68, 84))
                          }
                      }
                  }
                  val title = TextView(this).apply {
                      text = label
                      textSize = 20f
                      setTextColor(Color.WHITE)
                      setTypeface(null, android.graphics.Typeface.BOLD)
                  }
                  val hint = TextView(this).apply {
                      text = detail
                      textSize = 13f
                      setTextColor(Color.LTGRAY)
                      setPadding(0, 8, 0, 0)
                  }
                  tile.addView(title)
                  tile.addView(hint)
                  row.addView(tile, LinearLayout.LayoutParams(0, 132, 1f).apply {
                      setMargins(0, 0, 16, 0)
                  })
              }
              addTile("Open video", "Browse files") {
                  pickVideo.launch(arrayOf("video/*", "audio/*", "application/octet-stream", "application/x-matroska"))
              }
              addTile("Resume", "Continue watching") {
                  val last = prefs.getString(KEY_LAST_URI, null)?.let { Uri.parse(it) }
                  if (last != null) { selectMedia(last); startPlayer() }
                  else Toast.makeText(this, "No previous video", Toast.LENGTH_SHORT).show()
              }
              addTile("History", "Recently played") { showHistory() }
              panel.addView(row)
              val footer = TextView(this).apply {
                  text = "MENU  ·  Playback options     •     BACK  ·  Player menu"
                  textSize = 13f
                  setTextColor(Color.rgb(135, 148, 166))
                  setPadding(0, 30, 0, 0)
              }
              panel.addView(footer)
              panel.isFocusableInTouchMode = true
              panel.post { row.getChildAt(0)?.requestFocus() }
              return panel
          }

          private fun showHome() {
              if (!::homePanel.isInitialized) return
              homePanel.visibility = View.VISIBLE
              playerView.visibility = View.GONE
              if (::menuButtonRef.isInitialized) menuButtonRef.visibility = View.VISIBLE
              homePanel.requestFocus()
          }

          '''
          if "private fun buildHomePanel()" not in s:
              s = s.replace("    private fun showMenu() {", home_methods + "    private fun showMenu() {", 1)
          # When playback starts, reveal the player surface and its menu affordance.
          s = s.replace("        playerView.player = exo\n        player = exo",
                        "        playerView.player = exo\n        playerView.visibility = View.VISIBLE\n        homePanel.visibility = View.GONE\n        if (::menuButtonRef.isInitialized) menuButtonRef.visibility = View.VISIBLE\n        player = exo", 1)
          # Let the user return to the TV home dashboard from the menu.
          if 'add("Home")' not in s:
              s = s.replace('        add("Open video file") {', '        add("Home") { showHome() }\n        add("Open video file") {', 1)
          # No forced file picker on first launch; land on the dashboard.
          # Replace the first-launch file picker regardless of the MIME types above.
          s, home_launch_matches = re.subn(
              r'\}\s*else\s*\{\s*pickVideo\.launch\(arrayOf\([^\n]*\)\)\s*\}',
              '} else { showHome() }',
              s, count=1)
          if home_launch_matches != 1:
              raise SystemExit("Could not replace first-launch picker with home screen")


          p.write_text(s)
          required = ['private fun buildHomePanel()', 'addTile("Open video"', 'addTile("Resume"', 'addTile("History"', 'homePanel.visibility = View.GONE']
          missing_ui = [item for item in required if item not in s]
          if missing_ui:
              raise SystemExit("Missing TV UI elements: " + ", ".join(missing_ui))
          required = ['add("Resume last video")', 'add("Restart current video")',
                      'add("Load subtitle 1")', 'add("Load subtitle 2")',
                      'add("History")', 'private fun showHistory()', 'subtitleUri2',
                      'override fun onPositionDiscontinuity(']
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit("Missing features: " + ", ".join(missing))
          print("All requested menu and resume features verified.")
          PY

      - name: Add full-screen VLC-style TV library
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          method = r"""
          private fun showLibraryHub(category: String = "All", parentId: String? = null) {
              val tree = prefs.getString("library_tree_uri", null)?.let { Uri.parse(it) }
              if (tree == null) {
                  AlertDialog.Builder(this).setTitle("Set up your library")
                      .setMessage("Choose the folder containing your movies and music.")
                      .setPositiveButton("Choose folder") { _, _ -> pickLibraryFolder.launch(null) }
                      .setNegativeButton("Cancel", null).show()
                  return
              }
              val id = parentId ?: DocumentsContract.getTreeDocumentId(tree)
              val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, id)
              data class Entry(val name: String, val uri: Uri, val mime: String, val dir: Boolean)
              val entries = mutableListOf<Entry>()
              contentResolver.query(children, arrayOf(
                  DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                  DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                  DocumentsContract.Document.COLUMN_MIME_TYPE
              ), null, null, null)?.use { c ->
                  val ci = c.getColumnIndexOrThrow(DocumentsContract.Document.COLUMN_DOCUMENT_ID)
                  val cn = c.getColumnIndexOrThrow(DocumentsContract.Document.COLUMN_DISPLAY_NAME)
                  val cm = c.getColumnIndexOrThrow(DocumentsContract.Document.COLUMN_MIME_TYPE)
                  while (c.moveToNext()) {
                      val name = c.getString(cn) ?: continue
                      val mime = c.getString(cm) ?: ""
                      val dir = mime == DocumentsContract.Document.MIME_TYPE_DIR
                      val ext = name.substringAfterLast(".", "").lowercase()
                      val media = mime.startsWith("video/") || mime.startsWith("audio/") ||
                          ext in listOf("mkv","mp4","avi","mov","webm","mp3","flac","m4a","aac","wav")
                      if (dir || media) entries.add(Entry(name,
                          DocumentsContract.buildDocumentUriUsingTree(tree, c.getString(ci)), mime, dir))
                  }
              }
              val filtered = entries.filter { e ->
                  val audio = e.mime.startsWith("audio/") || e.name.substringAfterLast(".", "").lowercase() in listOf("mp3","flac","m4a","aac","wav")
                  when (category) { "Movies" -> !e.dir && !audio; "Music" -> !e.dir && audio; "Folders" -> e.dir; else -> true }
              }.sortedWith(compareByDescending<Entry> { it.dir }.thenBy { it.name.lowercase() })
              val panel = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL; setPadding(32, 24, 32, 20)
                  setBackgroundColor(Color.rgb(8, 11, 18)); isFocusableInTouchMode = true
              }
              val header = TextView(this).apply {
                  text = "GX1  /  LIBRARY"; textSize = 27f; setTextColor(Color.WHITE)
                  setTypeface(null, android.graphics.Typeface.BOLD)
              }
              panel.addView(header)
              val tabs = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, 16, 0, 16) }
              fun addTab(label: String, selected: Boolean, action: () -> Unit) {
                  val b = Button(this).apply {
                      text = label; isAllCaps = false; textSize = 13f; setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          setColor(if (selected) Color.rgb(190, 93, 0) else Color.rgb(31, 39, 52))
                          cornerRadius = 12f
                      }
                      setOnClickListener { action() }
                  }
                  tabs.addView(b, LinearLayout.LayoutParams(-2, 48).apply { setMargins(0, 0, 9, 0) })
              }
              addTab("All", category == "All") { showLibraryHub("All", parentId) }
              addTab("Movies", category == "Movies") { showLibraryHub("Movies", parentId) }
              addTab("Music", category == "Music") { showLibraryHub("Music", parentId) }
              addTab("Folders", category == "Folders") { showLibraryHub("Folders", parentId) }
              addTab("History", false) { showHistory() }
              addTab("Change folder", false) { pickLibraryFolder.launch(null) }
              panel.addView(tabs)
              val summary = TextView(this).apply {
                  text = filtered.size.toString() + " ITEMS"; textSize = 12f
                  setTextColor(Color.rgb(255, 152, 0)); setPadding(0, 0, 0, 10)
              }
              panel.addView(summary)
              val scroll = android.widget.ScrollView(this)
              val list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
              val rows = filtered.chunked(2)
              if (rows.isEmpty()) list.addView(TextView(this).apply {
                  text = "No media found in this folder."; textSize = 18f
                  setTextColor(Color.LTGRAY); setPadding(12, 28, 12, 28)
              })
              rows.forEach { pair ->
                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  pair.forEach { e ->
                      val card = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_VERTICAL
                          isFocusable = true; isFocusableInTouchMode = true; setPadding(18, 12, 18, 12)
                          background = GradientDrawable().apply {
                              setColor(Color.rgb(25, 32, 45)); cornerRadius = 14f
                              setStroke(2, Color.rgb(49, 61, 79))
                          }
                          setOnFocusChangeListener { v, f ->
                              v.background = GradientDrawable().apply {
                                  setColor(if (f) Color.rgb(68, 43, 20) else Color.rgb(25, 32, 45))
                                  cornerRadius = 14f
                                  setStroke(if (f) 4 else 2, if (f) Color.rgb(255, 145, 0) else Color.rgb(49, 61, 79))
                              }
                          }
                          setOnClickListener {
                              if (e.dir) showLibraryHub("All", DocumentsContract.getDocumentId(e.uri))
                              else { selectMedia(e.uri); startPlayer() }
                          }
                      }
                      card.addView(TextView(this).apply {
                          text = if (e.dir) "▰" else if (e.mime.startsWith("audio/")) "♫" else "▶"
                          textSize = 28f; setTextColor(Color.rgb(255, 145, 0))
                      })
                      card.addView(TextView(this).apply {
                          text = e.name; textSize = 17f; maxLines = 2
                          setTextColor(Color.WHITE); setTypeface(null, android.graphics.Typeface.BOLD)
                      })
                      card.addView(TextView(this).apply {
                          text = if (e.dir) "FOLDER" else if (e.mime.startsWith("audio/")) "AUDIO" else "VIDEO"
                          textSize = 11f; setTextColor(Color.LTGRAY); setPadding(0, 5, 0, 0)
                      })
                      row.addView(card, LinearLayout.LayoutParams(0, 116, 1f).apply { setMargins(0, 0, 12, 12) })
                  }
                  if (pair.size == 1) row.addView(View(this), LinearLayout.LayoutParams(0, 116, 1f))
                  list.addView(row)
              }
              scroll.addView(list)
              panel.addView(scroll, LinearLayout.LayoutParams(-1, 0, 1f))
              panel.addView(Button(this).apply {
                  text = if (parentId == null) "Back to Home" else "Back to Library"
                  isAllCaps = false
                  setOnClickListener { if (parentId == null) showHome() else showLibraryHub(category) }
              })
              homePanel.visibility = View.GONE; playerView.visibility = View.GONE
              if (::menuButtonRef.isInitialized) menuButtonRef.visibility = View.GONE
              rootLayout.findViewWithTag<View>("gx1_library_panel")?.let { rootLayout.removeView(it) }
              panel.tag = "gx1_library_panel"
              rootLayout.addView(panel, FrameLayout.LayoutParams(-1, -1))
              panel.post { tabs.getChildAt(0)?.requestFocus() }
          }

          """
          if "private fun showLibraryHub(" not in s:
              s = s.replace("    private fun showMenu() {", method + "    private fun showMenu() {", 1)
          s = s.replace('addTile("Open video", "Browse files") {',
                        'addTile("Library", "Movies  ·  Music  ·  Folders") { showLibraryHub() }\n              addTile("Open video", "Browse files") {', 1)
          p.write_text(s)
          if "private fun showLibraryHub(" not in s or 'addTile("Library"' not in s:
              raise SystemExit("Library UI patch did not apply")
          print("Full-screen VLC-style TV library inserted.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Configure stable versioning and release signing
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          val buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()
          val storeFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
          val storePasswordValue = System.getenv("ANDROID_KEYSTORE_PASSWORD")
          val aliasValue = System.getenv("ANDROID_KEY_ALIAS")
          val keyPasswordValue = System.getenv("ANDROID_KEY_PASSWORD")
          val signed = !storeFilePath.isNullOrBlank() && !storePasswordValue.isNullOrBlank() &&
              !aliasValue.isNullOrBlank() && !keyPasswordValue.isNullOrBlank()

          android {
              namespace = "com.example.gx1player"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.gx1player"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = buildNumber
                  versionName = "1.0.$buildNumber"
                  buildConfigField("String", "BUILD_NUMBER", "\"$buildNumber\"")
              }
              buildFeatures { buildConfig = true }
              signingConfigs {
                  if (signed) create("stableRelease") {
                      storeFile = file(storeFilePath!!)
                      storePassword = storePasswordValue
                      keyAlias = aliasValue
                      keyPassword = keyPasswordValue
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      if (signed) signingConfig = signingConfigs.getByName("stableRelease")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              val media3 = "1.4.1"
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-ui:$media3")
              implementation("androidx.media3:media3-common:$media3")
              implementation("androidx.media3:media3-extractor:$media3")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          GRADLE

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gx1-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/gx1-release.jks" >> "$GITHUB_ENV"
            echo "BUILD_KIND=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets are not configured; producing a debug APK that cannot update-install over a differently signed app."
            echo "BUILD_KIND=debug" >> "$GITHUB_ENV"
          fi

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version "$GRADLE_VERSION" --no-daemon

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "$BUILD_KIND" = "release" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gx1-player-${{ env.BUILD_KIND }}-b${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/${{ env.BUILD_KIND }}/*.apk
          if-no-files-found: error
          retention-days: 30

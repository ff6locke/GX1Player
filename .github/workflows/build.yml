      - name: Add GX1 in-app subtitle file browser
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          player_anchor = "    private var player: ExoPlayer? = null"
          if "private var subtitleUri: Uri? = null" not in s:
              if player_anchor not in s:
                  raise SystemExit("Could not find player field insertion point")
              s = s.replace(player_anchor, "    private var subtitleUri: Uri? = null" + chr(10) + "    private var subtitleUri2: Uri? = null" + chr(10) + player_anchor, 1)
          elif "private var subtitleUri2: Uri? = null" not in s:
              s = s.replace("    private var subtitleUri: Uri? = null", "    private var subtitleUri: Uri? = null" + chr(10) + "    private var subtitleUri2: Uri? = null", 1)
          method = r'''
              private fun currentVideoFile(): java.io.File? {
                  val uri = mediaUri ?: return null
                  if (uri.scheme == "file") return uri.path?.let { java.io.File(it) }
                  return try {
                      contentResolver.query(uri, arrayOf(android.provider.MediaStore.MediaColumns.DATA), null, null, null)?.use { c ->
                          if (c.moveToFirst()) c.getString(0)?.takeIf { it.isNotBlank() }?.let { java.io.File(it) } else null
                      }
                  } catch (_: Exception) { null }
              }

              private fun showSubtitleFilePicker(slot: Int, folder: java.io.File? = null) {
                  val video = currentVideoFile()
                  val startFolder = folder ?: video?.parentFile
                  if (startFolder == null || !startFolder.isDirectory) {
                      AlertDialog.Builder(this).setTitle("Subtitle folder unavailable")
                          .setMessage("GX1 Player cannot resolve the video's folder. Please check storage access.")
                          .setPositiveButton("OK", null).show()
                      return
                  }
                  val videoBase = video?.nameWithoutExtensionCompat()?.lowercase(java.util.Locale.ROOT)
                  val dirs = startFolder.listFiles()?.filter { it.isDirectory && !it.name.startsWith(".") }
                      ?.sortedBy { it.name.lowercase(java.util.Locale.ROOT) } ?: emptyList()
                  val subtitleFiles = startFolder.listFiles()?.filter {
                      it.isFile && it.extension.lowercase(java.util.Locale.ROOT) in setOf("srt", "ass", "ssa", "vtt", "sub")
                  } ?: emptyList()
                  val sortedSubs = subtitleFiles.sortedWith(compareBy<java.io.File>(
                      { if (videoBase != null && it.nameWithoutExtensionCompat().equals(videoBase, true)) 0 else 1 },
                      { it.name.lowercase(java.util.Locale.ROOT) }
                  ))
                  val entries = mutableListOf<Pair<String, java.io.File?>>()
                  if (startFolder.parentFile != null) entries.add("..  (Parent folder)" to null)
                  dirs.forEach { entries.add("📁  ${it.name}" to it) }
                  sortedSubs.forEach {
                      val isMatch = videoBase != null && it.nameWithoutExtensionCompat().equals(videoBase, true)
                      entries.add((if (isMatch) "★  " else "      ") + it.name + (if (isMatch) "  (video name match)" else "") to it)
                  }
                  if (entries.isEmpty()) {
                      AlertDialog.Builder(this).setTitle("Choose subtitle")
                          .setMessage("No subtitle files found in:\n${startFolder.absolutePath}")
                          .setPositiveButton("OK", null).show()
                      return
                  }
                  val title = "Subtitle ${slot} — ${video?.nameWithoutExtensionCompat() ?: "Choose file"}"
                  AlertDialog.Builder(this)
                      .setTitle(title)
                      .setItems(entries.map { it.first }.toTypedArray()) { dialog, which ->
                          val chosen = entries[which].second
                          if (chosen == null) {
                              dialog.dismiss()
                              showSubtitleFilePicker(slot, startFolder.parentFile)
                          } else if (chosen.isDirectory) {
                              dialog.dismiss()
                              showSubtitleFilePicker(slot, chosen)
                          } else {
                              val uri = Uri.fromFile(chosen)
                              val videoUri = mediaUri
                              if (slot == 1) {
                                  subtitleUri = uri
                                  videoUri?.let { prefs.edit().putString(subKey(it), uri.toString()).apply() }
                                  loadFirstSubtitleOverlay()
                                  subtitleUiHandler.removeCallbacks(subtitleTicker)
                                  subtitleUiHandler.post(subtitleTicker)
                              } else {
                                  subtitleUri2 = uri
                                  subtitle2Uri = uri
                                  videoUri?.let { prefs.edit().putString(subKey(it) + "|2", uri.toString()).apply() }
                                  loadSecondSubtitleOverlay()
                              }
                              Toast.makeText(this, "Subtitle ${slot}: ${chosen.name}", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun java.io.File.nameWithoutExtensionCompat(): String {
                  val n = name
                  val dot = n.lastIndexOf('.')
                  return if (dot > 0) n.substring(0, dot) else n
              }

          '''
          if "private fun showSubtitleFilePicker(slot: Int" not in s:
              marker = "    private fun showMenu() {"
              if marker not in s:
                  raise SystemExit("Could not find showMenu() insertion point for subtitle browser")
              s = s.replace(marker, method + marker, 1)
          s = s.replace('pickSubtitle.launch(arrayOf("application/x-subrip", "text/vtt", "text/plain", "application/octet-stream"))', 'showSubtitleFilePicker(1)')
          s = s.replace('pickSubtitle2.launch(arrayOf("application/x-subrip", "text/vtt", "text/plain", "application/octet-stream"))', 'showSubtitleFilePicker(2)')
          s = s.replace('if (which == 0) pickSubtitle.launch(types) else pickSubtitle2.launch(types)', 'if (which == 0) showSubtitleFilePicker(1) else showSubtitleFilePicker(2)')
          s = s.replace('pickSubtitle.launch(types)', 'showSubtitleFilePicker(1)')
          s = s.replace('pickSubtitle.launch(arrayOf("*/*"))', 'showSubtitleFilePicker(1)')
          s = s.replace('pickSubtitle2.launch(arrayOf("*/*"))', 'showSubtitleFilePicker(2)')
          import re
          s = re.sub(r'pickSubtitle2?\\.launch\\(arrayOf\\([^)]*\\)\\)', lambda m: 'showSubtitleFilePicker(2)' if m.group(0).startswith('pickSubtitle2') else 'showSubtitleFilePicker(1)', s)
          s = s.replace('pickSubtitle.launch(types)', 'showSubtitleFilePicker(1)')
          s = s.replace('pickSubtitle2.launch(types)', 'showSubtitleFilePicker(2)')
          # Subtitle 1 is a Media3 track: reload the current media item with its subtitle configuration.
          # This picker step runs after the overlay-removal step, so replace the obsolete call here.
          s = s.replace("loadFirstSubtitleOverlay()", "startPlayer()")
          s = s.replace("""                                  loadFirstSubtitleOverlay()
                                  subtitleUiHandler.removeCallbacks(subtitleTicker)
                                  subtitleUiHandler.post(subtitleTicker)""", """                                  startPlayer()""")
          # Subtitle 2 must remain exclusively in GX1's synchronized ASS/SRT overlay.
          s = s.replace('listOfNotNull(subtitleUri, subtitleUri2)', 'listOfNotNull(subtitleUri)')
          remaining = [line.strip() for line in s.splitlines() if 'pickSubtitle.launch(' in line or 'pickSubtitle2.launch(' in line]
          if remaining:
              raise SystemExit("System subtitle picker calls remain: " + repr(remaining))
          p.write_text(s)
          print("Subtitle selection now uses GX1's own folder browser, starts in the video's folder, and sorts same-basename subtitle files first.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Configure stable versioning and release signing
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          val buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()
          val storeFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
          val storePasswordValue = System.getenv("ANDROID_KEYSTORE_PASSWORD")
          val aliasValue = System.getenv("ANDROID_KEY_ALIAS")
          val keyPasswordValue = System.getenv("ANDROID_KEY_PASSWORD")
          val signed = !storeFilePath.isNullOrBlank() && !storePasswordValue.isNullOrBlank() &&
              !aliasValue.isNullOrBlank() && !keyPasswordValue.isNullOrBlank()

          android {
              namespace = "com.example.gx1player"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.example.gx1player"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = buildNumber
                  versionName = "1.0.$buildNumber"
                  buildConfigField("String", "BUILD_NUMBER", "\"$buildNumber\"")
              }
              buildFeatures { buildConfig = true }
              signingConfigs {
                  if (signed) create("stableRelease") {
                      storeFile = file(storeFilePath!!)
                      storePassword = storePasswordValue
                      keyAlias = aliasValue
                      keyPassword = keyPasswordValue
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      if (signed) signingConfig = signingConfigs.getByName("stableRelease")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

      - name: Normalize generated Kotlin strings before compilation
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          source = path.read_text()
          vlc_path = Path("app/src/main/java/com/example/gx1player/VlcTestActivity.kt")
          if vlc_path.exists():
              vlc_source = vlc_path.read_text()
              vlc_source = re.sub(r'joinToString\("\s*\n\s*"\)', r'joinToString("\\n")', vlc_source)
              vlc_path.write_text(vlc_source)
          if "private lateinit var rootLayout: FrameLayout" not in source:
              anchor = "    private lateinit var playerView: PlayerView"
              if anchor not in source: raise SystemExit("MainActivity PlayerView field anchor missing")
              source = source.replace(anchor, "    private lateinit var rootLayout: FrameLayout\n" + anchor, 1)
          if "private lateinit var homePanel:" not in source:
              anchor = "    private var player: ExoPlayer? = null"
              fields = """    private lateinit var homePanel: android.view.ViewGroup
          private var homeFirstTile: android.view.View? = null
          private lateinit var menuButtonRef: android.view.View
          """
              if anchor not in source: raise SystemExit("MainActivity player field anchor missing")
              source = source.replace(anchor, anchor + "\n" + fields, 1)
          source = re.sub(
              r'joinToString\("\s*\n\s*"\)',
              r'joinToString("\n")',
              source
          )
          source = re.sub(
              r'\.setMessage\(detail \+ "\s*\n\s*\nSelected: " \+',
              r'.setMessage(detail + "\\n\\nSelected: " +',
              source
          )
          source = source.replace(
              'secondSubtitleOverlay.elevation = 1000f',
              'secondSubtitleOverlay.elevation = 1000.0f'
          )
          out = []
          i = 0
          in_string = False
          in_triple = False
          in_char = False
          in_line_comment = False
          while i < len(source):
              if in_line_comment:
                  if source.startswith(r"\n", i):
                      out.append("\n")
                      i += 3
                      in_line_comment = False
                      continue
                  if source.startswith(r"\n", i):
                      out.append("\n")
                      i += 2
                      in_line_comment = False
                      continue
                  ch = source[i]
                  out.append(ch)
                  if ch == "\n":
                      in_line_comment = False
                  i += 1
                  continue
              if in_triple:
                  if source.startswith('"""', i):
                      out.append('"""')
                      i += 3
                      in_triple = False
                  else:
                      out.append(source[i])
                      i += 1
                  continue
              if in_string or in_char:
                  ch = source[i]
                  if ch == "\n" and in_string:
                      out.append(r"\n")
                      i += 1
                      continue
                  out.append(ch)
                  if ch == "\\" and i + 1 < len(source):
                      out.append(source[i + 1])
                      i += 2
                      continue
                  if in_string and ch == '"':
                      in_string = False
                  elif in_char and ch == "'":
                      in_char = False
                  i += 1
                  continue
              if source.startswith("//", i):
                  out.append("//")
                  i += 2
                  in_line_comment = True
                  continue
              if source.startswith('"""', i):
                  out.append('"""')
                  i += 3
                  in_triple = True
                  continue
              if source[i] == '"':
                  out.append('"')
                  i += 1
                  in_string = True
                  continue
              if source[i] == "'":
                  out.append("'")
                  i += 1
                  in_char = True
                  continue
              if source.startswith(r"\n", i):
                  out.append("\n")
                  i += 3
                  continue
              if source.startswith(r"\n", i):
                  out.append("\n")
                  i += 2
                  continue
              out.append(source[i])
              i += 1
          normalized = "".join(out)
          path.write_text(normalized + ("\n" if not normalized.endswith("\n") else ""))
          print("Kotlin source normalization completed with string literals preserved.")
          PY

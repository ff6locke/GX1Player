                          .setLabel(name)
                          .setSelectionFlags(C.SELECTION_FLAG_DEFAULT)
                          .build()
                  )
              )
          }"""
          config = re.search(
              r'        val subtitleConfigs = listOfNotNull\(subtitleUri, subtitleUri2\).*?if \(subtitleConfigs.isNotEmpty\(\)\) builder\.setSubtitleConfigurations\(subtitleConfigs\)',
              s, re.S
          )
          if config:
              s = s[:config.start()] + old + s[config.end():]
          elif "setSubtitleConfigurations" not in s:
              print("Native Subtitle 1 configuration pattern not found; preserve source Media3 track handling.")
          s = s.replace(
              "val active1 = firstSubtitleCues.filter { pos >= it.startMs && pos <= it.endMs }\n                  ", ""
          )
          a = s.find("private val subtitleTicker = object : Runnable")
          if a < 0: raise SystemExit("Subtitle ticker declaration missing")
          brace = s.find("{", a)
          if brace < 0: raise SystemExit("Subtitle ticker opening brace missing")
          depth = 0
          end = -1
          for pos in range(brace, len(s)):
              if s[pos] == "{":
                  depth += 1
              elif s[pos] == "}":
                  depth -= 1
                  if depth == 0:
                      end = pos + 1
                      break
          if end < 0: raise SystemExit("Subtitle ticker closing brace missing")
          ticker = """private val subtitleTicker = object : Runnable {
              override fun run() {
                  val pos = player?.currentPosition ?: 0L
                  val active2 = secondSubtitleCues.filter { pos >= it.startMs && pos <= it.endMs }
                  if (::secondSubtitleOverlay.isInitialized) {
                      secondSubtitleOverlay.text = active2.joinToString("\n") { it.text }
                      secondSubtitleOverlay.visibility =
                          if (active2.isEmpty() || player?.isPlaying != true) android.view.View.GONE
                          else android.view.View.VISIBLE
                      secondSubtitleOverlay.bringToFront()
                      secondSubtitleOverlay.elevation = 1000f
                  }
                  subtitleUiHandler.postDelayed(this, 200L)
              }
          }"""
          s = s[:a] + ticker + s[end:]
          s = s.replace("private lateinit var firstSubtitleOverlay: android.widget.TextView\n", "")
          s = s.replace("private fun loadFirstSubtitleOverlay()", "private fun loadFirstSubtitleOverlay_REMOVED()")
          removed = re.sub(
              r'(?m)^[ \t]*loadFirstSubtitleOverlay\(\)[ \t]*\r?\n[ \t]*subtitleUiHandler\.removeCallbacks\(subtitleTicker\)[ \t]*\r?\n[ \t]*subtitleUiHandler\.post\(subtitleTicker\)',
              "startPlayer()",
              s
          )
          if removed == 0 and "loadFirstSubtitleOverlay()" in s:
              raise SystemExit("Unremoved call to deleted loadFirstSubtitleOverlay() remains")
          p.write_text(s)
          print("Media3 handles Subtitle 1; GX1's custom overlay handles Subtitle 2 only.")
          PY

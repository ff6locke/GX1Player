      - name: Configure LibVLC digital output after media assignment
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/example/gx1player/playback/Gx1LibVlcEngine.kt")
          s = p.read_text()
          # Match the standalone VLC test sequence: assign media first, then
          # enable digital output, then start playback. Do not call
          # setAudioOutputDevice("pcm") or setAudioOutputDevice(null): those
          # device overrides can produce LibVLC's "aout invalid" failure.
          s = re.sub(
              r'(?m)^\\s*mediaPlayer\\.setAudioOutputDevice\\([^\\n]*\\)\\s*\\n',
              '',
              s
          )
          s = re.sub(
              r'(?m)^\\s*mediaPlayer\\.setAudioDigitalOutputEnabled\\(digitalOutput\\)\\s*\\n',
              '',
              s
          )
          anchor = "mediaPlayer.media = media"
          if anchor not in s:
              raise SystemExit("Could not find LibVLC media assignment")
          if "mediaPlayer.setAudioDigitalOutputEnabled(digitalOutput)" not in s:
              s = s.replace(anchor, anchor + "\\n                  mediaPlayer.setAudioDigitalOutputEnabled(digitalOutput)", 1)
          if "setAudioOutputDevice(" in s:
              raise SystemExit("Unexpected explicit LibVLC audio-device override remains")
          p.write_text(s)
          print("LibVLC now follows standalone test order without explicit audio-device overrides.")
          PY


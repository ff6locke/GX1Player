          elif "fun addExternalSubtitle(uri: Uri, select: Boolean = true)" not in e:
              raise SystemExit("LibVLC external subtitle API anchor missing")
          engine_path.write_text(e)

          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          field = "    private var mainVlcEngine: Gx1LibVlcEngine? = null"
          if "private val mainVlcAutoSubtitleFiles" not in s:
              if field not in s:
                  raise SystemExit("Main LibVLC engine field missing")
              s = s.replace(field, field + "\n    private val mainVlcAutoSubtitleFiles = mutableSetOf<String>()", 1)

          method = r'''    private fun autoLoadMainVlcSubtitles(engine: Gx1LibVlcEngine) {
                  val video = currentVideoFile() ?: return
                  val folder = video.parentFile?.takeIf { it.isDirectory } ?: return
                  val base = video.nameWithoutExtension
                  val extensions = setOf("ass", "ssa", "srt")
                  val matches = folder.listFiles()?.filter { file ->
                      if (!file.isFile || file.extension.lowercase(java.util.Locale.ROOT) !in extensions) {
                          false
                      } else {
                          val stem = file.name.substringBeforeLast('.', "")
                          stem.equals(base, ignoreCase = true) ||
                              stem.startsWith(base + ".", ignoreCase = true)
                      }
                  }?.sortedBy { it.name.lowercase(java.util.Locale.ROOT) }.orEmpty()

                  var loaded = 0
                  matches.forEachIndexed { index, file ->
                      if (mainVlcAutoSubtitleFiles.add(file.absolutePath)) {
                          val ok = runCatching {
                              engine.addExternalSubtitle(Uri.fromFile(file), select = index == 0)
                          }.getOrDefault(false)
                          if (ok) loaded++ else mainVlcAutoSubtitleFiles.remove(file.absolutePath)
                      }
                  }
                  if (loaded > 0) {
                      val firstExternal = matches.firstOrNull()
                      subtitleUiHandler.postDelayed({
                          val available = engine.subtitleTracks()
                          val firstTrack = firstExternal?.let { file ->
                              available.firstOrNull { track ->
                                  track.name.contains(file.name, ignoreCase = true) ||
                                      track.name.contains(file.nameWithoutExtension, ignoreCase = true)
                              }
                          } ?: available.lastOrNull()
                          firstTrack?.let { engine.selectSubtitleTrack(it.id) }
                      }, 500L)
                      Toast.makeText(this, "Found $loaded same-name subtitle(s)", Toast.LENGTH_SHORT).show()
                  }
              }

              '''
          if "private fun autoLoadMainVlcSubtitles(" not in s:
              anchor = "    private fun buildMediaItem(uri: Uri): MediaItem {"
              if anchor not in s:
                  raise SystemExit("MainActivity method insertion point missing")
              s = s.replace(anchor, method + anchor, 1)

          start = s.find("    private fun startMainLibVlc(uri: Uri) {")
          end = s.find("\n    private fun ", start + len("    private fun startMainLibVlc(uri: Uri) {"))
          if start < 0 or end < 0:

                                      android.provider.MediaStore.MediaColumns._ID + "=?",
                                      arrayOf(parts[1]), null
                                  )?.use { c -> if (c.moveToFirst()) c.getString(0) else null }
                              }.getOrNull()
                          }
                      }
                      "com.android.externalstorage.documents" -> {
                          val parts = documentId.split(":", limit = 2)
                          if (parts.size == 2) {
                              val root = if (parts[0].equals("primary", true))
                                  android.os.Environment.getExternalStorageDirectory()
                              else java.io.File("/storage/" + parts[0])
                              val candidate = java.io.File(root, parts[1])
                              if (candidate.exists()) return candidate.absolutePath
                          }
                      }
                  }
                  return null
              }
              private fun autoLoadMatchingSubtitles() {
                  val uri = mediaUri
                  if (uri == null) {
                      status.text = "External subtitles: video URI unavailable"
                      return
                  }
                  val path = resolveVideoPath(uri)
                  if (path.isNullOrBlank()) {
                      status.text = "External subtitles: cannot resolve video file path (" + uri.scheme + ")"
                      return
                  }
                  val video = java.io.File(path)
                  val folder = video.parentFile
                  if (folder == null || !folder.isDirectory) {
                      status.text = "External subtitles: video folder is not accessible"
                      return
                  }
                  val base = video.nameWithoutExtension
                  val extensions = setOf("ass", "ssa", "srt")
                  val matches = folder.listFiles()?.filter { file ->
                      if (!file.isFile || file.extension.lowercase(java.util.Locale.ROOT) !in extensions) {
                          false
                      } else {
                          val stem = file.name.substringBeforeLast('.', "")
                          stem.equals(base, ignoreCase = true) ||
                              stem.startsWith(base + ".", ignoreCase = true)
                      }
                  }?.sortedBy { it.name.lowercase(java.util.Locale.ROOT) }.orEmpty()
                  vlcSubtitles.clear()
                  var loaded = 0
                  matches.forEach { file ->
                      val before = vlcSubtitles.size
                      loadVlcSubtitle(1, file)
                      if (vlcSubtitles.size > before ||
                          vlcSubtitles.any { it.name.equals(file.name, ignoreCase = true) }) loaded++
                  }
                  status.text = if (matches.isEmpty()) {
                      "No matching external subtitles in " + folder.name
                  } else {
                      "External subtitles loaded: " + loaded + "/" + matches.size
                  }
              }
          """

                      mp.attachViews(video, null, false, false)
                      mp.setEventListener { event ->
                          Log.i("GX1-VLC", "LibVLC event type=${event.type}")
                          runOnUiThread {
                              when (event.type) {
                                  MediaPlayer.Event.Opening -> hint.text = "LibVLC: opening media…"
                                  MediaPlayer.Event.Playing -> hint.text = "LibVLC: playing"
                                  MediaPlayer.Event.Paused -> hint.text = "LibVLC: paused"
                                  MediaPlayer.Event.EndReached -> hint.text = "LibVLC: playback ended"
                                  MediaPlayer.Event.EncounteredError -> {
                                      hint.text = "LibVLC playback error — see GX1-VLC log"
                                      Log.e("GX1-VLC", "LibVLC EncounteredError for URI=$uri")

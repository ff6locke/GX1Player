                              }
                          }
                      }
                      engine = vlcEngine
                      vlcEngine.attach(video)
                      vlcEngine.open(uri, resumeAt, digitalOutput)
                      handler.post(ticker)
                  } catch (error: Exception) {
                      Toast.makeText(this, "VLC playback error: " + (error.message ?: "unknown"), Toast.LENGTH_LONG).show()
                      finish()
                  }
              }

              private fun showAudioTracks() {
                  val tracks = runCatching { engine?.audioTracks().orEmpty() }.getOrDefault(emptyList())
                  if (tracks.isEmpty()) {
                      Toast.makeText(this, "VLC has not exposed audio tracks yet. Wait for playback, then try again.", Toast.LENGTH_LONG).show()
                      return
                  }
                  val selected = engine?.selectedAudioTrackId() ?: -1
                  val labels = tracks.map { it.name + if (it.id == selected) "  ✓" else "" }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("VLC audio track")
                      .setItems(labels) { _, which ->
                          val ok = engine?.selectAudioTrack(tracks[which].id) == true
                          Toast.makeText(this, if (ok) "Audio track selected" else "VLC could not select this audio track", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Close", null)
                      .show()
              }

              private fun showSubtitleTracks() {
                  val tracks = runCatching { engine?.subtitleTracks().orEmpty() }.getOrDefault(emptyList())
                  val selected = engine?.selectedSubtitleTrackId() ?: -1
                  val labels = mutableListOf("Off")
                  labels.addAll(tracks.map { it.name + if (it.id == selected) "  ✓" else "" })
                  AlertDialog.Builder(this)
                      .setTitle("VLC embedded subtitles")
                      .setItems(labels.toTypedArray()) { _, which ->
                          val id = if (which == 0) -1 else tracks[which - 1].id
                          val ok = engine?.selectSubtitleTrack(id) == true
                          Toast.makeText(this, if (ok) "Subtitle selection updated" else "VLC could not select this subtitle", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Close", null)
                      .show()
              }

              override fun onStop() {
                  val active = engine
                  val uri = mediaUri
                  if (active != null && uri != null) {
                      val current = active.currentTimeMs()
                      val duration = active.durationMs()
                      val edit = prefs.edit()
                      if ((duration > 0L && current >= duration - 10000L) || current < 5000L) {
                          edit.remove("pos|" + uri.toString())
                      } else {
                          edit.putLong("pos|" + uri.toString(), current)
                      }
                      edit.apply()
                  }
                  handler.removeCallbacks(ticker)
                  engine?.release()
                  engine = null
                  super.onStop()
              }

              private fun formatTime(ms: Long): String {
                  val total = ms / 1000L
                  val hours = total / 3600L
                  val minutes = (total % 3600L) / 60L
                  val seconds = total % 60L
                  return if (hours > 0L) "%d:%02d:%02d".format(hours, minutes, seconds)
                      else "%02d:%02d".format(minutes, seconds)
              }
          }
          KOTLIN

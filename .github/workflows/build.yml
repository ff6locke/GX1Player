      - name: Route Android TV Left and Right keys to adaptive video seeking
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          class_anchor = "class MainActivity : AppCompatActivity() {"
          start = s.find(class_anchor)
          if start < 0:
              raise SystemExit("Could not locate MainActivity for D-pad seek handling")
          if "override fun dispatchKeyEvent(event: android.view.KeyEvent)" not in s[start:]:
              anchor = "    private fun startMainLibVlc(uri: Uri) {"
              if anchor not in s[start:]:
                  raise SystemExit("Could not locate main playback method for D-pad seek handling")
              handler = """    override fun dispatchKeyEvent(event: android.view.KeyEvent): Boolean {
                  if (event.keyCode == android.view.KeyEvent.KEYCODE_DPAD_LEFT ||
                      event.keyCode == android.view.KeyEvent.KEYCODE_DPAD_RIGHT) {
                      val engine = mainVlcEngine
                      if (engine != null && ::playerView.isInitialized) {
                          var focused = currentFocus
                          var focusInsidePlayerView = false
                          while (focused != null) {
                              if (focused === playerView) {
                                  focusInsidePlayerView = true
                                  break
                              }
                              focused = focused.parent as? android.view.View
                          }
                          val anotherUiHasFocus = currentFocus != null && !focusInsidePlayerView
                          if (playerView.isControllerFullyVisible() && focusInsidePlayerView) {
                              gx1PreviousFileButton?.let { previousFile ->
                                  if (previousFile.id != View.NO_ID) {
                                      previousFile.nextFocusLeftId = previousFile.id
                                  }
                              }
                              gx1NextFileButton?.let { nextFile ->
                                  if (nextFile.id != View.NO_ID) {
                                      nextFile.nextFocusRightId = nextFile.id
                                  }
                              }
                          }
                          if (playerView.isControllerFullyVisible() || anotherUiHasFocus) {
                              return super.dispatchKeyEvent(event)
                          }
                          if (event.action == android.view.KeyEvent.ACTION_DOWN &&
                              event.repeatCount > 0 && event.repeatCount % 4 != 0) {
                              return true
                          }
                          if (event.action == android.view.KeyEvent.ACTION_DOWN) {
                              val current = engine.currentTimeMs()
                              val step = if (gx1SeekSessionProgressMs < 5 * 60_000L) 10_000L else 60_000L
                              val target = if (event.keyCode == android.view.KeyEvent.KEYCODE_DPAD_LEFT) {
                                  (current - step).coerceAtLeast(0L)
                              } else {
                                  val next = current + step
                                  val duration = engine.durationMs()
                                  if (duration > 0L) next.coerceAtMost(duration) else next
                              }
                              engine.seekTo(target)
                              gx1SeekSessionProgressMs += step
                              mainVlcControllerClock?.seekTo(target)
                              val overlayRoot = playerView.parent as? android.widget.FrameLayout
                              if (overlayRoot != null) {
                                  var feedback = overlayRoot.findViewWithTag<android.widget.TextView>("gx1_seek_feedback")
                                  if (feedback == null) {
                                      feedback = android.widget.TextView(this).apply {
                                          tag = "gx1_seek_feedback"
                                          setTextColor(android.graphics.Color.WHITE)
                                          textSize = 24f
                                          typeface = android.graphics.Typeface.DEFAULT_BOLD
                                          gravity = android.view.Gravity.CENTER
                                          setPadding((22 * resources.displayMetrics.density).toInt(),
                                              (14 * resources.displayMetrics.density).toInt(),
                                              (22 * resources.displayMetrics.density).toInt(),
                                              (14 * resources.displayMetrics.density).toInt())
                                          background = android.graphics.drawable.GradientDrawable().apply {
                                              setColor(0xCC111111.toInt())
                                              cornerRadius = 14f * resources.displayMetrics.density
                                          }
                                          isFocusable = false
                                      }
                                      overlayRoot.addView(feedback, android.widget.FrameLayout.LayoutParams(
                                          android.widget.FrameLayout.LayoutParams.WRAP_CONTENT,
                                          android.widget.FrameLayout.LayoutParams.WRAP_CONTENT,
                                          android.view.Gravity.CENTER
                                      ))
                                  }
                                  fun seekClock(value: Long): String {
                                      val seconds = (value.coerceAtLeast(0L) / 1000L)
                                      val hours = seconds / 3600L
                                      val minutes = (seconds % 3600L) / 60L
                                      val secs = seconds % 60L
                                      return if (hours > 0L) String.format("%d:%02d:%02d", hours, minutes, secs)
                                          else String.format("%02d:%02d", minutes, secs)
                                  }
                                  val direction = if (event.keyCode == android.view.KeyEvent.KEYCODE_DPAD_LEFT) "⏪" else "⏩"
                                  val duration = engine.durationMs()
                                  feedback.text = "$direction  ${seekClock(target)} / ${seekClock(duration)}"
                                  feedback.visibility = View.VISIBLE
                                  feedback.bringToFront()
                              }
                          } else if (event.action == android.view.KeyEvent.ACTION_UP) {
                              gx1SeekSessionProgressMs = 0L
                              (playerView.parent as? android.widget.FrameLayout)
                                  ?.findViewWithTag<android.widget.TextView>("gx1_seek_feedback")
                                  ?.visibility = View.GONE
                          }
                          return true
                      }
                  }
                  return super.dispatchKeyEvent(event)
              }
          """
              pos = s.find(anchor, start)
              s = s[:pos] + handler + s[pos:]
          if "KEYCODE_DPAD_LEFT" not in s[start:] or "gx1SeekSessionProgressMs < 5 * 60_000L" not in s[start:] or "gx1SeekSessionProgressMs = 0L" not in s[start:]:
              raise SystemExit("D-pad adaptive seek verification failed")
          p.write_text(s)
          print("Android TV Left/Right use 10-second steps for the first 5 minutes of each seek session, then 1-minute steps; key-up resets the session.")
          PY

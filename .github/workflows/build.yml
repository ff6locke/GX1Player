      - name: Re-hide Media3 video content after attaching its controller
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()

          helper = '''    private fun hideMainVlcMedia3VideoContent() {
              if (!::playerView.isInitialized) return
              playerView.setBackgroundColor(Color.TRANSPARENT)
              playerView.findViewById<android.view.View>(
                  androidx.media3.ui.R.id.exo_content_frame
              )?.visibility = View.GONE
              playerView.findViewById<android.view.View>(
                  androidx.media3.ui.R.id.exo_shutter
              )?.visibility = View.GONE
              playerView.findViewById<android.view.View>(
                  androidx.media3.ui.R.id.exo_artwork
              )?.visibility = View.GONE

              // PlayerView can retain its own SurfaceView even after its content
              // frame is hidden. That empty Media3 surface can sit over the
              // independent LibVLC surface and leave audio playing over black.
              // Hide only video-surface children; keep the controller/menus intact.
              fun hideVideoSurfaces(group: android.view.ViewGroup) {
                  for (index in 0 until group.childCount) {
                      val child = group.getChildAt(index)
                      if (child is android.view.SurfaceView || child is android.view.TextureView) {
                          child.visibility = View.GONE
                      } else if (child is android.view.ViewGroup) {
                          hideVideoSurfaces(child)
                      }
                  }
              }
              hideVideoSurfaces(playerView)
          }

          '''
          anchor = "    private fun startMainLibVlc(uri: Uri) {"
          if "private fun hideMainVlcMedia3VideoContent()" not in s:
              if anchor not in s:
                  raise SystemExit("Main LibVLC startup method missing")
              s = s.replace(anchor, helper + anchor, 1)

          start = s.find(anchor)
          if start < 0:
              raise SystemExit("Could not locate main LibVLC startup method")
          import re
          next_method = re.search(r"(?m)^    (?:private\s+)?fun\s+", s[start + len(anchor):])
          if next_method is None:
              raise SystemExit("Could not locate the next method after main LibVLC startup")
          end = start + len(anchor) + next_method.start()
          block = s[start:end]

          nl = chr(10)
          block = block.replace(
              "playerView.player = controller",
              "playerView.player = controller" + nl + "                  hideMainVlcMedia3VideoContent()"
          )
          block = block.replace(
              "playerView.showController()",
              "playerView.showController()" + nl + "                  hideMainVlcMedia3VideoContent()"
          )
          if "hideMainVlcMedia3VideoContent()" not in block:
              raise SystemExit("Failed to add LibVLC overlay protection calls")
          s = s[:start] + block + s[end:]
          p.write_text(s)
          print("Kept Media3 controls visible and hid its video shutter above LibVLC.")
          PY


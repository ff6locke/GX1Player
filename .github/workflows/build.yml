          import androidx.appcompat.app.AppCompatActivity
          import org.videolan.libvlc.LibVLC
          import org.videolan.libvlc.Media
          import org.videolan.libvlc.MediaPlayer
          import org.videolan.libvlc.util.VLCVideoLayout
          /** Standalone LibVLC validation screen; the production Media3 screen is not replaced yet. */
          class VlcTestActivity : AppCompatActivity() {
              private var libVlc: LibVLC? = null
              private var player: MediaPlayer? = null
              private var video: VLCVideoLayout? = null
              private lateinit var status: TextView
              private lateinit var position: TextView
              private lateinit var seek: SeekBar
              private var dragging = false
              private var digitalOutput = true
              private val handler = Handler(Looper.getMainLooper())
              private val prefs by lazy { getSharedPreferences("gx1_player", MODE_PRIVATE) }
              private var mediaUri: Uri? = null
              private val ticker = object : Runnable {
                  override fun run() {
                      val mp = player
                      if (mp != null && !dragging) {
                          val duration = mp.length.coerceAtLeast(0L)
                          val current = mp.time.coerceAtLeast(0L)
                          seek.max = 1000
                          seek.progress = if (duration > 0) ((current * 1000L) / duration).toInt().coerceIn(0, 1000) else 0

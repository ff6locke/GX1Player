      - name: Add reusable LibVLC playback engine foundation
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app/src/main/java/com/example/gx1player/playback
          cat > app/src/main/java/com/example/gx1player/playback/Gx1LibVlcEngine.kt <<'EOF'
          package com.example.gx1player.playback

          import android.content.Context
          import android.content.res.AssetFileDescriptor
          import android.net.Uri
          import org.videolan.libvlc.LibVLC
          import org.videolan.libvlc.Media
          import org.videolan.libvlc.MediaPlayer
          import org.videolan.libvlc.util.VLCVideoLayout

          /** Owns the LibVLC instance, player and attached video surface. */
          class Gx1LibVlcEngine(
              context: Context,
              private val onStateChanged: (State) -> Unit = {}
          ) {
              data class State(
                  val playing: Boolean = false,
                  val opening: Boolean = false,
                  val ended: Boolean = false,
                  val error: String? = null,
                  val timeMs: Long = 0L,
                  val lengthMs: Long = 0L
              )

              // Match the audio output used by the successful standalone VLC Test:
              // Android AudioTrack, with LibVLC selecting the codec/HDMI passthrough path.
              // Keep this shared engine configuration identical for the upcoming main-player
              // integration so the two paths do not behave differently on the GX1.
              private val appContext = context.applicationContext
              private val libVlc = LibVLC(appContext, arrayListOf(
                  "-vvv",
                  "--no-video-title-show"
              ))
              private val mediaPlayer = MediaPlayer(libVlc)
              private var activeAssetDescriptor: AssetFileDescriptor? = null
              private var attachedLayout: VLCVideoLayout? = null
              private var released = false
              private var pendingSeekMs = 0L
              @Volatile private var durationHintMs = 0L
              @Volatile private var sourceGeneration = 0
              @Volatile private var reachedEnd = false
              private var activeUri: Uri? = null
              private var activeDigitalOutput = true

              init {
                  mediaPlayer.setEventListener { event ->
                      val voutInfo = runCatching {
                          mediaPlayer.javaClass.methods.firstOrNull {
                              it.name == "getVoutCount" || it.name == "getVout"
                          }?.invoke(mediaPlayer)?.toString() ?: "not-exposed"
                      }.getOrDefault("query-failed")
                      android.util.Log.i("GX1-VLC", "MAIN LibVLC event=${event.type}, vout=$voutInfo")
                      when (event.type) {
                          MediaPlayer.Event.Opening -> publish(opening = true, error = null)
                          MediaPlayer.Event.Playing -> {
                              reachedEnd = false
                              val seek = pendingSeekMs
                              pendingSeekMs = 0L
                              if (seek > 0L) mediaPlayer.setTime(seek)
                              publish(playing = true, opening = false, ended = false, error = null)
                          }
                          MediaPlayer.Event.Paused -> publish(playing = false)
                          MediaPlayer.Event.Stopped -> publish(playing = false, opening = false)
                          MediaPlayer.Event.EndReached -> {
                              reachedEnd = true
                              publish(playing = false, opening = false, ended = true)
                          }
                          MediaPlayer.Event.EncounteredError -> publish(
                              playing = false, opening = false,
                              error = "LibVLC encountered a playback error"
                          )
                          MediaPlayer.Event.TimeChanged,
                          MediaPlayer.Event.PositionChanged,
                          MediaPlayer.Event.LengthChanged -> publish()
                      }
                  }
              }

              fun attach(layout: VLCVideoLayout) {
                  checkActive()
                  android.util.Log.i("GX1-VLC", "MAIN attach: attached=${layout.isAttachedToWindow}, size=${layout.width}x${layout.height}, parent=${layout.parent?.javaClass?.simpleName}")
                  if (attachedLayout === layout) return
                  if (attachedLayout != null) runCatching { mediaPlayer.detachViews() }
                  mediaPlayer.attachViews(layout, null, true, false)
                  attachedLayout = layout
              }

              fun open(uri: Uri, startPositionMs: Long = 0L, digitalOutput: Boolean = true) {
                  checkActive()
                  activeUri = uri
                  activeDigitalOutput = digitalOutput
                  reachedEnd = false
                  require(uri.scheme in setOf("content", "file", "http", "https")) {
                      "Unsupported media URI scheme: ${uri.scheme}"
                  }
                  runCatching { mediaPlayer.stop() }
                  activeAssetDescriptor?.let { runCatching { it.close() } }
                  activeAssetDescriptor = null
                  pendingSeekMs = startPositionMs.coerceAtLeast(0L)
                  durationHintMs = 0L
                  val durationGeneration = ++sourceGeneration
                  mediaPlayer.setAudioDigitalOutputEnabled(digitalOutput)

                  // Match the known-working VLC test path first: pass the Android Uri
                  // directly to LibVLC. In particular, SAF content:// playback must use
                  // the same MRL path as the test player rather than forcing an
                  // AssetFileDescriptor for every provider.
                  val media = if (uri.scheme == "content") {
                      try {
                          Media(libVlc, uri).also {
                              android.util.Log.i("GX1-VLC", "Using direct content Uri source")
                          }
                      } catch (uriError: Exception) {
                          android.util.Log.w(
                              "GX1-VLC",
                              "Direct content Uri open failed; falling back to AssetFileDescriptor",
                              uriError
                          )
                          val afd = appContext.contentResolver.openAssetFileDescriptor(uri, "r")
                              ?: throw java.io.IOException("Could not open selected media provider descriptor")
                          activeAssetDescriptor = afd
                          Media(libVlc, afd)
                      }
                  } else {
                      Media(libVlc, uri)
                  }
                  try {
                      mediaPlayer.media = media
                  } catch (error: Exception) {
                      activeAssetDescriptor?.let { runCatching { it.close() } }
                      activeAssetDescriptor = null
                      media.release()
                      throw error
                  }
                  media.release()
                  android.util.Log.i("GX1-VLC", "Opened media using ${uri.scheme} source; digitalOutput=$digitalOutput")
                  mediaPlayer.play()
                  publish(opening = true, error = null)
                  // Only transport-stream files need the Android metadata fallback.
                  // Running MediaMetadataRetriever against large MKV/MP4 files can scan
                  // substantial media data during first playback and compete with LibVLC
                  // for storage I/O. Let LibVLC provide duration for normal containers.
                  if (uri.lastPathSegment?.substringAfterLast('.', "")?.lowercase() == "ts") {
                      Thread({
                          val retriever = android.media.MediaMetadataRetriever()
                          val extracted = try {
                              retriever.setDataSource(appContext, uri)
                              retriever.extractMetadata(android.media.MediaMetadataRetriever.METADATA_KEY_DURATION)
                                  ?.toLongOrNull() ?: 0L
                          } catch (_: Exception) {
                              0L
                          } finally {
                              runCatching { retriever.release() }
                          }
                          if (durationGeneration == sourceGeneration && extracted > 0L) {
                              durationHintMs = extracted
                              publish()
                          }
                      }, "gx1-duration-probe").apply {
                          isDaemon = true
                          start()
                      }
                  }
              }

              fun play() {
                  checkActive()
                  if (reachedEnd) {
                      // LibVLC does not reliably restart a MediaPlayer after EndReached.
                      // Reopen the same source at zero so the Play button works without
                      // requiring the user to switch files or reopen the video.
                      val uri = activeUri
                      if (uri != null) open(uri, 0L, activeDigitalOutput)
                      else mediaPlayer.play()
                  } else if (!mediaPlayer.isPlaying) {
                      mediaPlayer.play()
                  }
              }
              fun pause() { checkActive(); if (mediaPlayer.isPlaying) mediaPlayer.pause() }
              fun togglePlayback() { checkActive(); if (mediaPlayer.isPlaying) pause() else play() }
              fun seekTo(positionMs: Long) { checkActive(); mediaPlayer.setTime(positionMs.coerceAtLeast(0L)) }
              fun setRate(rate: Float) { checkActive(); mediaPlayer.setRate(rate.coerceIn(0.25f, 4.0f)) }
              fun currentTimeMs(): Long = if (released) 0L else mediaPlayer.time.coerceAtLeast(0L)
              fun durationMs(): Long = if (released) 0L else
                  mediaPlayer.length.takeIf { it > 0L } ?: durationHintMs
              fun isPlaying(): Boolean = !released && mediaPlayer.isPlaying

              private fun checkActive() { check(!released) { "LibVLC engine has been released" } }

              private fun publish(
                  playing: Boolean = mediaPlayer.isPlaying,
                  opening: Boolean = false,
                  ended: Boolean = false,
                  error: String? = null
              ) {
                  if (released) return
                  onStateChanged(State(
                      playing = playing,
                      opening = opening,
                      ended = ended,
                      error = error,
                      timeMs = mediaPlayer.time.coerceAtLeast(0L),
                      lengthMs = durationMs()
                  ))
              }

              fun release() {
                  if (released) return
                  released = true
                  runCatching { mediaPlayer.stop() }
                  runCatching { mediaPlayer.setEventListener(null) }
                  runCatching { mediaPlayer.detachViews() }
                  attachedLayout = null
                  mediaPlayer.release()
                  activeAssetDescriptor?.let { runCatching { it.close() } }
                  activeAssetDescriptor = null
                  libVlc.release()
              }
          }
          EOF
          echo "Added reusable LibVLC engine core; existing Media3 UI remains unchanged pending integration."

      - name: Add LibVLC embedded track inventory and selection API
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/playback/Gx1LibVlcEngine.kt")
          s = p.read_text()
          if "data class Track(" not in s:
              marker = "    private fun checkActive() {"
              if marker not in s:
                  raise SystemExit("Could not locate LibVLC engine API insertion point")
              api = '''    data class Track(val id: Int, val name: String)

              /** Returns the embedded audio tracks currently exposed by LibVLC. */
              fun audioTracks(): List<Track> {
                  checkActive()
                  return mediaPlayer.getAudioTracks()?.map { Track(it.id, it.name ?: "Unknown audio") } ?: emptyList()
              }

              fun selectedAudioTrackId(): Int {
                  checkActive()
                  return mediaPlayer.getAudioTrack()
              }

              fun selectAudioTrack(id: Int): Boolean {
                  checkActive()
                  return mediaPlayer.setAudioTrack(id)
              }

              /** Returns embedded subtitle (SPU) tracks currently exposed by LibVLC. */
              fun subtitleTracks(): List<Track> {
                  checkActive()
                  return mediaPlayer.getSpuTracks()?.map { Track(it.id, it.name ?: "Unknown subtitle") } ?: emptyList()
              }

              fun selectedSubtitleTrackId(): Int {
                  checkActive()
                  return mediaPlayer.getSpuTrack()
              }

              fun selectSubtitleTrack(id: Int): Boolean {
                  checkActive()
                  return mediaPlayer.setSpuTrack(id)
              }

          '''
              s = s.replace(marker, api + marker, 1)
          required = ["fun audioTracks()", "fun selectAudioTrack(id: Int)", "fun subtitleTracks()", "fun selectSubtitleTrack(id: Int)"]
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit("LibVLC track API verification failed: " + ", ".join(missing))
          p.write_text(s)
          print("Added LibVLC embedded audio/SPU track listing and selection methods.")
          PY
      - name: Upgrade LibVLC test player with transport and resume controls
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > app/src/main/java/com/example/gx1player/VlcTestActivity.kt <<'EOF'
          package com.example.gx1player

          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import org.videolan.libvlc.LibVLC
          import org.videolan.libvlc.Media
          import org.videolan.libvlc.MediaPlayer
          import org.videolan.libvlc.util.VLCVideoLayout

          /** Standalone LibVLC validation screen; the production Media3 screen is not replaced yet. */
          class VlcTestActivity : AppCompatActivity() {
              private var libVlc: LibVLC? = null
              private var player: MediaPlayer? = null
              private var video: VLCVideoLayout? = null
              private lateinit var status: TextView
              private lateinit var position: TextView
              private lateinit var seek: SeekBar
              private var dragging = false
              private var digitalOutput = true
              private val handler = Handler(Looper.getMainLooper())
              private val prefs by lazy { getSharedPreferences("gx1_player", MODE_PRIVATE) }
              private var mediaUri: Uri? = null

              private val ticker = object : Runnable {
                  override fun run() {
                      val mp = player
                      if (mp != null && !dragging) {
                          val duration = mp.length.coerceAtLeast(0L)
                          val current = mp.time.coerceAtLeast(0L)
                          seek.max = 1000
                          seek.progress = if (duration > 0) ((current * 1000L) / duration).toInt().coerceIn(0, 1000) else 0
                          position.text = formatTime(current) + " / " + formatTime(duration)
                      }
                      handler.postDelayed(this, 500L)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY)
                  val uri = intent.data ?: run {
                      Toast.makeText(this, "No video selected for LibVLC", Toast.LENGTH_LONG).show()
                      finish()
                      return
                  }
                  mediaUri = uri
                  val resumeAt = prefs.getLong("pos|" + uri.toString(), 0L)
                  val root = FrameLayout(this).apply { setBackgroundColor(android.graphics.Color.BLACK) }
                  val videoView = VLCVideoLayout(this)
                  video = videoView
                  root.addView(videoView, FrameLayout.LayoutParams(-1, -1))
                  val controls = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(16, 10, 16, 10)
                      setBackgroundColor(0x99000000.toInt())
                  }
                  status = TextView(this).apply {
                      text = "LibVLC playback test"
                      setTextColor(-1)
                      textSize = 14f
                  }
                  position = TextView(this).apply {
                      text = "00:00 / 00:00"
                      setTextColor(-1)
                      textSize = 13f
                  }
                  seek = SeekBar(this).apply {
                      isFocusable = true
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onStartTrackingTouch(bar: SeekBar?) { dragging = true }
                          override fun onStopTrackingTouch(bar: SeekBar?) {
                              val mp = player
                              if (mp != null && mp.length > 0L) mp.time = (mp.length * seek.progress / 1000L)
                              dragging = false
                          }
                          override fun onProgressChanged(bar: SeekBar?, progress: Int, fromUser: Boolean) {}
                      })
                  }
                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER }
                  val playButton = Button(this).apply {
                      text = "Pause"
                      setOnClickListener {
                          val mp = player ?: return@setOnClickListener
                          if (mp.isPlaying) { mp.pause(); text = "Play" }
                          else { mp.play(); text = "Pause" }
                      }
                  }
                  val outputButton = Button(this).apply {
                      text = "Digital output: ON"
                      setOnClickListener {
                          digitalOutput = !digitalOutput
                          val ok = player?.setAudioDigitalOutputEnabled(digitalOutput) ?: false
                          text = "Digital output: " + if (digitalOutput) "ON" else "OFF"
                          status.text = "Digital output " + if (ok) "updated" else "setting not accepted"
                      }
                  }
                  val closeButton = Button(this).apply {
                      text = "Back"
                      setOnClickListener { finish() }
                  }
                  row.addView(playButton, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(outputButton, LinearLayout.LayoutParams(0, -2, 1.4f))
                  row.addView(closeButton, LinearLayout.LayoutParams(0, -2, 1f))
                  controls.addView(status)
                  controls.addView(position)
                  controls.addView(seek)
                  controls.addView(row)
                  root.addView(controls, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM))
                  setContentView(root)

                  try {
                      val vlc = LibVLC(this, arrayListOf("--no-video-title-show"))
                      libVlc = vlc
                      val mp = MediaPlayer(vlc)
                      player = mp
                      mp.attachViews(videoView, null, false, false)
                      mp.setAudioDigitalOutputEnabled(digitalOutput)
                      var resumeApplied = false
                      mp.setEventListener { event ->
                          if (event.type == MediaPlayer.Event.Playing && resumeAt > 0L && !resumeApplied) {
                              resumeApplied = true
                              mp.time = resumeAt
                          }
                          runOnUiThread {
                              when (event.type) {
                                  MediaPlayer.Event.Opening -> status.text = "LibVLC opening media…"
                                  MediaPlayer.Event.Playing -> status.text =
                                      if (resumeApplied) "LibVLC playing — resume restored" else "LibVLC playing"
                                  MediaPlayer.Event.Paused -> status.text = "Paused"
                                  MediaPlayer.Event.EndReached -> status.text = "Playback ended"
                                  MediaPlayer.Event.EncounteredError -> status.text = "LibVLC playback error"
                              }
                          }
                      }
                      val media = Media(vlc, uri)
                      try { mp.media = media } finally { runCatching { media.javaClass.getMethod("release").invoke(media) } }
                      mp.play()
                      handler.post(ticker)
                  } catch (e: Exception) {
                      Toast.makeText(this, "LibVLC error: " + (e.message ?: "unknown"), Toast.LENGTH_LONG).show()
                      finish()
                  }
              }

              override fun onStop() {
                  val mp = player
                  val uri = mediaUri
                  if (mp != null && uri != null) {
                      val current = mp.time.coerceAtLeast(0L)
                      val duration = mp.length
                      val edit = prefs.edit()
                      if (duration > 0L && current >= duration - 10000L || current < 5000L) {
                          edit.remove("pos|" + uri.toString())
                      } else {
                          edit.putLong("pos|" + uri.toString(), current)
                      }
                      edit.apply()
                  }
                  handler.removeCallbacks(ticker)
                  player?.let {
                      runCatching { it.stop() }
                      runCatching { it.setEventListener(null) }
                      runCatching { it.detachViews() }
                      runCatching { it.release() }
                  }
                  player = null
                  libVlc?.release()
                  libVlc = null
                  video = null
                  super.onStop()
              }

              private fun formatTime(ms: Long): String {
                  val total = ms / 1000L
                  val h = total / 3600L
                  val m = (total % 3600L) / 60L
                  val s = total % 60L
                  return if (h > 0L) "%d:%02d:%02d".format(h, m, s) else "%02d:%02d".format(m, s)
              }
          }
          EOF
      - name: Repair playback history persistence and home history list
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          if "KEY_HISTORY_PREFIX" not in s:
              raise SystemExit("History key constant is missing; refusing to create a disconnected history store")

          recorder = """    private fun recordPlaybackHistory(uri: Uri) {
                  val key = KEY_HISTORY_PREFIX + uri.toString()
                  prefs.edit()
                      .putString(KEY_LAST_URI, uri.toString())
                      .putLong(key, System.currentTimeMillis())
                      .apply()
              }

          """
          if "private fun recordPlaybackHistory(uri: Uri)" not in s:
              anchor = "    private fun selectMedia(uri: Uri) {"
              if anchor not in s:
                  raise SystemExit("Could not find selectMedia() for history repair")
              s = s.replace(anchor, recorder + anchor, 1)

          pattern = r"(    private fun selectMedia\(uri: Uri\) \{)(.*?)(\n    \})"
          m = re.search(pattern, s, re.S)
          if not m:
              raise SystemExit("Could not parse selectMedia()")
          body = m.group(2)
          body = re.sub(r"^\s*recordPlaybackHistory\(uri\)\s*$", "", body, flags=re.M)
          body = re.sub(r"^\s*prefs\.edit\(\)\.putString\(KEY_LAST_URI, uri\.toString\(\)\).*?$", "", body, flags=re.M)
          body = re.sub(r"^\s*prefs\.edit\(\)\.putString\(KEY_LAST_URI, uri\.toString\(\)\)\.putLong\(KEY_HISTORY_PREFIX.*?$", "", body, flags=re.M)
          if "mediaUri = uri" not in body:
              raise SystemExit("selectMedia() no longer assigns mediaUri")
          body = body.replace("mediaUri = uri", "mediaUri = uri\n        recordPlaybackHistory(uri)", 1)
          s = s[:m.start(2)] + body + s[m.end(2):]

          # Also record when playback is started through any route that bypasses selectMedia().
          start = re.search(r"    private fun startPlayer\s*\([^)]*\)\s*\{", s)
          if start:
              after = start.end()
              if "recordPlaybackHistory" not in s[after:after+350]:
                  s = s[:after] + "\n        mediaUri?.let { recordPlaybackHistory(it) }" + s[after:]

          # Keep the existing showHistory() implementation intact. Its earlier
          # regex-based replacement was brittle because the method body contains
          # nested Kotlin lambdas and braces. The recording fix above is independent.

          p.write_text(s)
          print("History now records both media selection and player start; home History list includes saved entries and last-played fallback.")
          PY

      - name: Upgrade LibVLC player controls and embedded track selection
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > app/src/main/java/com/example/gx1player/VlcTestActivity.kt <<'KOTLIN'
          package com.example.gx1player

          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper

          PY
      - name: Capture LibVLC native startup log in Audio diagnostics
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          source = p.read_text()
          title = source.find('.setTitle("Audio diagnostics")')
          if title < 0:
              raise SystemExit("Audio diagnostics title not found")
          if "LibVLC native log (this app process)" not in source:
              builder_pos = source.rfind("AlertDialog.Builder(this)", 0, title)
              if builder_pos < 0:
                  raise SystemExit("Audio diagnostics builder not found before title")
              line_start = source.rfind(chr(10), 0, builder_pos) + 1
              indent = source[line_start:builder_pos]
              patch = """lines.add("")
          lines.add("LibVLC native log (this app process)")
          val nativeLog = runCatching {
              val command = arrayOf("logcat", "-d", "-v", "time",
                  "--pid=" + android.os.Process.myPid().toString(), "*:V")
              val process = Runtime.getRuntime().exec(command)
              val output = process.inputStream.bufferedReader().use { it.readText() }
              process.waitFor()
              output.lineSequence()
                  .filter { line ->
                      val lower = line.lowercase()
                      listOf("vlc", "libvlc", "vout", "decoder", "avcodec",
                          "mediacodec", "video output", "surface", "gx1_first_play_timing")
                          .any { lower.contains(it) }
                  }
                  .toList().takeLast(80).joinToString("\\n")
          }.getOrElse { "Could not read app logcat: " + (it.message ?: it.javaClass.simpleName) }
          lines.add(if (nativeLog.isBlank()) "  No matching native log lines captured" else nativeLog)
          """
              patch = "".join(indent + line if line.strip() else line
                              for line in patch.splitlines(keepends=True))
              source = source[:builder_pos] + patch + source[builder_pos:]
          if 'setNeutralButton("Share log")' not in source:
              title = source.find('.setTitle("Audio diagnostics")')
              button = re.search(r'(?m)^(\s*)\.setPositiveButton\(', source[title:])
              if not button:
                  raise SystemExit("Could not locate Audio diagnostics positive button")
              pos = title + button.start()
              indent = button.group(1)
              share = indent + """.setNeutralButton("Share log") { _, _ ->
          """ + indent + """    val shareIntent = android.content.Intent(android.content.Intent.ACTION_SEND).apply {
          """ + indent + """        type = "text/plain"
          """ + indent + """        putExtra(android.content.Intent.EXTRA_SUBJECT, "GX1Player Audio diagnostics")
          """ + indent + """        putExtra(android.content.Intent.EXTRA_TEXT, lines.joinToString("\\n"))
          """ + indent + """    }
          """ + indent + """    startActivity(android.content.Intent.createChooser(shareIntent, "Export diagnostics"))
          """ + indent + """}
          """
              source = source[:pos] + share + source[pos:]
          p.write_text(source)
          print("Added native LibVLC log capture and Share log action.")
          PY
      - name: Verify and export final post-instrumentation source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          ENGINE=app/src/main/java/com/example/gx1player/playback/Gx1LibVlcEngine.kt
          ACTIVITY=app/src/main/java/com/example/gx1player/MainActivity.kt
          echo "=== Event trace engine declarations and reset ==="
          grep -n -E 'libVlcEventTrace|openStartedAtMs|MAIN LibVLC event' "$ENGINE"
          echo "=== Diagnostics display line ==="
          grep -n -E 'LibVLC event timeline|Buffering percentage timeline' "$ENGINE"
          grep -q 'libVlcEventTrace' "$ENGINE"
          grep -q 'LibVLC event timeline' "$ENGINE"
          mkdir -p ../gx1-final-source-review
          cp "$ENGINE" ../gx1-final-source-review/Gx1LibVlcEngine.kt
          cp "$ACTIVITY" ../gx1-final-source-review/MainActivity.kt
          cd ..
          zip -qr gx1-final-source-review.zip gx1-final-source-review
      - name: Upload final post-instrumentation source review
        uses: actions/upload-artifact@v4
        with:
          name: gx1-final-source-review
          path: gx1-final-source-review.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build separate 32-bit and 64-bit ARM APKs
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [ "$BUILD_KIND" = "release" ]; then
            TASK=":app:assembleRelease"
          else
            TASK=":app:assembleDebug"
          fi
          APK_DIR="app/build/outputs/apk/${BUILD_KIND}"
          for ABI in armeabi-v7a arm64-v8a; do
            echo "===== Building $ABI ====="
            python3 - "$ABI" <<'PY'
          from pathlib import Path
          import re, sys
          abi = sys.argv[1]
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          # Remove all previous ABI filters, including the old one-line and multiline patches.
          s = re.sub(r'(?m)^\s*ndk\s*\{\s*abiFilters\s*\+=\s*setOf\([^\n]*\)\s*\}\s*\n?', '', s)
          s = re.sub(r'(?m)^\s*abiFilters\s*\+=\s*setOf\([^\n]*\)\s*\n?', '', s)
          marker = "    defaultConfig {"
          if marker not in s:
              raise SystemExit("Could not find defaultConfig")
          block = f'    defaultConfig {{\n        ndk {{ abiFilters += setOf("{abi}") }}'
          s = s.replace(marker, block, 1)
          p.write_text(s)
          print(f"Configured exactly one ABI: {abi}")
          PY
            rm -rf "$APK_DIR"
            ./gradlew "$TASK" --no-daemon --stacktrace
            mapfile -t APK_FILES < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | sort)
            if [ "${#APK_FILES[@]}" -ne 1 ]; then
              echo "Expected one APK for $ABI; found ${#APK_FILES[@]}"
              printf '%s\\n' "${APK_FILES[@]}"
              exit 1
            fi
            if [ "$ABI" = "armeabi-v7a" ]; then
              cp "${APK_FILES[0]}" "$GITHUB_WORKSPACE/GX1Player-VLC-32bit.apk"
            else
              cp "${APK_FILES[0]}" "$GITHUB_WORKSPACE/GX1Player-VLC-64bit.apk"
            fi
          done
          ls -lh "$GITHUB_WORKSPACE"/GX1Player-VLC-*.apk

      - name: Verify APK architectures
        run: |
          set -e
          for APK in GX1Player-VLC-32bit.apk GX1Player-VLC-64bit.apk; do
            test -s "$APK"
            echo "===== $APK ====="
            unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|arm64-v8a)/.*libvlc(jni)?[.]so'
          done
          unzip -l GX1Player-VLC-32bit.apk | grep -q 'lib/armeabi-v7a/libvlc.so'
          if unzip -l GX1Player-VLC-32bit.apk | grep -q 'lib/arm64-v8a/libvlc.so'; then
            echo "32-bit APK unexpectedly contains ARM64 libraries"
            exit 1
          fi
          unzip -l GX1Player-VLC-64bit.apk | grep -q 'lib/arm64-v8a/libvlc.so'
          if unzip -l GX1Player-VLC-64bit.apk | grep -q 'lib/armeabi-v7a/libvlc.so'; then
            echo "64-bit APK unexpectedly contains ARMv7 libraries"
            exit 1
          fi

      - name: Upload 32-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: gx1-player-VLC-32bit-b${{ github.run_number }}
          path: GX1Player-VLC-32bit.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload 64-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: gx1-player-VLC-64bit-b${{ github.run_number }}
          path: GX1Player-VLC-64bit.apk
          if-no-files-found: error
          retention-days: 30

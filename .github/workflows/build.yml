          )
          old = """return mediaPlayer.getAudioTracks()?.map { Track(it.id, it.name ?: "Unknown audio") } ?: emptyList()"""
          new = """val descriptions = mediaPlayer.getAudioTracks()?.toList().orEmpty()
                  val media = mediaPlayer.media
                  val metadata = mutableMapOf<Int, Any>()
                  if (media != null) {
                      for (index in 0 until media.trackCount) {
                          val item = media.getTrack(index)
                          if (item != null && item.javaClass.simpleName.contains("AudioTrack")) metadata[item.id] = item
                      }
                  }
                  return descriptions.map { item ->
                      val info = metadata[item.id]
                  fun read(name: String): Any? = info?.let { track ->
                          var type: Class<*>? = track.javaClass
                          while (type != null) {
                              val value = runCatching { type.getDeclaredField(name).apply { isAccessible = true }.get(track) }.getOrNull()
                              if (value != null) return@let value
                              type = type.superclass
                          }
                          null
                      }
                      Track(
                          id = item.id,
                          name = item.name ?: "",
                          codec = read("codec")?.toString() ?: "",
                          channels = (read("channels") as? Number)?.toInt() ?: 0,
                          language = read("language")?.toString() ?: "",
                          description = read("description")?.toString() ?: "",
                          bitrate = (read("bitrate") as? Number)?.toInt() ?: 0,
                          sampleRate = (read("rate") as? Number)?.toInt() ?: 0
                      )
                  }"""
          if old in s:
              s = s.replace(old, new, 1)
          elif "val metadata = mutableMapOf<Int, Media.AudioTrack>()" not in s:
              raise SystemExit("Could not locate LibVLC audio track mapping")
          p.write_text(s)
          a = Path("app/src/main/java/com/example/gx1player/VlcTestActivity.kt")
          t = a.read_text()
          old_label = 'val labels = tracks.map { it.name + if (it.id == selected) "  ✓" else "" }.toTypedArray()'
          new_label = """val labels = tracks.mapIndexed { index, track ->
                      val codec = track.codec.lowercase()
                      val details = track.description.lowercase()
                      val format = when {
                          details.contains("atmos") || details.contains("joc") || codec.contains("joc") -> "Dolby Atmos"
                          codec.contains("truehd") || codec.contains("mlp") -> "Dolby TrueHD"
                          codec.contains("eac3") || codec.contains("ec-3") -> "Dolby Digital Plus"
                          codec.contains("ac3") || codec.contains("ac-3") -> "Dolby Digital"
                          codec.contains("dts") -> if (details.contains("master audio") || codec.contains("hd")) "DTS-HD Master Audio" else "DTS"
                          codec.contains("aac") || codec.contains("mp4a") -> "AAC"
                          codec.contains("flac") -> "FLAC"
                          codec.contains("opus") -> "Opus"
                          codec.contains("mp3") || codec.contains("mpga") -> "MP3"
                          codec.isNotBlank() -> codec.uppercase()
                          else -> ""
                      }
                      val channels = when (track.channels) {
                          8 -> "7.1"
                          6 -> "5.1"
                          3 -> "2.1"
                          2 -> "Stereo"
                          1 -> "Mono"
                          else -> if (track.channels > 0) "${track.channels}ch" else ""
                      }
                      val language = track.language.takeIf { it.isNotBlank() && it != "und" }?.let { code ->
                          val locale = java.util.Locale.forLanguageTag(code)
                          locale.getDisplayLanguage(java.util.Locale.ENGLISH).takeIf { it.isNotBlank() && it != code } ?: code
                      }
                      val title = track.description.takeIf { it.isNotBlank() && !it.equals(track.language, true) }
                      val sampleRate = if (track.sampleRate > 0) ((track.sampleRate / 10.0).toInt() / 100.0).toString() + " kHz" else ""
                      val parts = listOfNotNull(title, format.takeIf { it.isNotBlank() }, language, channels.takeIf { it.isNotBlank() }, sampleRate.takeIf { it.isNotBlank() })
                      val fallback = track.name.takeIf { it.isNotBlank() && !it.matches(Regex("(?i)track *[0-9]+")) }
                      (if (parts.isNotEmpty()) parts.joinToString(" · ") else fallback ?: "Audio ${index + 1}") +
                          if (track.id == selected) "  ✓" else ""
                  }.toTypedArray()"""
          if old_label in t:

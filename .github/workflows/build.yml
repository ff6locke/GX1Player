      - name: Add selectable LibVLC video output modes for HDR testing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/example/gx1player/playback/Gx1LibVlcEngine.kt")
          s = p.read_text()
          pattern = r'LibVLC\(appContext,\s*arrayListOf\((.*?)\)\)'
          def add_output_selector(m):
              args = m.group(1)
              return '''LibVLC(appContext, arrayListOf(''' + args + ''').apply {
                  when (appContext.getSharedPreferences("gx1_player", Context.MODE_PRIVATE)
                      .getString("vlc_video_output", "auto")) {
                      "opengl" -> add("--vout=gles2,none")
                      "auto", "android" -> add("--vout=android_display,none")
                  }
              })'''
          if 'getString("vlc_video_output", "auto")' not in s:
              s, count = re.subn(pattern, add_output_selector, s, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit("Could not match LibVLC constructor in generated engine")
          p.write_text(s)
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          if 'Triple("▣", "VLC Video Output", "video_output")' not in s:
              s, count = re.subn(
                  r'(?m)^(\s*)Triple\("▤", "Aspect Ratio", "aspect"\),',
                  r'\1Triple("▤", "Aspect Ratio", "aspect"),\n\1Triple("▣", "VLC Video Output", "video_output"),',
                  s, count=1)
              if count != 1:
                  raise SystemExit("Could not locate Aspect Ratio menu row")
          if '"video_output" -> {' not in s:
              action = '''"video_output" -> {
                                  val labels = arrayOf("Automatic (recommended)", "OpenGL (gles2)", "Android display")
                                  val values = arrayOf("auto", "opengl", "android")
                                  val current = prefs.getString("vlc_video_output", "auto")
                                  AlertDialog.Builder(this)
                                      .setTitle("VLC Video Output")
                                      .setSingleChoiceItems(labels, values.indexOf(current).coerceAtLeast(0)) { dialog, which ->
                                          val selected = values[which]
                                          prefs.edit().putString("vlc_video_output", selected).apply()
                                          dialog.dismiss()
                                          val uri = playingUri ?: mediaUri
                                          if (uri != null && mainVlcSelected) {
                                              val position = mainVlcEngine?.currentTimeMs() ?: player?.currentPosition ?: 0L
                                              prefs.edit().putLong(posKey(uri), position).apply()
                                              releasePlayer()
                                              startPlayer()
                                          } else {
                                              Toast.makeText(this, "Video output saved; it will apply on next playback.", Toast.LENGTH_LONG).show()
                                          }
                                      }
                                      .setNegativeButton("Cancel", null)
                                      .show()
                              }
                  '''
              s, count = re.subn(r'(?m)^(\s*)"sleep" -> \{', lambda m: m.group(1) + action + '\n' + m.group(1) + '"sleep" -> {', s, count=1)
              if count != 1:
                  raise SystemExit("Could not locate Sleep Timer menu action")
          p.write_text(s)
          engine = Path("app/src/main/java/com/example/gx1player/playback/Gx1LibVlcEngine.kt").read_text()
          activity = Path("app/src/main/java/com/example/gx1player/MainActivity.kt").read_text()
          if 'getString("vlc_video_output", "auto")' not in engine:
              raise SystemExit("Video output preference verification failed in LibVLC engine")
          if 'Triple("▣", "VLC Video Output", "video_output")' not in activity:
              raise SystemExit("Video output menu row verification failed in MainActivity")
          print("Added selectable LibVLC video output modes.")
          PY
      - name: Instrument first-play startup timing

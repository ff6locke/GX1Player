      - name: Persist and restore selected LibVLC tracks across player restarts
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          helper = r'''    private fun mainVlcTrackStateKey(): String {
                  val uri = playingUri ?: mediaUri ?: return "gx1_tracks_none"
                  val value = if (uri.scheme == "file") {
                      runCatching { uri.path?.let { java.io.File(it).canonicalPath } }.getOrNull()
                          ?: uri.normalizeScheme().toString()
                  } else uri.normalizeScheme().toString()
                  val encoded = android.util.Base64.encodeToString(
                      value.toByteArray(Charsets.UTF_8),
                      android.util.Base64.URL_SAFE or android.util.Base64.NO_WRAP or android.util.Base64.NO_PADDING
                  )
                  return "gx1_tracks_" + encoded
              }
              private fun saveMainVlcTrackState() {
                  val engine = mainVlcEngine ?: return
                  val key = mainVlcTrackStateKey()
                  val enabled = mainVlcExternalSubtitles.filter { it.enabled }
                      .map { it.file.absolutePath }.toSet()
                  val audioTracks = runCatching { engine.audioTracks() }.getOrDefault(emptyList())
                  val audioId = runCatching { engine.selectedAudioTrackId() }.getOrDefault(Int.MIN_VALUE)
                  val audioIndex = audioTracks.indexOfFirst { it.id == audioId }
                  val embeddedTracks = runCatching { engine.subtitleTracks() }.getOrDefault(emptyList())
                  val subtitleId = runCatching { engine.selectedSubtitleTrackId() }.getOrDefault(Int.MIN_VALUE)
                  val subtitleIndex = embeddedTracks.indexOfFirst { it.id == subtitleId }
                  val prefs = getSharedPreferences("gx1_player", android.content.Context.MODE_PRIVATE)
                  prefs.edit()
                      .putStringSet(key + "_external_enabled", enabled)
                      .putInt(key + "_embedded_subtitle", subtitleId)
                      .putString(key + "_embedded_subtitle_name", embeddedTracks.getOrNull(subtitleIndex)?.name)
                      .putInt(key + "_embedded_subtitle_index", subtitleIndex)
                      .putInt(key + "_audio", audioId)
                      .putString(key + "_audio_name", audioTracks.getOrNull(audioIndex)?.name)
                      .putInt(key + "_audio_index", audioIndex)
                      .apply()
                  android.util.Log.i("GX1Player", "Saved per-video track state key=" + key +
                      " audio=" + audioId + " subtitle=" + subtitleId + " external=" + enabled.size)
              }
              private fun restoreMainVlcAudioTrack(attempt: Int = 0) {
                  val engine = mainVlcEngine ?: return
                  val key = mainVlcTrackStateKey()
                  val prefs = getSharedPreferences("gx1_player", android.content.Context.MODE_PRIVATE)
                  val saved = prefs.getInt(key + "_audio", Int.MIN_VALUE)
                  val name = prefs.getString(key + "_audio_name", null)
                  val index = prefs.getInt(key + "_audio_index", -1)
                  if (saved == Int.MIN_VALUE && name.isNullOrBlank() && index < 0) return
                  val tracks = runCatching { engine.audioTracks() }.getOrDefault(emptyList())
                  if (tracks.isEmpty()) {
                      if (attempt < 20) subtitleUiHandler.postDelayed({ restoreMainVlcAudioTrack(attempt + 1) }, 500L)
                      else android.util.Log.w("GX1Player", "Audio tracks did not become available for restoration")
                      return
                  }
                  val byId = tracks.firstOrNull { it.id == saved }
                  val byName = tracks.firstOrNull { !name.isNullOrBlank() && it.name == name }
                  val exact = byId?.takeIf { name.isNullOrBlank() || it.name == name } ?: byName ?: byId
                  if (exact == null && attempt < 20) {
                      subtitleUiHandler.postDelayed({ restoreMainVlcAudioTrack(attempt + 1) }, 500L)
                      return
                  }
                  val selected = exact ?: tracks.getOrNull(index)
                  if (selected != null) {
                      engine.selectAudioTrack(selected.id)
                      subtitleUiHandler.postDelayed({
                          android.util.Log.i("GX1Player", "Restored saved audio track " + selected.id)
                      }, 300L)
                  } else android.util.Log.w("GX1Player", "Saved audio track not found; saved id=" + saved + " name=" + name + " index=" + index)
              }
              private fun restoreMainVlcSubtitleTrack(attempt: Int = 0) {
                  val engine = mainVlcEngine ?: return
                  val key = mainVlcTrackStateKey()
                  val prefs = getSharedPreferences("gx1_player", android.content.Context.MODE_PRIVATE)
                  val saved = prefs.getInt(key + "_embedded_subtitle", Int.MIN_VALUE)
                  val name = prefs.getString(key + "_embedded_subtitle_name", null)
                  val index = prefs.getInt(key + "_embedded_subtitle_index", -1)
                  if (saved == Int.MIN_VALUE && name.isNullOrBlank() && index < 0) return
                  val tracks = runCatching { engine.subtitleTracks() }.getOrDefault(emptyList())
                  if (tracks.isEmpty()) {
                      if (attempt < 20) subtitleUiHandler.postDelayed({ restoreMainVlcSubtitleTrack(attempt + 1) }, 500L)
                      return
                  }
                  val byId = tracks.firstOrNull { it.id == saved }
                  val byName = tracks.firstOrNull { !name.isNullOrBlank() && it.name == name }
                  val exact = byId?.takeIf { name.isNullOrBlank() || it.name == name } ?: byName ?: byId
                  if (exact == null && saved != -1 && attempt < 20) {
                      subtitleUiHandler.postDelayed({ restoreMainVlcSubtitleTrack(attempt + 1) }, 500L)
                      return
                  }
                  val selected = exact ?: tracks.getOrNull(index)
                  if (selected != null) {
                      engine.selectSubtitleTrack(selected.id)
                      android.util.Log.i("GX1Player", "Restored saved embedded subtitle " + selected.id)
                  } else if (saved == -1) {
                      engine.selectSubtitleTrack(-1)
                  }
              }
          '''

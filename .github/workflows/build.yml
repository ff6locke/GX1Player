          \1            playerView.requestLayout()
          \1            playerView.post { playerView.requestLayout() }
          \1            Toast.makeText(this, "Aspect ratio: " + names[which], Toast.LENGTH_SHORT).show()
          \1            dialog.dismiss()
          \1        }
          \1        .setNegativeButton("Cancel", null)
          \1        .show()
          \1}'''
          s, n = re.subn(pattern, aspect, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Could not locate Aspect Ratio action; found " + str(n))
          # Add an explicit repeat mode chooser.
          marker = '"aspect" -> {'
          repeat = '''"repeat" -> {
                                  val modes = intArrayOf(Player.REPEAT_MODE_OFF, Player.REPEAT_MODE_ONE, Player.REPEAT_MODE_ALL)
                                  val names = arrayOf("Off", "Repeat current video", "Repeat all")

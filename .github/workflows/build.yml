name: Build GX1 Player APK
on:
  push:
    branches: [ main ]
    paths:
      - 'gx1-player.zip'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch containing the GX1Player source to build"
        required: true
        default: "main"
        type: string
concurrency:
  group: gx1-player-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
env:
  ZIP_FILE: gx1-player.zip
  PROJECT_DIR: gx1-player
  GRADLE_VERSION: '8.7'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch || github.ref }}
      - name: Extract project
        run: |
          test -f "$ZIP_FILE"
          unzip -oq "$ZIP_FILE" -d .
          test -f "$PROJECT_DIR/settings.gradle.kts"
      - name: Add TrueHD MAT packetizer source
        run: |
          TARGET="$PROJECT_DIR/app/src/main/java/com/example/gx1player/audio"
          mkdir -p "$TARGET"
          cp app/src/main/java/com/example/gx1player/audio/TrueHdMatPacker.kt "$TARGET/TrueHdMatPacker.kt"
          test -s "$TARGET/TrueHdMatPacker.kt"
          grep -q 'class TrueHdMatPacker' "$TARGET/TrueHdMatPacker.kt"
          echo "Added TrueHD MAT/IEC 61937 packetizer source."
      - name: Align Kotlin Gradle plugin with resolved Kotlin libraries
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [p for p in Path(".").rglob("*") if p.is_file() and (
              p.name.endswith(".gradle.kts") or p.name.endswith(".gradle") or
              p.name == "libs.versions.toml"
          )]
          changed = []
          patterns = [
              (r'(id\(["\']org\.jetbrains\.kotlin\.android["\']\)\s+version\s+["\'])2\.0\.0', r'\g<1>2.2.10'),
              (r'(kotlin\s*=\s*["\'])2\.0\.0', r'\g<1>2.2.10'),
              (r'(org\.jetbrains\.kotlin\.android\s*=\s*\{[^}]*version\s*=\s*["\'])2\.0\.0', r'\g<1>2.2.10'),
          ]
          for path in files:
              text = path.read_text()
              updated = text
              for pattern, replacement in patterns:
                  updated = re.sub(pattern, replacement, updated)
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          if not changed:
              raise SystemExit("No Kotlin 2.0.0 plugin/version declaration found; refusing to build with mismatched Kotlin.")
          print("Updated Kotlin Gradle plugin version to 2.2.10 in: " + ", ".join(changed))
          PY
      - name: Inspect original menu implementation
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          lines = p.read_text().splitlines()
          print("=== ORIGINAL MainActivity.kt: full source ===")
          for i, line in enumerate(lines):
              print(f"{i+1}: {line}")
          print("=== ORIGINAL declarations ===")
          for i, line in enumerate(lines):
              if line.lstrip().startswith(("class ", "private ", "override fun ", "fun ")):
                  print(f"{i+1}: {line}")
          PY
      - name: Install GX1 Player TV app icon
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/drawable/ic_gx1_launcher_foreground.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFB300" android:pathData="M54,8 A46,46 0,1 0,54 100 A46,46 0,1 0,54 8 M54,17 A37,37 0,1 1,54 91 A37,37 0,1 1,54 17" android:fillType="evenOdd"/>
              <path android:fillColor="#E8EDF5" android:pathData="M17,33 L25,27 L31,35 L23,41 Z M29,20 L39,16 L43,25 L33,29 Z M46,15 L57,14 L58,24 L47,25 Z M65,17 L75,21 L71,30 L61,26 Z M81,28 L89,36 L81,43 L74,35 Z M89,48 L94,58 L84,62 L80,52 Z M87,69 L83,79 L73,74 L77,64 Z"/>
              <path android:fillColor="#FF6D00" android:pathData="M43,29 C39,27 35,30 35,35 L35,73 C35,78 40,81 44,78 L77,58 C82,55 82,49 77,46 Z"/>
              <path android:fillColor="#FFD54F" android:pathData="M47,39 L68,52 L47,66 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M25,83 L31,83 L31,88 L36,88 L36,82 L42,82 L42,94 L30,94 C24,94 20,90 20,85 C20,80 24,76 30,76 L42,76 L42,81 L30,81 Z M47,76 L54,76 L60,83 L66,76 L73,76 L64,86 L74,94 L66,94 L60,89 L54,94 L46,94 L56,85 Z"/>
              <path android:fillColor="#FF9100" android:pathData="M78,81 L88,76 L88,94 L81,94 L81,84 L77,86 Z"/>
          </vector>
          XML
          cat > app/src/main/res/drawable/ic_gx1_launcher_background.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#080B12" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#171D2A" android:pathData="M0,0h108v12h-108z"/>
          </vector>
          XML
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_gx1_launcher_background"/>
              <foreground android:drawable="@drawable/ic_gx1_launcher_foreground"/>
          </adaptive-icon>
          XML
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android:icon="@mipmap/ic_launcher"' not in s:
              s = s.replace('<application\n', '<application\n        android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"\n', 1)
          p.write_text(s)
          if 'android:icon="@mipmap/ic_launcher"' not in s:
              raise SystemExit("Could not set launcher icon in manifest")
          PY
      - name: Upgrade Media3 audio engine
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = list(Path('.').rglob('*.gradle')) + list(Path('.').rglob('*.gradle.kts'))
          changed = []
          for p in files:
              old = p.read_text()
              new = re.sub(r'(?<![0-9])1[.]4[.]1(?![0-9])', '1.11.1', old)
              if new != old:
                  p.write_text(new)
                  changed.append(str(p))
          if not changed:
              raise SystemExit('Media3 1.4.1 dependency declaration not found; refusing an unverified upgrade')
          print('Upgraded Media3 1.4.1 to 1.11.1 in:', ', '.join(changed))
          PY
      - name: Inspect extracted Media3 player construction
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Player construction and media source lines ==="
          grep -n -E 'ExoPlayer|MediaSourceFactory|setMediaItem|setMediaSourceFactory|\.prepare\(' app/src/main/java/com/example/gx1player/MainActivity.kt || true
          echo "=== Media3 dependency versions ==="
          grep -R -n 'media3-exoplayer\|media3-extractor' --include='*.gradle*' .
      - name: Use Media3 default Matroska extractor and URI data source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          old = "val exo = ExoPlayer.Builder(this, renderers, gx1MediaSourceFactory)"
          if old in s:
              s = s.replace(old, "val exo = ExoPlayer.Builder(this, renderers)", 1)
          s = s.replace('''val gx1Extractors = androidx.media3.extractor.DefaultExtractorsFactory()
                      .setMatroskaExtractorFlags(
                          androidx.media3.extractor.mkv.MatroskaExtractor.FLAG_DISABLE_SEEK_FOR_CUES
                      )
                  val gx1MediaSourceFactory =
                      androidx.media3.exoplayer.source.DefaultMediaSourceFactory(this, gx1Extractors)
                  ''', "", 1)
          p.write_text(s)
          print("Using Media3 default extractors and normal content-URI data source.")
          PY
      - name: Increase buffering headroom for high-bitrate 4K files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          if "import androidx.media3.exoplayer.DefaultLoadControl" not in s:
              marker = "import androidx.media3.exoplayer.ExoPlayer"
              if marker not in s:
                  raise SystemExit("Could not locate ExoPlayer import")
              s = s.replace(marker, "import androidx.media3.exoplayer.DefaultLoadControl\n" + marker, 1)
          old = "val exo = ExoPlayer.Builder(this, renderers)"
          if old not in s:
              raise SystemExit("Could not find expected ExoPlayer builder after URI/extractor fix")
          replacement = """val gx1LoadControl = DefaultLoadControl.Builder()
                      .setBufferDurationsMs(
                          15_000, // Avoid excessive queued media on memory-limited TV hardware.
                          60_000, // Keep enough headroom without a very large reserve.
                          1_000,
                          3_000
                      )
                      .setTargetBufferBytes(32 * 1024 * 1024)
                      .setPrioritizeTimeOverSizeThresholds(true)
                      .build()
                  val exo = ExoPlayer.Builder(this, renderers)
                      .setLoadControl(gx1LoadControl)"""
          s = s.replace(old, replacement, 1)
          p.write_text(s)
          print("Configured larger time- and memory-bounded buffers for high-bitrate 4K playback.")
          PY
      - name: Patch Media3 1.4.1 audio sink API
        run: |
          TARGET="$PROJECT_DIR/app/src/main/java/com/example/gx1player/PassthroughRenderersFactory.kt"
          test -f "$TARGET"
          grep -n 'setEnableFloatOutput' "$TARGET" || true
          sed -i '/setEnableFloatOutput/d' "$TARGET"
          if grep -n 'setEnableFloatOutput' "$TARGET"; then
            echo "::error::Unsupported float-output builder call remains"
            exit 1
          fi
      - name: Use updated Media3 native HDMI audio sink
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/gx1player/PassthroughRenderersFactory.kt')
          old = p.read_text()
          package = next((line for line in old.splitlines() if line.startswith('package ')), None)
          if not package:
              raise SystemExit('Could not determine passthrough renderer package')
          p.write_text(package + '''\n\nimport android.content.Context\nimport androidx.media3.exoplayer.DefaultRenderersFactory\n\nclass PassthroughRenderersFactory(context: Context) : DefaultRenderersFactory(context) {\n    init {\n        setExtensionRendererMode(EXTENSION_RENDERER_MODE_OFF)\n    }\n}\n''')
          print('Using updated Media3 native E-AC-3 JOC HDMI passthrough implementation.')
          PY
      - name: Make Audio pass-through Off force PCM decoding
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base = Path("app/src/main/java/com/example/gx1player")
          source = base / "PassthroughRenderersFactory.kt"
          package = next((line for line in source.read_text().splitlines() if line.startswith("package ")), None)
          if not package:
              raise SystemExit("Could not determine renderer package")
          pcm = base / "PcmRenderersFactory.kt"
          pcm.write_text(package + """\n\nimport android.content.Context
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.audio.AudioCapabilities
          import androidx.media3.exoplayer.audio.AudioSink
          import androidx.media3.exoplayer.audio.DefaultAudioSink
          class PcmRenderersFactory(context: Context) : DefaultRenderersFactory(context) {
              override fun buildAudioSink(
                  context: Context,
                  enableFloatOutput: Boolean,
                  enableAudioOutputPlaybackParams: Boolean
              ): AudioSink {
                  return DefaultAudioSink.Builder()
                      .setAudioCapabilities(AudioCapabilities(intArrayOf(android.media.AudioFormat.ENCODING_PCM_16BIT), 8))
                      .setEnableFloatOutput(enableFloatOutput)
                      .setEnableAudioOutputPlaybackParameters(enableAudioOutputPlaybackParams)
                      .build()
              }
          }
          """)
          main = base / "MainActivity.kt"
          s = main.read_text()
          old = """        } else {
                      DefaultRenderersFactory(this)
                  }"""
          new = """        } else {
                      PcmRenderersFactory(this)
                  }"""
          if old not in s:
              raise SystemExit("Could not find the exact existing PCM fallback branch; refusing a risky renderer rewrite")
          s = s.replace(old, new, 1)
          if "val renderers = if (passthrough)" not in s or "PassthroughRenderersFactory(this)" not in s:
              raise SystemExit("Passthrough renderer branch was unexpectedly changed")
          if "PcmRenderersFactory(this)" not in s:
              raise SystemExit("PCM fallback branch verification failed")
          main.write_text(s)
          print("Verified mutually exclusive renderer branches: passthrough On uses PassthroughRenderersFactory; Off uses PcmRenderersFactory.")
          PY
      - name: Wire TrueHD MAT carrier into passthrough playback
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          TARGET="app/src/main/java/com/example/gx1player/audio"
          mkdir -p "$TARGET"
          cp "$GITHUB_WORKSPACE/app/src/main/java/com/example/gx1player/audio/TrueHdCarrierRenderersFactory.kt" "$TARGET/TrueHdCarrierRenderersFactory.kt"
          test -s "$TARGET/TrueHdCarrierRenderersFactory.kt"
          grep -q 'class TrueHdCarrierRenderersFactory' "$TARGET/TrueHdCarrierRenderersFactory.kt"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          import_line = "import com.example.gx1player.audio.TrueHdCarrierRenderersFactory"
          if import_line not in s:
              s = s.replace("package com.example.gx1player", "package com.example.gx1player\n\n" + import_line, 1)
          old = "PassthroughRenderersFactory(this)"
          if old not in s:
              raise SystemExit("Could not find passthrough renderer selection")
          s = s.replace(old, "TrueHdCarrierRenderersFactory(this)", 1)
          if "TrueHdCarrierRenderersFactory(this)" not in s:
              raise SystemExit("TrueHD carrier renderer was not selected")
          p.write_text(s)
          print("TrueHD MAT carrier sink is connected only to the passthrough-enabled renderer branch.")
          PY
          echo "TrueHD MAT carrier renderer source installed."
      - name: Add DTS passthrough capability diagnostics (no playback changes)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          if "private fun logDtsPassthroughCapabilities()" in s:
              raise SystemExit("DTS diagnostics already present; refusing duplicate insertion")
          helper = """
              private fun logDtsPassthroughCapabilities() {
                  try {
                      val caps = androidx.media3.exoplayer.audio.AudioCapabilities.getCapabilities(this)
                      android.util.Log.i("GX1_DTS", "Media3 audio capabilities=" + caps.toString())
                      if (android.os.Build.VERSION.SDK_INT >= 29) {
                          val attrs = android.media.AudioAttributes.Builder()
                              .setUsage(android.media.AudioAttributes.USAGE_MEDIA)
                              .setContentType(android.media.AudioAttributes.CONTENT_TYPE_MOVIE)
                              .build()
                          for (encoding in listOf(android.media.AudioFormat.ENCODING_DTS, android.media.AudioFormat.ENCODING_DTS_HD)) {
                              val format = android.media.AudioFormat.Builder()
                                  .setEncoding(encoding)
                                  .setSampleRate(48000)
                                  .setChannelMask(android.media.AudioFormat.CHANNEL_OUT_5POINT1)
                                  .build()
                              android.util.Log.i("GX1_DTS", "directPlayback encoding=" + encoding +
                                  " supported=" + android.media.AudioTrack.isDirectPlaybackSupported(format, attrs))
                          }
                      } else {
                          android.util.Log.i("GX1_DTS", "Direct playback query unavailable below API 29")
                      }
                  } catch (e: Exception) {
                      android.util.Log.e("GX1_DTS", "Capability query failed", e)
                  }
              }
          """
          class_marker = "class MainActivity"
          class_pos = s.find(class_marker)
          if class_pos < 0:
              raise SystemExit("MainActivity class declaration not found")
          brace = s.find("{", class_pos)
          if brace < 0:
              raise SystemExit("MainActivity class body not found")
          s = s[:brace + 1] + "\n" + helper + s[brace + 1:]
          call_marker = "super.onCreate(savedInstanceState)"
          if s.count(call_marker) != 1:
              raise SystemExit("Expected exactly one onCreate super call; refusing unsafe insertion")
          s = s.replace(call_marker, call_marker + "\\n        logDtsPassthroughCapabilities()", 1)
          p.write_text(s)
          print("Added startup-only DTS capability logs; no renderer or playback settings changed.")
          PY
      - name: Inspect passthrough renderer and audio configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== PassthroughRenderersFactory.kt ==="
          nl -ba app/src/main/java/com/example/gx1player/PassthroughRenderersFactory.kt | sed -n '1,260p'
          echo "=== Audio-related MainActivity configuration ==="
          grep -n -i -E 'audio|passthrough|tunnel|offload|buffer|renderer' app/src/main/java/com/example/gx1player/MainActivity.kt | head -160
      - name: Add requested menu and reliable resume behavior
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          for imp in ["import androidx.activity.OnBackPressedCallback", "import androidx.media3.common.PlaybackException"]:
              if imp not in s:
                  s = s.replace("import androidx.activity.result.contract.ActivityResultContracts", imp + "\n" + "import androidx.activity.result.contract.ActivityResultContracts", 1)
          s = s.replace('arrayOf("video/*", "audio/*")', 'arrayOf("video/*", "audio/*", "application/octet-stream", "application/x-matroska")')
          s = s.replace(
              'val builder = MediaItem.Builder().setUri(uri)',
              '''val builder = MediaItem.Builder().setUri(uri)
                  if (displayName(uri).endsWith(".mkv", ignoreCase = true)) {
                      builder.setMimeType(MimeTypes.APPLICATION_MATROSKA)
                  }''', 1)
          s = s.replace(
              '                if (!isPlaying) savePosition(exo)\n            }',
              '''                if (!isPlaying) savePosition(exo)
              }
              override fun onPlayerError(error: PlaybackException) {
                  val causes = generateSequence<Throwable>(error) { it.cause }
                      .take(6)
                      .map { cause -> "${cause.javaClass.simpleName}: ${cause.message ?: "no message"}" }
                      .joinToString(" <- ")
                  val detail = "${error.errorCodeName} | $causes"
                  android.util.Log.e("GX1Player", "Media3 playback failed: $detail", error)
                  runOnUiThread {
                      AlertDialog.Builder(this@MainActivity)
                          .setTitle("Playback error")
                          .setMessage(detail + "\n\nSelected: " + (mediaUri?.toString() ?: "unknown"))
                          .setPositiveButton("OK", null)
                          .show()
                  }
              }''', 1)
          startup_line = '        val initial = intent?.data ?: prefs.getString(KEY_LAST_URI, null)?.let { Uri.parse(it) }'
          if startup_line not in s:
              raise SystemExit("Could not find startup media restore line")
          s = s.replace(startup_line, '        val initial: Uri? = null', 1)
          back_marker = '        val initial: Uri? = null'
          back_callback = '''        onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
              override fun handleOnBackPressed() {
                  showMenu()
              }
          })
          '''
          if 'onBackPressedDispatcher.addCallback(this' not in s:
              if back_marker not in s:
                  raise SystemExit("Could not find onCreate insertion point for Back handling")
              s = s.replace(back_marker, back_callback + back_marker, 1)
          for imp in ["import android.view.Gravity", "import android.widget.Button", "import android.widget.FrameLayout"]:
              if imp not in s:
                  s = s.replace("import android.view.KeyEvent", "import android.view.KeyEvent\n" + imp, 1)
          if "setContentView(playerView)" in s and 'text = "Menu"' not in s:
              s = s.replace(
                  "        setContentView(playerView)",
                  """        val root = FrameLayout(this)
                  rootLayout = root
                  playerView.subtitleView?.setStyle(
                      androidx.media3.ui.CaptionStyleCompat(
                          Color.WHITE, Color.TRANSPARENT, Color.TRANSPARENT,
                          androidx.media3.ui.CaptionStyleCompat.EDGE_TYPE_NONE,
                          Color.TRANSPARENT, null
                      )
                  )
                  root.addView(playerView, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))
                  val playbackTitle = android.widget.TextView(this).apply {
                      tag = "gx1_playback_title"
                      setTextColor(Color.WHITE)
                      textSize = 16f
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                      maxLines = 1
                      ellipsize = android.text.TextUtils.TruncateAt.MIDDLE
                      gravity = Gravity.CENTER
                      setPadding(18, 8, 18, 8)
                      background = android.graphics.drawable.GradientDrawable().apply {
                          setColor(0x99000000.toInt())
                          cornerRadius = 10f
                      }
                      visibility = android.view.View.GONE
                  }
                  val playbackOverlay = playerView.findViewById<FrameLayout>(
                      androidx.media3.ui.R.id.exo_overlay
                  )
                  playbackOverlay?.addView(playbackTitle, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.TOP or Gravity.CENTER_HORIZONTAL
                  ).apply { topMargin = (18 * resources.displayMetrics.density).toInt() })
                  if (playbackOverlay == null) {
                      android.util.Log.e("GX1Player", "Media3 exo_overlay was not found; playback title cannot be displayed")
                  }
                  homePanel = buildHomePanel()
                  root.addView(homePanel, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))
                  playerView.visibility = android.view.View.GONE
                  val media3SettingsGear = playerView.findViewById<android.view.View>(
                      androidx.media3.ui.R.id.exo_settings
                  )
                  media3SettingsGear?.apply {
                      visibility = android.view.View.VISIBLE
                      setOnClickListener { showMenu() }
                      contentDescription = "Playback settings"
                  }
                  media3SettingsGear?.let { gear ->
                      val gearParent = gear.parent as? android.view.ViewGroup
                      if (gearParent != null && gearParent.findViewWithTag<android.view.View>("gx1_open_video") == null) {
                          val gearIndex = gearParent.indexOfChild(gear)
                          val openVideoButton = android.widget.ImageButton(this).apply {
                              tag = "gx1_open_video"
                              setImageDrawable(object : android.graphics.drawable.Drawable() {
                                  private val folderPaint = android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG).apply {
                                      color = Color.WHITE
                                      style = android.graphics.Paint.Style.FILL
                                  }
                                  private val videoPaint = android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG).apply {
                                      color = Color.rgb(20, 91, 245)
                                      style = android.graphics.Paint.Style.FILL
                                  }
                                  private val detailPaint = android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG).apply {
                                      color = Color.WHITE
                                      style = android.graphics.Paint.Style.FILL
                                  }
                                  override fun draw(canvas: android.graphics.Canvas) {
                                      val b = bounds
                                      canvas.save()

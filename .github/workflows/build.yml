              s = s.replace(anchor, dynamic_fields + "\n" + anchor, 1)
          auto_method = """    private fun resolveVideoPath(uri: Uri): String? {
                  if (uri.scheme.equals("file", true)) return uri.path
                  val direct = runCatching {
                      contentResolver.query(uri, arrayOf(android.provider.MediaStore.MediaColumns.DATA), null, null, null)?.use { c ->
                          if (c.moveToFirst()) c.getString(0) else null
                      }
                  }.getOrNull()
                  if (!direct.isNullOrBlank()) return direct
                  val documentId = runCatching {
                      if (android.provider.DocumentsContract.isDocumentUri(this, uri))
                          android.provider.DocumentsContract.getDocumentId(uri)
                      else null
                  }.getOrNull() ?: return null
                  when (uri.authority) {
                      "com.android.providers.media.documents" -> {
                          val parts = documentId.split(":", limit = 2)
                          if (parts.size == 2 && parts[0] == "video") {

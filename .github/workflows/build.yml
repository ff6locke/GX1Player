          if n != 1 and "loadVlcSubtitle(slot, selected)" not in s:
              raise SystemExit("Subtitle picker selection code not found by robust pattern")
          start=s.find("    private fun showSubtitleTracks() {"); end=s.find("    override fun onStop()",start)
          if start<0 or end<0: raise SystemExit("subtitle dialog anchors missing")
          dialog="""    private fun showSubtitleTracks() {
                  // Refresh filename-matched external subtitles whenever the checkbox list opens.
                  autoLoadMatchingSubtitles()
                  val embedded = runCatching { engine?.subtitleTracks().orEmpty() }.getOrDefault(emptyList())
                  val labels = mutableListOf<String>()
                  val checked = mutableListOf<Boolean>()
                  val kinds = mutableListOf<Pair<String, Int>>()
                  vlcSubtitles.forEachIndexed { index, sub ->
                      labels.add(sub.name)
                      checked.add(sub.enabled)
                      kinds.add("custom" to index)
                  }
                  var selected = engine?.selectedSubtitleTrackId() ?: -1
                  if (selected < 0 && embedded.isNotEmpty()) {
                      selected = embedded.first().id
                      engine?.selectSubtitleTrack(selected)
                  }
                  embedded.forEach { tr ->
                      labels.add("Embedded — " + tr.name)
                      checked.add(tr.id == selected)
                      kinds.add("embedded" to tr.id)
                  }
                  if (labels.isEmpty()) {
                      Toast.makeText(this, "No external or embedded subtitles found.", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val dlg = AlertDialog.Builder(this).setTitle("Subtitles — tick to show")
                      .setMultiChoiceItems(labels.toTypedArray(), checked.toBooleanArray()) { d, which, on ->
                          val (kind, value) = kinds[which]
                          if (kind == "custom") vlcSubtitles[value].enabled = on
                          else if (on) {
                              engine?.selectSubtitleTrack(value)
                              for (i in kinds.indices) if (kinds[i].first == "embedded" && i != which)
                                  (d as AlertDialog).listView.setItemChecked(i, false)
                          } else if (engine?.selectedSubtitleTrackId() == value) engine?.selectSubtitleTrack(-1)
                      }.setPositiveButton("Done", null).setNegativeButton("Close", null).create()
                  dlg.show()
              }

          """
          s=s[:start]+dialog+s[end:]
          if "vlcSubtitleView = TextView(this)" not in s:
              anchor="        root.addView(controls, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM))"
              overlay="""        vlcSubtitleView = TextView(this).apply {
                      setTextColor(android.graphics.Color.WHITE)

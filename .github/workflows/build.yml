                  }
                  val subtitleButton = Button(this).apply {
                      text = "Subtitle"
                      setOnClickListener { showSubtitleTracks() }
                  }
                  outputButton = Button(this).apply {
                      text = "HDMI: ON"
                      setOnClickListener {
                          val active = engine
                          val currentUri = mediaUri
                          if (active != null && currentUri != null) {
                              val resume = active.currentTimeMs()
                              digitalOutput = !digitalOutput
                              text = if (digitalOutput) "HDMI: ON" else "HDMI: OFF"
                              status.text = "Restarting VLC (HDMI output " + if (digitalOutput) "ON" else "OFF" + ")…"
                              active.open(currentUri, resume, digitalOutput)
                          }
                      }
                  }
                  val backButton = Button(this).apply {
                      text = "Back"
                      setOnClickListener { finish() }
                  }
                  row.addView(playButton, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(audioButton, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(subtitleButton, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(outputButton, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(backButton, LinearLayout.LayoutParams(0, -2, 1f))
                  controls.addView(status)
                  controls.addView(position)
                  controls.addView(seek)
                  controls.addView(row)
                  root.addView(controls, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM))
                  setContentView(root)

                  try {
                      val vlcEngine = Gx1LibVlcEngine(this) { state ->
                          runOnUiThread {
                              status.text = when {
                                  state.error != null -> state.error

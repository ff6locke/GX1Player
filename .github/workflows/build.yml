      - name: Ensure playback history is recorded on every selection
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          start = s.find("    private fun selectMedia(uri: Uri) {")

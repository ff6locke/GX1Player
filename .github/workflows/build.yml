          block = s[start:end]
          lines = [line for line in block.splitlines() if "putString(KEY_LAST_URI" not in line and "putLong(KEY_HISTORY_PREFIX" not in line]
          insert_at = next((i for i, line in enumerate(lines) if "mediaUri = uri" in line), None)

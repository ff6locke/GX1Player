      - name: Add real audio track selection
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          marker = "    private fun showMenu() {"
          method = r'''    private fun showAudioTrackSelection() {
                  val exo = player
                  if (exo == null) {
                      Toast.makeText(this, "No player is active.", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val audioGroups = exo.currentTracks.groups.filter {
                      it.type == androidx.media3.common.C.TRACK_TYPE_AUDIO
                  }
                  val choices = mutableListOf<Pair<androidx.media3.common.TrackGroup, Int>>()
                  val labels = mutableListOf<String>()
                  labels.add("Auto (default)")
                  for (group in audioGroups) {
                      for (index in 0 until group.length) {
                          if (!group.isTrackSupported(index)) continue
                          val format = group.getTrackFormat(index)
                          val language = format.language
                              ?.takeIf { it.isNotBlank() && it != "und" }
                              ?.let { java.util.Locale.forLanguageTag(it).getDisplayLanguage(java.util.Locale.getDefault()) }
                              ?.takeIf { it.isNotBlank() }
                          val name = format.label?.takeIf { it.isNotBlank() }
                          val mime = format.sampleMimeType.orEmpty().lowercase(java.util.Locale.ROOT)
                          val codecs = format.codecs.orEmpty().lowercase(java.util.Locale.ROOT)
                          val codecLabel = when {
                              mime.contains("eac3-joc") || codecs.contains("ec+3") ||
                                  name?.contains("atmos", ignoreCase = true) == true -> "Dolby Atmos"
                              mime.contains("truehd") || codecs.contains("mlp") -> "Dolby TrueHD"
                              mime.contains("eac3") || codecs.contains("ec-3") -> "Dolby Digital Plus"
                              mime.contains("ac3") || codecs.contains("ac-3") -> "Dolby Digital"
                              mime.contains("dts") || codecs.contains("dts") -> when {
                                  codecs.contains("dts-hd") || mime.contains("dts-hd") -> "DTS-HD"
                                  else -> "DTS"
                              }
                              mime.contains("aac") || codecs.contains("mp4a") -> "AAC"
                              mime.contains("flac") -> "FLAC"
                              mime.contains("opus") -> "Opus"
                              mime.contains("mpeg") -> "MPEG Audio"
                              else -> null
                          }
                          val channels = when (format.channelCount) {
                              1 -> "Mono"
                              2 -> "Stereo"
                              3 -> "2.1"
                              4 -> "4.0"
                              5 -> "5.0"
                              6 -> if (codecLabel?.startsWith("DTS") == true) "5.1" else "5.1"
                              7 -> "6.1"
                              8 -> "7.1"
                              else -> null
                          }
                          val details = listOfNotNull(
                              name,
                              codecLabel,
                              channels,
                              language,
                              format.sampleRate.takeIf { it > 0 }?.let { "${it / 1000} kHz" }
                          ).distinct().joinToString(" · ")
                          val fallback = "Audio ${choices.size + 1}"
                          labels.add(if (details.isBlank()) fallback else details)
                          choices.add(group.mediaTrackGroup to index)
                      }
                  }
                  if (choices.isEmpty()) {
                      Toast.makeText(this, "No selectable audio tracks found in this video.", Toast.LENGTH_LONG).show()
                      return
                  }
                  var flat = 0
                  var selectedChoice = 0
                  loop@ for (group in audioGroups) {
                      for (index in 0 until group.length) {
                          if (!group.isTrackSupported(index)) continue
                          if (group.isTrackSelected(index)) {
                              selectedChoice = flat + 1
                              break@loop
                          }
                          flat++
                      }
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Audio track")
                      .setSingleChoiceItems(labels.toTypedArray(), selectedChoice) { dialog, which ->
                          val builder = exo.trackSelectionParameters.buildUpon()
                              .clearOverridesOfType(androidx.media3.common.C.TRACK_TYPE_AUDIO)
                              .setTrackTypeDisabled(androidx.media3.common.C.TRACK_TYPE_AUDIO, false)
                          if (which > 0) {
                              val (trackGroup, trackIndex) = choices[which - 1]
                              builder.addOverride(
                                  androidx.media3.common.TrackSelectionOverride(trackGroup, listOf(trackIndex))
                              )
                          }
                          exo.trackSelectionParameters = builder.build()
                          dialog.dismiss()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

          '''
          if "private fun showAudioTrackSelection()" not in s:
              if marker not in s:
                  raise SystemExit("Could not find showMenu() insertion point for audio selector")
              s = s.replace(marker, method + marker, 1)
          old = '''"audio" -> Toast.makeText(this, "Choose an audio track from the available player tracks.", Toast.LENGTH_SHORT).show()'''
          new = '''"audio" -> {
                                  menuPopupRef?.dismiss()
                                  showAudioTrackSelection()
                              }'''
          if old in s:
              s = s.replace(old, new, 1)
          elif '"audio" -> {' not in s or "showAudioTrackSelection()" not in s:
              raise SystemExit("Could not find audio placeholder to replace")
          p.write_text(s)
          print("Added Media3 audio track listing and selection.")
          PY

      - name: Add VLC-style built-in subtitle track list
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          marker = "    private fun showMenu() {"
          method = r'''    private fun showSubtitleTrackSelection() {
                  val exo = player
                  if (exo == null) {
                      Toast.makeText(this, "No player is active.", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val textGroups = exo.currentTracks.groups.filter {
                      it.type == androidx.media3.common.C.TRACK_TYPE_TEXT
                  }
                  val choices = mutableListOf<Pair<androidx.media3.common.TrackGroup, Int>>()
                  val labels = mutableListOf<String>()
                  labels.add("Off")
                  for (group in textGroups) {
                      for (index in 0 until group.length) {
                          if (!group.isTrackSupported(index)) continue
                          val format = group.getTrackFormat(index)
                          val language = format.language
                              ?.takeIf { it.isNotBlank() && it != "und" }
                              ?.let { java.util.Locale.forLanguageTag(it).getDisplayLanguage(java.util.Locale.getDefault()) }
                              ?.takeIf { it.isNotBlank() }
                          val details = listOfNotNull(
                              format.label?.takeIf { it.isNotBlank() },
                              language
                          ).distinct().joinToString(" · ")
                          // Never expose internal MIME names such as x-media3-cues in the subtitle list.
                          labels.add(if (details.isBlank()) "Embedded subtitle ${choices.size + 1}" else details)
                          choices.add(group.mediaTrackGroup to index)
                      }
                  }
                  val selected = run {
                      var flat = 0
                      var found = 0
                      loop@ for (group in textGroups) {
                          for (index in 0 until group.length) {
                              if (!group.isTrackSupported(index)) continue
                              if (group.isTrackSelected(index)) {
                                  found = flat + 1
                                  break@loop
                              }
                              flat++
                          }
                      }
                      found
                  }
                  val items = labels.toMutableList().apply {
                      add("Load custom subtitle 1…")
                      add("Load custom subtitle 2…")
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Subtitle")
                      .setSingleChoiceItems(items.toTypedArray(), selected) { dialog, which ->
                          when {
                              which == 0 -> {
                                  val params = exo.trackSelectionParameters.buildUpon()
                                      .clearOverridesOfType(androidx.media3.common.C.TRACK_TYPE_TEXT)
                                      .setTrackTypeDisabled(androidx.media3.common.C.TRACK_TYPE_TEXT, true)
                                  exo.trackSelectionParameters = params.build()
                                  dialog.dismiss()
                              }
                              which <= choices.size -> {
                                  val (trackGroup, trackIndex) = choices[which - 1]
                                  val params = exo.trackSelectionParameters.buildUpon()
                                      .clearOverridesOfType(androidx.media3.common.C.TRACK_TYPE_TEXT)
                                      .setTrackTypeDisabled(androidx.media3.common.C.TRACK_TYPE_TEXT, false)
                                      .addOverride(androidx.media3.common.TrackSelectionOverride(trackGroup, listOf(trackIndex)))
                                  exo.trackSelectionParameters = params.build()
                                  dialog.dismiss()
                              }
                              which == choices.size + 1 -> {
                                  dialog.dismiss()
                                  pickSubtitle.launch(arrayOf("application/x-subrip", "text/vtt", "text/plain", "application/octet-stream"))
                              }
                              else -> {
                                  dialog.dismiss()
                                  pickSubtitle2.launch(arrayOf("application/x-subrip", "text/vtt", "text/plain", "application/octet-stream"))
                              }
                          }
                      }
                      .setNegativeButton("Close", null)
                      .show()
              }

          '''
          if "private fun showSubtitleTrackSelection()" not in s:
              if marker not in s:
                  raise SystemExit("Could not find showMenu() insertion point for subtitle selector")
              s = s.replace(marker, method + marker, 1)

          # The actual playback UI is the floating panel, not the legacy add() menu.
          # Route its Subtitle Track row to the built-in + custom unified selector.
          old_subtitle_action = '''"subtitle" -> AlertDialog.Builder(this)
                                  .setTitle("Load subtitles")
                                  .setItems(arrayOf("Load subtitle 1", "Load subtitle 2")) { _, which ->
                                      val types = arrayOf("application/x-subrip", "text/vtt", "text/plain", "application/octet-stream")
                                      if (which == 0) pickSubtitle.launch(types) else pickSubtitle2.launch(types)
                                  }
                                  .show()'''
          new_subtitle_action = '''"subtitle" -> showSubtitleTrackSelection()'''
          if old_subtitle_action in s:
              s = s.replace(old_subtitle_action, new_subtitle_action, 1)
          elif '"subtitle" -> showSubtitleTrackSelection()' not in s:
              raise SystemExit("Could not find floating playback Subtitle Track action")

          menu_anchor = '        add("Load Subtitle 1 (.srt / .ass)") {'
          menu_entry = '        add("Built-in subtitle tracks") { showSubtitleTrackSelection() }\n'
          if 'add("Built-in subtitle tracks")' not in s:
              if menu_anchor not in s:
                  raise SystemExit("Could not find custom subtitle menu entries")
              s = s.replace(menu_anchor, menu_entry + menu_anchor, 1)
          p.write_text(s)
          print("Added embedded subtitle tracks plus separate custom subtitle 1 and 2 entries.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Configure stable versioning and release signing
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          val buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()
          val storeFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
          val storePasswordValue = System.getenv("ANDROID_KEYSTORE_PASSWORD")
          val aliasValue = System.getenv("ANDROID_KEY_ALIAS")
          val keyPasswordValue = System.getenv("ANDROID_KEY_PASSWORD")
          val signed = !storeFilePath.isNullOrBlank() && !storePasswordValue.isNullOrBlank() &&
              !aliasValue.isNullOrBlank() && !keyPasswordValue.isNullOrBlank()

          android {
              namespace = "com.example.gx1player"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.gx1player"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = buildNumber
                  versionName = "1.0.$buildNumber"
                  buildConfigField("String", "BUILD_NUMBER", "\"$buildNumber\"")
              }
              buildFeatures { buildConfig = true }
              signingConfigs {
                  if (signed) create("stableRelease") {
                      storeFile = file(storeFilePath!!)
                      storePassword = storePasswordValue
                      keyAlias = aliasValue
                      keyPassword = keyPasswordValue
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      if (signed) signingConfig = signingConfigs.getByName("stableRelease")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              val media3 = "1.4.1"
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-ui:$media3")
              implementation("androidx.media3:media3-common:$media3")
              implementation("androidx.media3:media3-extractor:$media3")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          GRADLE

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gx1-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/gx1-release.jks" >> "$GITHUB_ENV"
            echo "BUILD_KIND=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets are not configured; producing a debug APK that cannot update-install over a differently signed app."
            echo "BUILD_KIND=debug" >> "$GITHUB_ENV"
          fi

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version "$GRADLE_VERSION" --no-daemon

      - name: Inspect generated Kotlin subtitle declarations
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          nl -ba app/src/main/java/com/example/gx1player/MainActivity.kt | sed -n '45,150p'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "$BUILD_KIND" = "release" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gx1-player-${{ env.BUILD_KIND }}-b${{ github.run_number }}
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/${{ env.BUILD_KIND }}/*.apk
          if-no-files-found: error
          retention-days: 30

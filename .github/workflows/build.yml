              s, n = re.subn(pattern, lambda m: m.group(1) + "vlcEngine.open(uri, resumeAt, digitalOutput)\n" + m.group(1) + "handler.postDelayed({ autoLoadMatchingSubtitles() }, 1500L)", s, count=1)
              if n != 1: raise SystemExit("VLC media open call missing")
          if "private fun loadVlcSubtitle(slot: Int" not in s:
              anchor = "    private fun showAudioTracks() {"
              methods = r'''
              private fun loadVlcSubtitle(slot: Int, file: java.io.File) {
                  try {
                      val raw = file.readText(Charsets.UTF_8).removePrefix("\\uFEFF")
                      val cues = mutableListOf<VlcCue>()
                      fun parseTime(value: String, ass: Boolean): Long {
                          val v = value.trim()
                          val clock = v.substringBefore('.').substringBefore(',')
                          val fraction = if ('.' in v) v.substringAfter('.') else if (',' in v) v.substringAfter(',') else "0"
                          val p = clock.split(':')
                          if (p.size != 3) throw IllegalArgumentException("Bad subtitle timestamp: " + value)
                          val h = p[0].toLong()
                          val m = p[1].toLong()
                          val sec = p[2].toLong()
                          val digits = fraction.takeWhile { it.isDigit() }.take(if (ass) 2 else 3).padEnd(if (ass) 2 else 3, '0')
                          val millis = if (ass) digits.toLong() * 10 else digits.toLong()
                          return ((h * 3600 + m * 60 + sec) * 1000) + millis
                      }
                      fun cleanAssText(value: String): String {
                          val out = StringBuilder()
                          var insideTag = false
                          var i = 0
                          while (i < value.length) {
                              val ch = value[i]
                              if (ch == '{') insideTag = true
                              else if (ch == '}') insideTag = false
                              else if (!insideTag) {
                                  if (ch.code == 92 && i + 1 < value.length && (value[i + 1] == 'N' || value[i + 1] == 'n')) {
                                      out.append(10.toChar()); i++
                                  } else out.append(ch)
                              }
                              i++
                          }
                          return out.toString().trim()
                      }
                      fun cleanSrtText(value: String): String {
                          val out = StringBuilder()
                          var insideTag = false
                          for (ch in value) {
                              if (ch == '<') insideTag = true
                              else if (ch == '>') insideTag = false
                              else if (!insideTag) out.append(ch)
                          }
                          return out.toString().trim()
                      }
                      if (raw.contains("[Events]", true)) {
                          var fmt = listOf("Layer","Start","End","Style","Name","MarginL","MarginR","MarginV","Effect","Text")
                          raw.lineSequence().forEach { line ->
                              val t = line.trim()
                              if (t.startsWith("Format:", true)) fmt = t.substringAfter(':').split(',').map { it.trim() }
                              if (t.startsWith("Dialogue:", true)) {
                                  val f = t.substringAfter(':').split(',', limit=fmt.size)
                                  val a=fmt.indexOfFirst { it.equals("Start",true) }; val b=fmt.indexOfFirst { it.equals("End",true) }; val c=fmt.indexOfFirst { it.equals("Text",true) }
                                  if (a>=0 && b>=0 && c>=0 && f.size>maxOf(a,b,c)) {
                                      val caption=cleanAssText(f[c])
                                      val st=parseTime(f[a], true); val en=parseTime(f[b], true)
                                      if (en>st && caption.isNotBlank()) cues.add(VlcCue(st,en,caption))
                                  }
                              }
                          }
                      } else {
                          val lines=raw.lines(); var i=0
                          while(i<lines.size) {
                              val arrow=lines[i].indexOf("-->")
                              if(arrow>=0) {
                                  val left=lines[i].substring(0,arrow).trim()
                                  val right=lines[i].substring(arrow+3).trim().substringBefore(' ')
                                  try {
                                      val st=parseTime(left, false); val en=parseTime(right, false)
                                      i++
                                      val body=StringBuilder()
                                      while(i<lines.size && lines[i].isNotBlank()) {
                                          if(body.isNotEmpty()) body.append(10.toChar())
                                          body.append(cleanSrtText(lines[i]))
                                          i++
                                      }
                                      if(en>st && body.isNotBlank()) cues.add(VlcCue(st,en,body.toString()))
                                  } catch (_: Exception) { }
                              }
                              i++
                          }
                      }
                      if(cues.isEmpty()) throw IllegalArgumentException("No subtitle cues found")
                      val existing = vlcSubtitles.indexOfFirst { it.name.equals(file.name, true) }
                      val loaded = VlcSubtitle(file.name, cues.sortedBy { it.start }.toMutableList(), vlcSubtitles.isEmpty())
                      if (existing >= 0) vlcSubtitles[existing] = loaded else vlcSubtitles.add(loaded)
                      status.text = "Subtitle loaded: " + file.name
                      Toast.makeText(this, "Subtitle loaded: " + file.name, Toast.LENGTH_SHORT).show()
                  } catch(e:Exception) {
                      Toast.makeText(this,"Subtitle " + slot + " error: " + (e.message ?: "invalid file"),Toast.LENGTH_LONG).show()
                  }
              }

              '''
              if anchor not in s: raise SystemExit("audio menu anchor missing")
              s=s.replace(anchor,methods+anchor,1)
          import re
          s, n = re.subn(
              r'val loaded = runCatching \{ engine\?\.addExternalSubtitle\(Uri\.fromFile\(selected\)\) == true \}\.getOrDefault\(false\)\s*status\.text = if \(loaded\).*?Toast\.makeText\(this, status\.text, Toast\.LENGTH_LONG\)\.show\(\)',
              'loadVlcSubtitle(slot, selected)',

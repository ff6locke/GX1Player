                  window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY)
                  val uri = intent.data ?: run {
                      Toast.makeText(this, "No video selected for LibVLC", Toast.LENGTH_LONG).show()
                      finish()
                      return
                  }
                  mediaUri = uri
                  val resumeAt = prefs.getLong("pos|" + uri.toString(), 0L)
                  val root = FrameLayout(this).apply { setBackgroundColor(android.graphics.Color.BLACK) }
                  val videoView = VLCVideoLayout(this)
                  video = videoView
                  root.addView(videoView, FrameLayout.LayoutParams(-1, -1))
                  val controls = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(16, 10, 16, 10)
                      setBackgroundColor(0x99000000.toInt())
                  }
                  status = TextView(this).apply {
                      text = "LibVLC playback test"
                      setTextColor(-1)
                      textSize = 14f
                  }
                  position = TextView(this).apply {
                      text = "00:00 / 00:00"
                      setTextColor(-1)
                      textSize = 13f
                  }
                  seek = SeekBar(this).apply {
                      isFocusable = true
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onStartTrackingTouch(bar: SeekBar?) { dragging = true }
                          override fun onStopTrackingTouch(bar: SeekBar?) {
                              val mp = player
                              if (mp != null && mp.length > 0L) mp.time = (mp.length * seek.progress / 1000L)
                              dragging = false
                          }
                          override fun onProgressChanged(bar: SeekBar?, progress: Int, fromUser: Boolean) {}
                      })
                  }
                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER }
                  val playButton = Button(this).apply {
                      text = "Pause"
                      setOnClickListener {
                          val mp = player ?: return@setOnClickListener
                          if (mp.isPlaying) { mp.pause(); text = "Play" }
                          else { mp.play(); text = "Pause" }
                      }
                  }
                  val outputButton = Button(this).apply {
                      text = "Digital output: ON"
                      setOnClickListener {
                          digitalOutput = !digitalOutput
                          val ok = player?.setAudioDigitalOutputEnabled(digitalOutput) ?: false
                          text = "Digital output: " + if (digitalOutput) "ON" else "OFF"
                          status.text = "Digital output " + if (ok) "updated" else "setting not accepted"
                      }
                  }
                  val closeButton = Button(this).apply {
                      text = "Back"
                      setOnClickListener { finish() }
                  }
                  row.addView(playButton, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(outputButton, LinearLayout.LayoutParams(0, -2, 1.4f))
                  row.addView(closeButton, LinearLayout.LayoutParams(0, -2, 1f))
                  controls.addView(status)
                  controls.addView(position)
                  controls.addView(seek)
                  controls.addView(row)
                  root.addView(controls, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM))
                  setContentView(root)
                  try {
                      val vlc = LibVLC(this, arrayListOf("--no-video-title-show"))
                      libVlc = vlc
                      val mp = MediaPlayer(vlc)
                      player = mp
                      mp.attachViews(videoView, null, false, false)
                      mp.setAudioDigitalOutputEnabled(digitalOutput)
                      var resumeApplied = false
                      mp.setEventListener { event ->
                          if (event.type == MediaPlayer.Event.Playing && resumeAt > 0L && !resumeApplied) {
                              resumeApplied = true
                              mp.time = resumeAt
                          }
                          runOnUiThread {
                              when (event.type) {
                                  MediaPlayer.Event.Opening -> status.text = "LibVLC opening media…"
                                  MediaPlayer.Event.Playing -> status.text =
                                      if (resumeApplied) "LibVLC playing — resume restored" else "LibVLC playing"
                                  MediaPlayer.Event.Paused -> status.text = "Paused"
                                  MediaPlayer.Event.EndReached -> status.text = "Playback ended"
                                  MediaPlayer.Event.EncounteredError -> status.text = "LibVLC playback error"
                              }
                          }
                      }
                      val media = Media(vlc, uri)
                      try { mp.media = media } finally { runCatching { media.javaClass.getMethod("release").invoke(media) } }
                      mp.play()
                      handler.post(ticker)
                  } catch (e: Exception) {
                      Toast.makeText(this, "LibVLC error: " + (e.message ?: "unknown"), Toast.LENGTH_LONG).show()
                      finish()
                  }
              }
              override fun onStop() {
                  val mp = player
                  val uri = mediaUri
                  if (mp != null && uri != null) {
                      val current = mp.time.coerceAtLeast(0L)
                      val duration = mp.length
                      val edit = prefs.edit()
                      if (duration > 0L && current >= duration - 10000L || current < 5000L) {
                          edit.remove("pos|" + uri.toString())
                      } else {
                          edit.putLong("pos|" + uri.toString(), current)
                      }
                      edit.apply()
                  }
                  handler.removeCallbacks(ticker)
                  player?.let {
                      runCatching { it.stop() }
                      runCatching { it.setEventListener(null) }
                      runCatching { it.detachViews() }
                      runCatching { it.release() }
                  }
                  player = null
                  libVlc?.release()
                  libVlc = null
                  video = null
                  super.onStop()
              }
              private fun formatTime(ms: Long): String {
                  val total = ms / 1000L
                  val h = total / 3600L
                  val m = (total % 3600L) / 60L
                  val s = total % 60L
                  return if (h > 0L) "%d:%02d:%02d".format(h, m, s) else "%02d:%02d".format(m, s)
              }
          }
          EOF
      - name: Repair playback history persistence and home history list
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          if "KEY_HISTORY_PREFIX" not in s:
              raise SystemExit("History key constant is missing; refusing to create a disconnected history store")
          recorder = """    private fun recordPlaybackHistory(uri: Uri) {
                  val key = KEY_HISTORY_PREFIX + uri.toString()
                  prefs.edit()
                      .putString(KEY_LAST_URI, uri.toString())
                      .putLong(key, System.currentTimeMillis())
                      .apply()
              }
          """
          if "private fun recordPlaybackHistory(uri: Uri)" not in s:
              anchor = "    private fun selectMedia(uri: Uri) {"
              if anchor not in s:
                  raise SystemExit("Could not find selectMedia() for history repair")
              s = s.replace(anchor, recorder + anchor, 1)
          pattern = r"(    private fun selectMedia\(uri: Uri\) \{)(.*?)(\n    \})"
          m = re.search(pattern, s, re.S)
          if not m:
              raise SystemExit("Could not parse selectMedia()")
          body = m.group(2)
          body = re.sub(r"^\s*recordPlaybackHistory\(uri\)\s*$", "", body, flags=re.M)
          body = re.sub(r"^\s*prefs\.edit\(\)\.putString\(KEY_LAST_URI, uri\.toString\(\)\).*?$", "", body, flags=re.M)
          body = re.sub(r"^\s*prefs\.edit\(\)\.putString\(KEY_LAST_URI, uri\.toString\(\)\)\.putLong\(KEY_HISTORY_PREFIX.*?$", "", body, flags=re.M)
          if "mediaUri = uri" not in body:
              raise SystemExit("selectMedia() no longer assigns mediaUri")
          body = body.replace("mediaUri = uri", "mediaUri = uri\n        recordPlaybackHistory(uri)", 1)
          s = s[:m.start(2)] + body + s[m.end(2):]
          start = re.search(r"    private fun startPlayer\s*\([^)]*\)\s*\{", s)
          if start:
              after = start.end()
              if "recordPlaybackHistory" not in s[after:after+350]:
                  s = s[:after] + "\n        mediaUri?.let { recordPlaybackHistory(it) }" + s[after:]
          p.write_text(s)
          print("History now records both media selection and player start; home History list includes saved entries and last-played fallback.")
          PY

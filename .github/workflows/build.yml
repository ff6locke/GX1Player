                      gravity = Gravity.CENTER
                      setShadowLayer(3f, 2f, 2f, android.graphics.Color.BLACK)
                      visibility = View.GONE
                  }
                  root.addView(vlcSubtitleView, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL).apply {
                      bottomMargin = (32 * resources.displayMetrics.density).toInt()
                  })
              """
              if anchor not in s: raise SystemExit("root controls anchor missing")
              s=s.replace(anchor,anchor+"\n"+overlay.rstrip(),1)
          if "handler.post(vlcDynamicSubtitleTicker)" not in s:
              s=s.replace("            handler.post(ticker)","            handler.post(ticker)\n            handler.post(vlcDynamicSubtitleTicker)",1)
          # Discover same-basename external subtitle files automatically after VLC playback opens.
          # Place this next to the dynamic subtitle ticker, in the actual VLC Test activity.
          if "handler.postDelayed({ autoLoadMatchingSubtitles() }, 1500L)" not in s:

      - name: Render second subtitle as synchronized overlay
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          # Keep Media3 native rendering for subtitle 1; the custom overlay is only subtitle 2.
          field_anchor = "private var subtitleUri2: Uri? = null"
          player_anchor = "private var player: ExoPlayer? = null"
          fields = """
          private data class Gx1SubtitleCue(val startMs: Long, val endMs: Long, val text: String)
          private var firstSubtitleCues: List<Gx1SubtitleCue> = emptyList()
          private var secondSubtitleCues: List<Gx1SubtitleCue> = emptyList()
          private lateinit var secondSubtitleOverlay: android.widget.TextView
          private val subtitleUiHandler = android.os.Handler(android.os.Looper.getMainLooper())
          private val subtitleTicker = object : Runnable {
              override fun run() {
                  val pos = player?.currentPosition ?: 0L
                  val active = secondSubtitleCues.filter { pos >= it.startMs && pos <= it.endMs }
                  if (::secondSubtitleOverlay.isInitialized) {
                      secondSubtitleOverlay.text = active.joinToString("\\n") { it.text }
                      secondSubtitleOverlay.visibility =
                          if (active.isEmpty() || player?.isPlaying != true) android.view.View.GONE
                          else android.view.View.VISIBLE
                  }
                  subtitleUiHandler.postDelayed(this, 200L)
                  secondSubtitleOverlay.bringToFront()
                  secondSubtitleOverlay.elevation = 1000f
              }
          }
          """
          if "private data class Gx1SubtitleCue" not in s:
              if "private var subtitleUri2:" not in s:
                  if player_anchor not in s:
                      raise SystemExit("Could not find player field insertion point")
                  s = s.replace(player_anchor, player_anchor + "\n    private var subtitleUri2: Uri? = null", 1)
              s = s.replace(field_anchor, field_anchor + "\n    private fun subKey(uri: Uri) = KEY_SUBTITLE_1 + uri.toString()\n" + fields, 1)

          parser = r'''
          private fun parseExternalSubtitle(uri: Uri): List<Gx1SubtitleCue> {
              val bytes = contentResolver.openInputStream(uri)?.use { it.readBytes() }
                  ?: throw IllegalArgumentException("Subtitle file is empty or unreadable")
              val charset = when {
                  bytes.size >= 2 && bytes[0] == 0xFF.toByte() && bytes[1] == 0xFE.toByte() -> Charsets.UTF_16LE
                  bytes.size >= 2 && bytes[0] == 0xFE.toByte() && bytes[1] == 0xFF.toByte() -> Charsets.UTF_16BE
                  bytes.size >= 3 && bytes[0] == 0xEF.toByte() && bytes[1] == 0xBB.toByte() && bytes[2] == 0xBF.toByte() -> Charsets.UTF_8
                  bytes.size > 4 && bytes.take(40).count { it == 0.toByte() } > 5 -> Charsets.UTF_16LE
                  else -> Charsets.UTF_8
              }
              val raw = String(bytes, charset).removePrefix("\uFEFF")
                  .replace("\u0000", "").replace("\r\n", "\n").replace('\r', '\n')
              val cues = mutableListOf<Gx1SubtitleCue>()

              // SubStation Alpha / Advanced SubStation Alpha (.ssa/.ass)
              if (raw.contains("[Events]", ignoreCase = true)) {
                  val lines = raw.lines()
                  var format = listOf("Layer", "Start", "End", "Style", "Name", "MarginL",
                      "MarginR", "MarginV", "Effect", "Text")
                  val timePattern = Regex("""^(\d+):(\d{2}):(\d{2})[.](\d{1,2})$""")
                  fun assMs(value: String): Long {
                      val m = timePattern.matchEntire(value.trim())
                          ?: throw IllegalArgumentException("Invalid ASS timestamp: $value")
                      val fraction = m.groupValues[4].padEnd(2, '0').toLong() * 10L
                      return ((m.groupValues[1].toLong() * 3600 +
                          m.groupValues[2].toLong() * 60 + m.groupValues[3].toLong()) * 1000) + fraction
                  }
                  for (line in lines) {
                      val t = line.trim()
                      if (t.startsWith("Format:", true)) {
                          format = t.substringAfter(':').split(',').map { it.trim() }
                      } else if (t.startsWith("Dialogue:", true)) {
                          val fields = t.substringAfter(':').split(',', limit = format.size)
                          val startIndex = format.indexOfFirst { it.equals("Start", true) }
                          val endIndex = format.indexOfFirst { it.equals("End", true) }
                          val textIndex = format.indexOfFirst { it.equals("Text", true) }
                          if (startIndex < 0 || endIndex < 0 || textIndex < 0 ||
                              fields.size <= maxOf(startIndex, endIndex, textIndex)) continue
                          val begin = assMs(fields[startIndex])
                          val finish = assMs(fields[endIndex])
                          val caption = fields[textIndex]
                              .replace(Regex("""\\\\[Nn]"""), "\n")
                              .replace(Regex("""\{[^}]*}"""), "")
                              .replace(Regex("<[^>]*>"), "")
                              .trim()
                          if (caption.isNotBlank() && finish > begin) {
                              cues.add(Gx1SubtitleCue(begin, finish, caption))
                          }
                      }
                  }
              } else {
                  // SubRip (.srt)
                  val time = Regex("""(?i)(?:(\\d{1,2}):)?(\\d{1,2}):(\\d{2})[,.](\\d{1,3})""")
                  fun toMs(value: String): Long {
                      val m = time.find(value) ?: return 0L
                      val hours = m.groupValues[1].ifBlank { "0" }.toLong()
                      val minutes = m.groupValues[2].toLong()
                      val seconds = m.groupValues[3].toLong()
                      val fraction = m.groupValues[4].padEnd(3, '0').take(3).toLong()
                      return (((hours * 60 + minutes) * 60 + seconds) * 1000) + fraction
                  }
                  val lines = raw.lines()
                  var i = 0
                  while (i < lines.size) {
                      val line = lines[i].trim().removePrefix("\uFEFF")
                      val arrow = line.indexOf("-->")
                      if (arrow >= 0) {
                          val left = line.substring(0, arrow).trim()
                          val right = line.substring(arrow + 3).trim().substringBefore(' ')
                          val begin = time.find(left)
                          val finish = time.find(right)
                          if (begin != null && finish != null) {
                              val startMs = toMs(begin.value)
                              val endMs = toMs(finish.value)
                              val body = mutableListOf<String>()
                              i++
                              while (i < lines.size && !lines[i].contains("-->")) {
                                  val captionLine = lines[i].trim()
                                  if (captionLine.isNotBlank() && !captionLine.matches(Regex("""\\d+"""))) {
                                      body.add(captionLine.replace(Regex("<[^>]*>"), "").trim())
                                  }
                                  i++
                              }
                              val caption = body.joinToString("\n").trim()
                              if (caption.isNotBlank() && endMs > startMs) {
                                  cues.add(Gx1SubtitleCue(startMs, endMs, caption))
                              }
                              continue
                          }
                      }
                      i++
                  }
              }
              if (cues.isEmpty()) {
                  val format = if (raw.contains("[Events]", true)) "ASS/SSA" else "SRT"
                  throw IllegalArgumentException("No valid $format subtitle cues found. Check the file format and Events/Dialogue timestamps.")
              }
              return cues
          }

          private fun loadSecondSubtitleOverlay(uri: Uri) {
              try {
                  secondSubtitleCues = parseExternalSubtitle(uri)
                  subtitleUiHandler.removeCallbacks(subtitleTicker)
                  subtitleUiHandler.post(subtitleTicker)
                  Toast.makeText(this, "Subtitle 2 loaded: ${secondSubtitleCues.size} cues", Toast.LENGTH_LONG).show()
              } catch (e: Exception) {
                  secondSubtitleCues = emptyList()
                  Toast.makeText(this, "Subtitle 2 error: ${e.message}", Toast.LENGTH_LONG).show()
              }
          }

          '''
          if "private fun loadSecondSubtitleOverlay" not in s:
              marker = "    private fun showMenu() {"
              if marker not in s: raise SystemExit("showMenu insertion point missing")
              s = s.replace(marker, parser + marker, 1)

          # The current project selects the destination slot before launching
          # the shared picker. Attach the overlay only when slot 2 is selected.
          second_picker_at = s.find("subtitle2Uri = uri")
          if second_picker_at < 0:
              raise SystemExit("Second subtitle picker assignment not found")
          second_picker_start = s.find("startPlayer()", second_picker_at)
          if second_picker_start < 0 or second_picker_start - second_picker_at > 1600:
              raise SystemExit("Second subtitle picker startPlayer callback not found")
          if "loadSecondSubtitleOverlay(uri)" not in s[second_picker_at:second_picker_start]:
              s = s[:second_picker_start] + "loadSecondSubtitleOverlay(uri)\n              " + s[second_picker_start:]
          # Add the overlay above the video surface in the root FrameLayout.
          anchor = "homePanel = buildHomePanel()"
          overlay = """secondSubtitleOverlay = android.widget.TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 22f
                      gravity = Gravity.CENTER
                      // Transparent subtitle text: no black outline, shadow, or background.
                      setPadding(24, 8, 24, 28)
                      visibility = View.GONE
                  }
                  root.addView(secondSubtitleOverlay, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                  ))
                  subtitleUiHandler.post(subtitleTicker)
                  homePanel = buildHomePanel()"""
          if "secondSubtitleOverlay = android.widget.TextView(this)" not in s:
              if anchor not in s: raise SystemExit("Could not find home panel insertion point")
              s = s.replace(anchor, overlay, 1)
          # The source archive may already provide a no-argument loader; normalize every picker call to it.
          s = s.replace("loadSecondSubtitleOverlay(uri)", "loadSecondSubtitleOverlay()")
          p.write_text(s)
          print("Second subtitle now uses an independent ASS/SRT overlay synchronized to player position.")
          PY

      - name: Make Back return home and add an Open video controller shortcut
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()

          # Back should never open the playback menu. Dismiss an open popup first;
          # otherwise leave playback and return to the home panel.
          old = """          override fun handleOnBackPressed() {
                          showMenu()
                      }"""
          new = """          override fun handleOnBackPressed() {
                          if (menuPopupRef?.isShowing == true) {
                              menuPopupRef?.dismiss()
                              return
                          }
                          if (::homePanel.isInitialized && homePanel.visibility == View.VISIBLE) {
                              finish()
                              return
                          }
                          player?.let { savePosition(it); it.pause() }
                          if (::playerView.isInitialized) playerView.visibility = View.GONE
                          if (::homePanel.isInitialized) homePanel.visibility = View.VISIBLE
                      }"""
          if old in s:
              s = s.replace(old, new, 1)
          elif "override fun handleOnBackPressed()" in s:
              start = s.index("override fun handleOnBackPressed()")
              body_start = s.index("{", start)
              depth = 0
              end = body_start
              for end in range(body_start, len(s)):
                  if s[end] == "{": depth += 1
                  elif s[end] == "}":
                      depth -= 1
                      if depth == 0:
                          break
              s = s[:body_start] + new[new.index("{"):new.rindex("}")+1] + s[end+1:]
          else:
              raise SystemExit("Back callback not found; refusing unsafe patch")

          # The Open video controller icon is inserted beside the Media3 gear above.
          p.write_text(s)
          print("Back returns home; Open video icon is attached beside Media3 gear.")
          PY


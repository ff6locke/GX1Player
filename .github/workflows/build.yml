name: Build GX1 Player APK
on:
  push:
    branches: [ main, aspect-ratio-parity, media3-repeat-fix, claudeGX ]
    paths:
      - 'gx1-player.zip'
      - '.github/workflows/build.yml'
      - '.github/actions/gx1-build/action.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch containing the GX1 Player source to build
        required: false
        default: claudeGX
        type: string
concurrency:
  group: gx1-player-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZIP_FILE: gx1-player.zip
      PROJECT_DIR: gx1-player
      GRADLE_VERSION: '8.7'
    steps:
      - uses: actions/checkout@v4
      - name: Build GX1 Player
        uses: ./.github/actions/gx1-build
        with:
          source_branch: ${{ inputs.source_branch || github.ref }}
          android_keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          android_keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android_key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android_key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}

          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          import re
          pattern = r'(?m)^\s*val audioGroups = exo\.currentTracks\.groups\.filter \{\s*it\.type == androidx\.media3\.common\.C\.TRACK_TYPE_AUDIO\s*\}\s*val choices = mutableListOf<Pair<androidx\.media3\.common\.TrackGroup, Int>>\(\)'
          new = """                  val allGroups = exo.currentTracks.groups
                  val audioGroups = allGroups.filter {
                      it.type == androidx.media3.common.C.TRACK_TYPE_AUDIO
                  }
                  if (audioGroups.isEmpty()) {
                      val report = buildString {
                          appendLine("Media3 has not exposed any embedded audio track to GX1 Player.")
                          appendLine()
                          appendLine("Track groups detected: ${allGroups.size}")
                          for (group in allGroups) {
                              appendLine("Group type=${group.type}, tracks=${group.length}")
                              for (index in 0 until group.length) {
                                  val f = group.getTrackFormat(index)
                                  appendLine("  MIME=${f.sampleMimeType ?: "unknown"}")
                                  appendLine("  codecs=${f.codecs ?: "none"}, language=${f.language ?: "und"}")
                                  appendLine("  label=${f.label ?: "none"}, channels=${f.channelCount}")
                              }
                          }
                          if (allGroups.isEmpty()) append("No Media3 track groups are available yet. Wait until playback starts, then reopen Audio track.")
                      }
                      AlertDialog.Builder(this)
                          .setTitle("Embedded audio not detected")
                          .setMessage(report)
                          .setPositiveButton("OK", null)
                          .show()
                      return
                  }
                  val choices = mutableListOf<Pair<androidx.media3.common.TrackGroup, Int>>()"""
          s, n = re.subn(pattern, new, s, count=1)
          if n != 1:
              raise SystemExit("Could not locate audio selector with whitespace-tolerant match")
          p.write_text(s)

          # Restrict native packaging to the ARM64 RockTek GX1 target.
          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text()
          if "abiFilters" not in g:
              marker = "    defaultConfig {"
              if marker not in g:
                  raise SystemExit("Could not locate defaultConfig in app/build.gradle.kts")
              g = g.replace(marker, marker + """
                  ndk {
                      abiFilters += setOf("arm64-v8a")
                  }""", 1)
              gradle.write_text(g)
          print("Added embedded audio diagnostics and arm64-only native packaging.")
          PY

      - name: Add VLC-style built-in subtitle track list
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          marker = "    private fun showMenu() {"
          method = r'''    private fun showSubtitleTrackSelection() {
                  val exo = player
                  if (exo == null) {
                      Toast.makeText(this, "No player is active.", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val allGroups = exo.currentTracks.groups
                  val textGroups = allGroups.filter {
                      it.type == androidx.media3.common.C.TRACK_TYPE_TEXT
                  }
                  val hasEmbeddedTracks = textGroups.isNotEmpty()
                  val choices = mutableListOf<Pair<androidx.media3.common.TrackGroup, Int>>()
                  val labels = mutableListOf<String>()
                  if (hasEmbeddedTracks) labels.add("Off")
                  for (group in textGroups) {
                      for (index in 0 until group.length) {
                          val supported = group.isTrackSupported(index)
                          val format = group.getTrackFormat(index)
                          val language = format.language
                              ?.takeIf { it.isNotBlank() && it != "und" }
                              ?.let { java.util.Locale.forLanguageTag(it).getDisplayLanguage(java.util.Locale.getDefault()) }
                              ?.takeIf { it.isNotBlank() }
                          val details = listOfNotNull(
                              format.label?.takeIf { it.isNotBlank() },
                              language
                          ).distinct().joinToString(" · ")
                          // Never expose internal MIME names such as x-media3-cues in the subtitle list.
                          val trackName = if (details.isBlank()) "Embedded subtitle ${choices.size + 1}" else details
                          labels.add(trackName + if (supported) "" else " (unsupported by current decoder)")
                          choices.add(group.mediaTrackGroup to index)
                      }
                  }
                  val selected = run {
                      var flat = 0
                      var found = 0
                      loop@ for (group in textGroups) {
                          for (index in 0 until group.length) {
                              if (group.isTrackSelected(index)) {
                                  found = flat + 1
                                  break@loop
                              }
                              flat++
                          }
                      }
                      found
                  }
                  val items = labels.toMutableList().apply {
                      add("Load custom subtitle 1…")
                      add("Load custom subtitle 2…")
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Subtitle")
                      .setSingleChoiceItems(items.toTypedArray(), selected) { dialog, which ->
                          when {
                              hasEmbeddedTracks && which == 0 -> {
                                  val params = exo.trackSelectionParameters.buildUpon()
                                      .clearOverridesOfType(androidx.media3.common.C.TRACK_TYPE_TEXT)
                                      .setTrackTypeDisabled(androidx.media3.common.C.TRACK_TYPE_TEXT, true)
                                  exo.trackSelectionParameters = params.build()
                                  dialog.dismiss()
                              }
                              hasEmbeddedTracks && which <= choices.size -> {
                                  val (trackGroup, trackIndex) = choices[which - 1]
                                  val selectedGroup = textGroups.firstOrNull { it.mediaTrackGroup === trackGroup }
                                  if (selectedGroup != null && !selectedGroup.isTrackSupported(trackIndex)) {
                                      Toast.makeText(this, "This embedded subtitle format is not supported by the current decoder.", Toast.LENGTH_LONG).show()
                                      return@setSingleChoiceItems
                                  }
                                  val params = exo.trackSelectionParameters.buildUpon()
                                      .clearOverridesOfType(androidx.media3.common.C.TRACK_TYPE_TEXT)
                                      .setTrackTypeDisabled(androidx.media3.common.C.TRACK_TYPE_TEXT, false)
                                      .addOverride(androidx.media3.common.TrackSelectionOverride(trackGroup, listOf(trackIndex)))
                                  exo.trackSelectionParameters = params.build()
                                  dialog.dismiss()
                              }
                              which == choices.size + (if (hasEmbeddedTracks) 1 else 0) -> {
                                  dialog.dismiss()
                                  pickSubtitle.launch(arrayOf("application/x-subrip", "text/vtt", "text/plain", "application/octet-stream"))
                              }
                              else -> {
                                  dialog.dismiss()
                                  pickSubtitle2.launch(arrayOf("application/x-subrip", "text/vtt", "text/plain", "application/octet-stream"))
                              }
                          }
                      }
                      .setNegativeButton("Close", null)
                      .show()
              }

          '''
          if "private fun showSubtitleTrackSelection()" not in s:
              if marker not in s:
                  raise SystemExit("Could not find showMenu() insertion point for subtitle selector")
              s = s.replace(marker, method + marker, 1)

          # Do not rewrite the floating gear-menu branch by scanning to the next
          # generic .show(): nested dialogs make that boundary ambiguous and can
          # delete unrelated methods. Keep the existing menu implementation intact.

          # Match build #285: route the floating gear's Subtitle action to the
          # Media3 embedded-track selector, while keeping both external subtitle slots.
          old_subtitle_action = '''"subtitle" -> AlertDialog.Builder(this)
                                  .setTitle("Load subtitles")
                                  .setItems(arrayOf("Load subtitle 1", "Load subtitle 2")) { _, which ->
                                      val types = arrayOf("application/x-subrip", "text/vtt", "text/plain", "application/octet-stream")
                                      if (which == 0) pickSubtitle.launch(types) else pickSubtitle2.launch(types)
                                  }
                                  .show()'''
          new_subtitle_action = '''"subtitle" -> {
                                  menuPopupRef?.dismiss()
                                  showSubtitleTrackSelection()
                              }'''
          if old_subtitle_action in s:
              s = s.replace(old_subtitle_action, new_subtitle_action, 1)
          elif '"subtitle" -> showSubtitleTrackSelection()' not in s and '"subtitle" -> {' not in s:
              raise SystemExit("Could not find floating playback Subtitle action")
          # Keep legacy-menu fallback for source variants that still use it.
          menu_anchor = '        add("Load Subtitle 1 (.srt / .ass)") {'
          menu_entry = '        add("Built-in subtitle tracks") { showSubtitleTrackSelection() }\n'
          if 'add("Built-in subtitle tracks")' not in s:
              if menu_anchor not in s:
                  print("Legacy custom subtitle menu anchor not present; skipping legacy menu entry.")
              else:
                  s = s.replace(menu_anchor, menu_entry + menu_anchor, 1)
          p.write_text(s)
          print("Added embedded subtitle tracks plus separate custom subtitle 1 and 2 entries.")
          PY


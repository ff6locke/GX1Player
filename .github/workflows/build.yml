      - name: Restore the last known LibVLC instance configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/playback/Gx1LibVlcEngine.kt")
          s = p.read_text()
          start = s.find("    private val libVlc = LibVLC(appContext, arrayListOf(")
          end = s.find("    private val mediaPlayer = MediaPlayer(libVlc)", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate LibVLC constructor boundaries; refusing unsafe edit")
          # Return to the exact empty-options configuration that initialized successfully in Build 706.
          restored = '    private val libVlc = LibVLC(appContext, arrayListOf<String>())\n'
          s = s[:start] + restored + s[end:]
          p.write_text(s)
          print("Restored the prior LibVLC options and Android video-output selection.")
          PY
      - name: Report exact LibVLC startup failure stage
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/playback/Gx1LibVlcEngine.kt")
          s = p.read_text()
          start_marker = "    private val libVlc = LibVLC("
          player_marker = "    private val mediaPlayer = MediaPlayer(libVlc)"
          if s.count(start_marker) != 1 or s.count(player_marker) != 1:
              raise SystemExit("Expected one LibVLC property and one MediaPlayer property")
          start = s.index(start_marker)
          player = s.index(player_marker, start)
          close = s.rfind("})", start, player)
          close_len = 2
          if close < 0:
              close = s.rfind(")", start, player)
              close_len = 1
          if close < 0:
              raise SystemExit("Could not locate LibVLC constructor closing parenthesis")
          constructor = s[start:close + close_len]
          constructor = constructor.replace(start_marker, "    private val libVlc = try { LibVLC(", 1)
          wrapped = constructor + """ } catch (t: Throwable) {
                  throw IllegalStateException(
                      "LibVLC instance creation failed: " + t.javaClass.name + ": " + (t.message ?: "no message"),
                      t
                  )
              }"""
          s = s[:start] + wrapped + "\n" + s[close + close_len:player] + """    private val mediaPlayer = try { MediaPlayer(libVlc) } catch (t: Throwable) {
                  throw IllegalStateException(
                      "LibVLC MediaPlayer creation failed: " + t.javaClass.name + ": " + (t.message ?: "no message"),
                      t
                  )
              }""" + s[player + len(player_marker):]
          p.write_text(s)
          print("LibVLC and MediaPlayer construction now report distinct failure stages.")
          PY
      - name: Show complete LibVLC startup exception
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/gx1player/MainActivity.kt")
          s = p.read_text()
          old = '        Toast.makeText(this, "LibVLC failed; switched back to Media3: " + (e.message ?: e.javaClass.simpleName), Toast.LENGTH_LONG).show()'
          new = """        val failureDetails = generateSequence(e as Throwable?) { it.cause }
                      .mapIndexed { index, cause ->
                          (index + 1).toString() + ". " + cause.javaClass.name + ": " +
                              (cause.message ?: "no message")
                      }
                      .joinToString("\\n")
                  android.app.AlertDialog.Builder(this)
                      .setTitle("LibVLC startup failed")
                      .setMessage("Playback is falling back to Media3. Full error details:\\n\\n" + failureDetails)
                      .setPositiveButton("OK", null)
                      .show()"""
          if s.count(old) != 1:
              raise SystemExit("Expected exactly one LibVLC fallback Toast to replace")
          s = s.replace(old, new, 1)
          p.write_text(s)
          print("Replaced truncated Toast with a dialog showing the full exception cause chain.")
          PY
